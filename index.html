","종결단계"]},{"id":"bk20170305-87","r":"bk20170305","n":87,"s":4,"q":"상담자의 바람직한 상담기술과 가장 거리가 먼 것은?","a":3,"o":["내담자에 대한 상담자의 정서적인 반응을 반영하는 자기관련 진술을 적절히 시행한다.","내담자의 음성언어 및 신체언어에 대해 비판단적이고 진지하게 반응해야 한다.","치료적 직면은 돌봄의 과정 속에서 도전이 아닌 분명하게 하기 위한 목적으로 사용되어야 한다.","상담 초기에는 찬반을 내포하지 않는 최소의 촉진적 반응은 될 수 있는 대로 하지 않는다."]},{"id":"bk20170305-88","r":"bk20170305","n":88,"s":4,"q":"심리상담에 관한 설명으로 옳은 것은?","a":0,"o":["내담자의 자각확장이 이루어지도록 조력하는 활동이다.","상담자의 가치관을 중심으로 성과가 산출되도록 해야 한다.","조력과정으로 결과를 강조하는 활동이어야 한다.","상담자의 전문적 훈련이 실제 상담과정과 무관하여야 한다."]},{"id":"bk20170305-90","r":"bk20170305","n":90,"s":4,"q":"자신조차 승인할 수 없는 욕구나 인격특성을 타인이나 사물로 전환시킴으로써 자신의 바람직하지 않은 욕구를 무의식적으로 감추려는 방어기제는?","a":2,"o":["동일화","합리화","투사","승화"]},{"id":"bk20170305-92","r":"bk20170305","n":92,"s":4,"q":"특수한 진단을 피하고, 직업적 역할 속에서 자아(self)의 개념을 명백히 하고 실행할 수 있도록 돕는 직업상담의 이론은?","a":2,"o":["특성-요인 직업상담","정신역동적 직업상담","내담자중심 직업상담","행동주의 직업상담"]},{"id":"bk20170305-93","r":"bk20170305","n":93,"s":4,"q":"자살을 하거나 시도하는 학생들에게 공통적으로 나타나는 성격특성과 가장 거리가 먼 것은?","a":2,"o":["부정적 자아개념","부족한 의사소통 기술","과도한 신중성","부적절한 대처 기술"]},{"id":"bk20170305-94","r":"bk20170305","n":94,"s":4,"q":"성폭력 피해자에 대한 인지적 단기상담을 실시할 때 상담의 효과를 유지시키기 위한 방법으로 적합하지 않은 것은?","a":2,"o":["상담을 통한 체험을 일반화하도록 도와준다.","자기와의 대화내용을 검토하고 잘못된 자기대화를 고치도록 한다.","문제가 재발하지 않는다고 확신을 준다.","사회적인 지지를 해준다."]},{"id":"bk20170305-95","r":"bk20170305","n":95,"s":4,"q":"우울한 사람들이 보이는 체계적인 사고의 오류 중 결론을 지지하는 증거가 없거나 증거가 결론과 배치되는데도 불구하고 어떤 결론을 이끌어 내는 과정을 의미하는 인지적 오류는?","a":0,"o":["임의적 추론(arbitrary inference)","과잉 일반화(overgeneralization)","개인화(personalization)","선택적 추상화(selective abstraction)"]},{"id":"bk20170305-96","r":"bk20170305","n":96,"s":4,"q":"상담의 구조화에 관한 설명으로 틀린 것은?","a":3,"o":["상담의 다음 진행과정 에 대한 내담자의 두려움이나 궁금증을 줄일 수 있다.","구조화는 상담 초기뿐만 아니라 전체 과정에서 진행될 수 있다.","상담의 효과를 최대한으로 높이기 위해 행해진다.","상담에서 다루려는 내용을 구체적으로 정의하는 작업이다."]},{"id":"bk20170305-97","r":"bk20170305","n":97,"s":4,"q":"Adler의 개인심리학적 상담에 대한 설명으로 틀린 것은?","a":1,"o":["Adler는 일반적으로 인간이 열등감을 갖는 것은 필요하고 바람직하기까지 하다고 보았다.","Freud와 마찬가지로 Adler도 인간의 목표를 중시하면서 주관적 요인을 강조하였다.","Adler는 신경증, 정신병, 범죄 등 모든 문제의 원인은 사회적 관심의 부재라고 보았다.","Adler는 생활양식을 개인 및 사회의 정신병리를 일으키는 주요 요인으로 보았다."]},{"id":"bk20170305-98","r":"bk20170305","n":98,"s":4,"q":"생애기술 상담이론에서 기술언어(skills language)에 해당하는 것은?","a":3,"o":["내담자가 어떻게 생각하고 느끼는가를 의미하는 것이다.","내담자가 어떤 외현적 행동을 하는가를 의미하는 것이다.","내담자 자신의 책임감 있는 삶을 의미하는 것이다.","내담자의 행동을 설명하고 분석하기 위해 사용하는 것을 의미하는 것이다."]},{"id":"bk20170305-99","r":"bk20170305","n":99,"s":4,"q":"상담자의 윤리에 관한 설명으로 틀린 것은?","a":3,"o":["비밀보장은 상담진행 과정 중 가장 근본적인 윤리기준이다.","내담자의 윤리는 개인 상담뿐만 아니라 집단 상담이나 가족 상담에서도 고려되어야 한다.","상담여부를 결정하는 것은 내담자이며 상담자는 내담자에게 정확한 정보를 제공해야 한다.","상담이론과 기법은 반복적으로 검증된 것이므로 시대 및 사회여건과 무관하게 적용해야 한다."]},{"id":"bk20170305-100","r":"bk20170305","n":100,"s":4,"q":"청소년 약물 남용에 대한 설명으로 틀린 것은?","a":0,"o":["우리나라 청소년의 흡연 비율은 아직 선진국보다 매우 낮은 편이다.","음주나 흡연을 하는 부모의 자녀는 음주나 흡연의 가능성이 높은 편이다.","또래 집단이 약물을 사용할 때, 같은 집단의 다른 청소년도 약물을 사용할 가능성이 있다.","흡연의 조기 시작은 본드나 마약 등의 약물 남용으로 발전될 가능성이 있다."]},{"id":"bk20170826-1","r":"bk20170826","n":1,"s":0,"q":"실험법에 관한 설명으로 틀린 것은?","a":3,"o":["심리학이 과학적인 학문을 발전하는데 큰 기여를 했다.","다른 조건들을 일정하게 고정시키는 것을 통제라고 한다.","독립변인이 어떻게 결과에 영향을 미치는지를 알아보기 위한 조작을 처치라고 한다.","가외변인을 통제하기 어렵다는 문제점이 있다."]},{"id":"bk20170826-2","r":"bk20170826","n":2,"s":0,"q":"동조에 관한 설명으로 옳은 것은?","a":2,"o":["집단의 크기에 비례하여 동조의 가능성이 증가한다.","과제가 쉬울수록 동조가 많이 일어난다.","개인이 집단에 매력을 느낄수록 동조하는 경향이 더 높다.","집단에 의해서 완전하게 수용 받고 있다고 느낄수록 동조하는 경향이 더 크다."]},{"id":"bk20170826-3","r":"bk20170826","n":3,"s":0,"q":"초자아에 대한 설명으로 틀린 것은?","a":3,"o":["사회의 가치와 도덕에 관한 내면화된 표상이다.","부모가 주는 상과 처벌에 대한 반응에 의해 발달한다.","도덕성 원리에 의해 작용한다.","본질적으로 성격의 집행자이다."]},{"id":"bk20170826-4","r":"bk20170826","n":4,"s":0,"q":"싫어하는 사람을 과도하게 친절하게 대하는 것은 어떤 방어기제인가?","a":2,"o":["승화","합리화","반동형성","전위"]},{"id":"bk20170826-5","r":"bk20170826","n":5,"s":0,"q":"여러 상이한 연령에 속하는 사람들로부터 동시에 어떤 특성에 대한 자료를 얻고, 그 결과를 연령 간 비교하여 발달적 변화과정을 추론하는 연구방법은?","a":1,"o":["종단적 연구방법","횡단적 연구방법","교차비교 연구방법","단기종단적 연구방법"]},{"id":"bk20170826-6","r":"bk20170826","n":6,"s":0,"q":"잔소리하는 어머니로부터 벗어나기 위해 집 밖에서 머무르는 시간이 증가하는 것은 조작적 조건형성 ,"s":2,"q":"신경심리검사의 해석에 관한 설명으로 옳은 것은?","a":2,"o":["반응의 질적 측면은 해석에서 배제된다.","피검사자의 정서적 및 성격적 특징은 해석에서 고려되지 않는다.","과제에 접근하는 방식과 검사자와의 상호작용 양상도 해석적 자료가 된다.","과거의 기능에 관한 정보는 배제하고 현재의 기능에 초점을 맞추어 평가한다."]},{"id":"bk20170826-44","r":"bk20170826","n":44,"s":2,"q":"BGT(Bender Gestalt Test)의 장점에 관한 설명으로 틀린 것은?","a":1,"o":["피검사자의 뇌기능 장애 평가에 유용하다.","자기 자신을 과장되게 표현하려는 피검사자에게 유용하다.","적절하게 말할 수 있는 능력이 없거나 말할 수 있는 능력은 있으나 얘기를 하기 싫어할 때 유용하다.","피검사자가 말로 의사소통을 할 능력이 충분히 있더라도 언어적 행동으로 성격의 강점과 약점에 관한 정보를 얻기 힘들 때 유용하다."]},{"id":"bk20170826-45","r":"bk20170826","n":45,"s":2,"q":"두정엽의 병변과 가장 관련이 있는 장애는?","a":0,"o":["구성 장애","시각양식의 장애","청각기능의 장애","고차적인 인지적 추론의 장애"]},{"id":"bk20170826-47","r":"bk20170826","n":47,"s":2,"q":"기억장애를 보이고 있는 환자에게 기억 및 학습능력을 평가하는데 가장 적합한 것은?","a":0,"o":["K-WMS-IV","SCL-90-R","Face-Hand Test","Trail Making Test"]},{"id":"bk20170826-48","r":"bk20170826","n":48,"s":2,"q":"지능검사 시행에 관한 설명으로 옳은 것은?","a":0,"o":["지능검사는 표준절차를 따르되 개인의 최대 능력을 측정하는 것을 목표로 한다.","지능검사 시행에서 수검자에 대한 행동 관찰은 별로 중요하지 않다.","지능검사 시행에서 검사에 대한 동기는 결과에 영향을 미치지 않는다.","검사가 시행되는 환경적 조건은 지능검사 결과에 별로 영향을 미치지 않는다."]},{"id":"bk20170826-49","r":"bk20170826","n":49,"s":2,"q":"심리검사의 시행에 관한 설명으로 옳은 것은?","a":2,"o":["표준절차 외에 자신만의 효과적인 절차를 사용한다.","중립적 검사시행을 위해 라포 형성은 가급적 배제되어야 한다.","표준절차 외의 부가적 절차로 산출된 결과는 규준에 의거하여 해석하지 않는다.","검사를 자동화된 컴퓨터 검사로 전환한 경우 원 검사에 대한 전문적 훈련은 요구되지 않는다."]},{"id":"bk20170826-50","r":"bk20170826","n":50,"s":2,"q":"다음 아동용 심리검사 중 실시 목적이 나머지 셋과 다른 것은?","a":3,"o":["운동성 가족화 검사(KFD)","아동용 주제통각검사(CAT)","집-나무-사람 그림 검사(HTP)","코너스 평정척도(Conners Rating Scale)"]},{"id":"bk20170826-51","r":"bk20170826","n":51,"s":2,"q":"TAT(주제통각검사)에 관한 설명으로 틀린 것은?","a":2,"o":["TAT 성인용 도판은 남성용, 여성용, 남녀 공용으로 나누어진다.","TAT는 대인관계상의 역동적인 측면을 파악하는데 유용하다.","TAT는 준거조율전략(criterion keying strategy)을 통해 개발되었다.","TAT 반응은 순수한 지각반응이 아닌 개인의 선행경험과 공상적 체험이 혼합된 통각적 과정이다."]},{"id":"bk20170826-52","r":"bk20170826","n":52,"s":2,"q":"모집단에서 규준집단을 표집하는 방법과 가장 거리가 먼 것은?","a":2,"o":["군집표집(cluster sampling)","유층표집(stratified sampling)","비율표집(ratio sampling)","단순무선표집(simple random sampling)"]},{"id":"bk20170826-53","r":"bk20170826","n":53,"s":2,"q":"집단용 지능검사의 특징으로 옳은 것은?","a":1,"o":["개인용 검사에 비해 임상적인 유용성이 높다.","선별검사(screening test)로 사용하기에 적합하다.","대규모 실시로 실시와 채점, 해석이 상대적으로 어렵다.","개인용 검사에 비해 지적 기능을 보다 신뢰성 있게 파악할 수 있다."]},{"id":"bk20170826-54","r":"bk20170826","n":54,"s":2,"q":"MMPI-2의 타당도 척도에 해당되지 않는 것은?","a":1,"o":["S 척도","D 척도","F(b) 척도","무응답 척도"]},{"id":"bk20170826-55","r":"bk20170826","n":55,"s":2,"q":"K-VMI-6(시각-운동 통합 검사)에 관한 설명으로 가장 적합한 것은?","a":3,"o":["BGT에 비해 전반적으로 문항의 난이도가 높다.","BGT에 비해 전반적으로 문항의 난이도가 낮다.","사용대상 연령은 만 2세~5세 까지로 대상 연령의 폭이 비교적 좁다.","만 2세에서부터 노인에 이르기까지 폭넓은 연령에서 실시할 수 있다."]},{"id":"bk20170826-56","r":"bk20170826","n":56,"s":2,"q":"표집 시 남녀 비율을 정해놓고 표집 해야 하는 경우에 가장 적합한 방법은?","a":1,"o":["군집표집(duster sampling)","유층표집(stratified sampling)","체계적 표집(systematic sampling)","구체적 표집(specific sampling)"]},{"id":"bk20170826-57","r":"bk20170826","n":57,"s":2,"q":"MMPI-2의 타당도 척도 중 비전형성을 측정하는 척도에서 증상타당성을 의미하는 척도는?","a":1,"o":["TRIN","FBS","F(P)","F"]},{"id":"bk20170826-58","r":"bk20170826","n":58,"s":2,"q":"적성검사에 대한 설명으로 틀린 것은?","a":2,"o":["GATB는 대표적인 진로적성검사이다.","적성검사는 개인의 직업선택에도 활용된다.","적성과 지능은 측정하는 구성요인이 서로 겹치지 않는다.","적성검사는 하나의 검사로 다양한 능력 영역을 측정할 수 있는 이점이 있다."]},{"id":"bk20170826-59","r":"bk20170826","n":59,"s":2,"q":"다음 중 지능에 관한 일반적인 정의와 가장 거리가 먼 것은?","a":2,"o":["지능이란 적응능력이다.","지능이란 학습능력이다.","지능이란 기억능력이다.","지능은 총합적 ‧ 전체적 능력이다."]},{"id":"bk20170826-60","r":"bk20170826","n":60,"s":2,"q":"MMPI 타당도 척도 중 L과 K 척도는 T점수로 50에서 60사이 이고 F척도는 70이상인 점수를 얻은 사람의 특징으로 적합한 것은?","a":3,"o":["지나친 방어적 태도 때문에 면담하기 어려운 사람이다.","감정을 억제하고 있으며, 행동을 적절하게 통제하고 있다.","경험하는 스트레스의 정도가 미미하며, 사회적 상황에 효율적으로 대처하는 사람이다.","자신의 문제를 인정하는 동시에 그런 문제와 관련하여 자신을 방어하려고 애쓰는 사람이다."]},{"id":"bk20170826-61","r":"bk20170826","n":61,"s":3,"q":"인지치료에 대한 설명으로 틀린 것은?","a":2,"o":["개인의 문제는 잘못된 전제나 가정에 바탕을 둔 현실 왜곡에서 비롯된다.","개인이 지닌 왜곡된 인지는 학습 상의 결함에 근거를 둔다.","부정적인 자기개념에서 비롯된 자동적 사고들은 대부분 합리적인 사고들이다.","치료자는 왜곡된 사고를 풀어 주고 보다 현실적인 방식들을 학습하도록 도와준다."]},{"id":"bk20170826-62","r":"bk20170826","n":62,"s":3,"q":"치료자가 치료 초기에 rapport를 형성하기 위한 행동으로 바람직하지 않은 것은?","a":2,"o":["내담자를 가능한 한 인간으로 존중하려 했다.","너무 심문식으로 질문하지 않으려 했다.","치료시간을 넘기더라도 내담자가 충분히 이야기할 시간을 주었다.","내담자의 긴장을 풀어주기 위해 간단히 안부를 물었다."]},{"id":"bk20170826-63","r":"bk20170826","n":63,"s":3,"q":"생명유지에 필수적인 기능에서 고차원적 인지 기능으로 발달하는 뇌의 발달 단계를 순서대로 나열한 것은?","a":0,"o":["후뇌(교와 소뇌) → 수뇌(연수) → 중뇌 → 간뇌 → 종뇌","수뇌(연수) → 후뇌(교와 소뇌) → 중뇌 → 간뇌 → 종뇌","후뇌(교와 소뇌) → 중뇌 → 간뇌 → 종뇌 → 수뇌(연수)","수뇌(연수) → 간뇌 → 후뇌(교와 소뇌) → 중뇌 → 종뇌"]},{"id":"bk20170826-64","r":"bk20170826","n":64,"s":3,"q":"치료관계에서 얻은 내담자의 정보에 대한 비밀 보장의 예외적인 경우에 해당하지 않는 것은?","a":3,"o":["자해의 위험성이 있는 경우","제3자에게 위해가 가해질 우려가 있는 경우","감염성 질병이 있는 경우","내담자에게 알리지 않고 내담자의 정보를 책에 인용한 경우"]},{"id":"bk20170826-65","r":"bk20170826","n":65,"s":3,"q":"신경심리학적 기능을 연구하는 방법 중 비침습적인 방법에 해당하는 것은?","a":3,"o":["양전자방출단층촬영(PET)","국부 대뇌 혈류(rCBF)","심전극(Depth electrode)","전자 뇌 지도(Electrical brain mapping)"]},{"id":"bk20170826-66","r":"bk20170826","n":66,"s":3,"q":"정신상태검사(mental status examination) 면접에서 환자를 통해 평가하는 항목이 아닌 것은?","a":3,"o":["외모와 태도","지남력","정서의 유형과 적절성","가족관계"]},{"id":"bk20170826-67","r":"bk20170826","n":67,"s":3,"q":"행동이 보상을 받아 행동의 빈도가 증가하는 원리에 해당되지 않는 것은?","a":2,"o":["칭찬하기","금전 제공","관심 철수","토큰 경제"]},{"id":"bk20170826-68","r":"bk20170826","n":68,"s":3,"q":"인간중심치료에서 자기와 경험 간의 일치를 촉진 시키고, 자기실현을 하도록 치료자가 지녀야 할 특성과 가장 거리가 먼 것은?","a":2,"o":["공감","진실성","객관적인 이해","무조건적 긍정적 존중"]},{"id":"bk20170826-69","r":"bk20170826","n":69,"s":3,"q":"암, 당뇨 등과 같은 질병을 진단받은 환자들을 위한 효과적인 집단개입으로 가장 적합한 것은?","a":3,"o":["정신역동적 집단치료","가족치료","인본주의적 집단치료","심리교육적 집단치료"]},{"id":"bk20170826-70","r":"bk20170826","n":70,"s":3,"q":"심리평가에 관한 설명과 가장 거리가 먼 것은?","a":3,"o":["심리평가는 심리학자들이 진단을 내리고, 치료를 계획하고, 행동을 예측하기 위하여 정보를 수집하고 평가하는 과정이다.","심리평가의 자료로는 환자에 대한 면접자료, 과거 기록, 행동관찰 사항, 심리검사에 관한 결과 들이 포함된다.","제 1, 2차 세계대전 당시 신병들에 대한 심리평가의 요구는 임상심리학에서 심리평가의 중요성과 심리검사 제작의 필요성을 촉진시켰다.","임상장면에서 심리검사를 실시할 때 자주 사용하는 MMPI, K-WAIS, Rorschach, TAT와 같은 검사들은 반드시 포함되어야 한다."]},{"id":"bk20170826-71","r":"bk20170826","n":71,"s":3,"q":"환자가 처방한 대로 약을 잘 복용하고, 의사의 치료적 권고를 준수하게 하기 위한 가장 적절한 방법은?","a":3,"o":["준수하지 않을 때 불이익을 준다.","의사가 권위적이고 단호하게 지시한다.","모든 책임을 환자에게 위임한다.","치료자가 약의 효과 등에 대해 친절하고 상세하게 설명한다."]},{"id":"bk20170826-72","r":"bk20170826","n":72,"s":3,"q":"알코올중독 환자에게 술을 마시면 구토를 유발하는 약을 투약하여 치료하는 기법은?","a":1,"o":["행동조성","혐오치료","자기표현훈련","이완훈련"]},{"id":"bk20170826-73","r":"bk20170826","n":73,"s":3,"q":"임상심리학자가 활동할 수 있는 새로운 영역과 가장 거리가 먼 것은?","a":3,"o":["법정 임상심리학","소아과 심리학","행동 의학","인지 심리학"]},{"id":"bk20170826-74","r":"bk20170826","n":74,"s":3,"q":"임상심리학자의 교육수련과 관련된 설명으로 적절하지 않은 것은?","a":1,"o":["1949년 Boulder회의에서 과학자-전문가 수련모형이 채택되었다.","과학자-전문가 모형은 과학적 연구자나 임상적 실무자 중 어느 하나의 역할에 충실할 것을 강조한다.","심리학 박사(Ph.D.)는 과학자-전문가 모형을 따른다.","한국심리학회에서는 자질 있는 임상심리학자를 양성하기 위하여 임상심리전문가 제도를 두고있다."]},{"id":"bk20170826-75","r":"bk20170826","n":75,"s":3,"q":"심리치료 과정에서 저항이 일어나는 일반적인 이유와 가장 거리가 먼 것은?","a":3,"o":["환자가 변화를 원하더라도 환자의 삶에 중요한 영향을 미치는 타인들이 현 상태를 유지하도록 방해할 수 있기 때문이다.","부적응적 행동을 유지함으로써 얻는 이차적 이득을 환자가 포기하기 어렵기 때문이다.","익숙한 행동을 변화시키려는 시도가 환자에게 위협을 주기 때문이다.","치료자가 가진 가치나 태도가 환자에게 위협적이기 때문이다."]},{"id":"bk20170826-76","r":"bk20170826","n":76,"s":3,"q":"Pennsylvania 대학교에 첫 심리진료소를 개설하고 임상심리학의 탄생에 크게 기여한 학자는?","a":1,"o":["William James","Lightner Witmer","Emil Kraepelin","Wilhelm Wundt"]},{"id":"bk20170826-77","r":"bk20170826","n":77,"s":3,"q":"MMPI-2에서 척도와 그 척도가 측정하는 바가 잘못 짝지어진 것은?","a":2,"o":["L：지나치게 긍정적인 자기 보고","F：자신의 문제들을 인정","S：부정적 사고 및 태도 경향성","K：자기 방어적 태도"]},{"id":"bk20170826-78","r":"bk20170826","n":78,"s":3,"q":"행동평가의 관한 설명으로 가장 적합한 것은?","a":2,"o":["자연적인 상황에서 실제 발생한 것만을 대상으로 평가한다.","행동표본은 내면심리를 반영한 것으로 해석된다.","특정 표적행동의 조작적 정의가 상이할 수 있음을 고려해야 한다.","관찰 결과는 요구특성이나 피험자의 반응성 요인과는 무관하다."]},{"id":"bk20170826-79","r":"bk20170826","n":79,"s":3,"q":"역할시연과 가장 관련성이 높은 행동관찰 방법은?","a":1,"o":["자기-탐지","통제된 관찰","자연관찰","비구조화 관찰"]},{"id":"bk20170826-80","r":"bk20170826","n":80,"s":3,"q":"다음 중 유관학습의 가장 적합한 예는?","a":0,"o":["욕설을 하지 않게 하기 위해 욕을 할 때마다 화장실 청소하기","손톱 물어뜯기를 줄이기 위해 손톱에 쓴 약을 바르기","충격적 스트레스 사건이 떠오를 때 ‘그만!’이라는 구호 외치기","뱀에 대한 공포가 있는 사람에게 뱀을 만지는 사람의 영상 보여주기"]},{"id":"bk20170826-81","r":"bk20170826","n":81,"s":4,"q":"Bordin이 제시한 작업동맹(working alliance)의 3가지 측면을 바르게 짝지은 것은?","a":2,"o":["작업의 동의, 진솔한 관계, 든든한 유대관계","진솔한 관계, 든든한 유대관계, 서로의 호감","유대, 작업의 동의, 목표에 대한 동의","서로의 호감도, 동맹, 작업에 대한 동의"]},{"id":"bk20170826-82","r":"bk20170826","n":82,"s":4,"q":"교류분석에서 치료의 바람직한 목표인 치유의 4단계에 해당되지 않는 것은?","a":0,"o":["계약의 설정","증상의 경감","전이의 치유","각본의 치유"]},{"id":"bk20170826-83","r":"bk20170826","n":83,"s":4,"q":"학교진로상담의 기본원리로 고려해야 할 사항이 아닌 것은?","a":3,"o":["최종 선택은 내담자 스스로 결정하도록 유도한다.","만성적 진로 미결정자를 조기에 발견할 수 있도록 해야 한다.","진로관련 정보제공을 위하여 상담자는 직업세계에 대한 정보를 숙지하는 것이 필요하다.","학생을 위한 집단학습의 경험을 제공한다."]},{"id":"bk20170826-85","r":"bk20170826","n":85,"s":4,"q":"인지행동적 상담이론의 특징과 가장 거리가 먼 것은?","a":1,"o":["인지적 재구성에 초점을 둔 이론","선천적으로 진화적인 성장지향 접근","문제해결 및 대처기술 접근","기술에 대한 훈련을 강조하는 접근"]},{"id":"bk20170826-86","r":"bk20170826","n":86,"s":4,"q":"사별 경험이 있거나 자살을 시도하려는 아동의 상담에 관한 설명으로 틀린 것은?","a":1,"o":["상담자로서 잠재적 위험요인을 깨닫게 하기 위해 사용하는 가장 좋은 기법은 내담자의 대처방식을 관찰하는 것이다.","내담자와 자살금지 계약서를 작성할 때 시간제한을 명시한 동의보다 시간제한이 없는 동의를 하는 것이 효과적이다.","자살예방 프로그램을 실시하기 전에 학부모 및 주위 교사 등에게 예방전략의 중요성을 알려야 한다.","사별 경험을 한 아동 내담자를 돕기 위해 가장 중요한 일은 그들의 부모에게 아동을 이해하고 도와줄 수 있는 방법을 가르치는 것이다."]},{"id":"bk20170826-87","r":"bk20170826","n":87,"s":4,"q":"장기간 사용 중이던 약물을 얼마 동안 사용하지 않았을 때 심리적으로 초조하고 불안함을 느낄 뿐 아니라 약물에 대한 열망과 메스꺼움 등의 신체적인 불쾌감을 경험하는 것은?","a":1,"o":["내성","금단증상","갈망증상","중독(intoxication)증상"]},{"id":"bk20170826-89","r":"bk20170826","n":89,"s":4,"q":"아동청소년의 폭력비행을 상담할 때 부모를 통해 개입하는 방법으로 가장 적합한 것은?","a":1,"o":["자녀가 반사회적 행동을 하면 심하게 야단을 치게 한다.","친사회적인 행동을 보이면 일관되게 보상을 주도록 한다.","반사회적 행동을 보이면 무조건 무시로 대응한다.","폭력을 휘두를 때마다 자녀를 매로 다스리게 한다."]},{"id":"bk20170826-90","r":"bk20170826","n":90,"s":4,"q":"Rogers의 인간중심 상담이론의 기본 명제에 관한 설명으로 틀린 것은?","a":2,"o":["모든 개인은 본인이 중심이 되고 끊임없이 변화하는 경험의 세계에 존재한다.","유기체는 경험하고 지각하는 대로 장(field)에 반응한다.","행동이해를 위한 가장 좋은 관점은 개인의 외적 참조준거에서 나온다.","유기체에 의해 선택된 대부분의 행동방식은 자기개념과 일치하는 것이다."]},{"id":"bk20170826-91","r":"bk20170826","n":91,"s":4,"q":"성피해자에 대한 상담의 초기 단계에서 상담자가 유의해야 할 사항으로 옳은 것은?","a":1,"o":["피해자가 첫면접에서 성 피해 사실을 부인할 경우 솔직한 개방을 하도록 지속적으로 유도한다.","가능하면 초기에 피해자의 가족상황과 성폭력 피해의 합병증 등에 관한 상세한 정보를 얻는다.","성피해로 인한 내담자의 심리적 외상을 신속하게 탐색하고 치유할 수 있도록 적극적으로 개입한다.","피해상황에 대한 상세한 정보 수집이 중요하므로 내담자가 불편감을 표현하더라도 상담자가 주도적으로 면접을 진행한다."]},{"id":"bk20170826-92","r":"bk20170826","n":92,"s":4,"q":"현실치료의 근간이 되는 선택이론의 주요원칙으로 옳지 않은 것은?","a":0,"o":["모든 인간의 동기나 행동은 다섯가지 기본욕구인 생존 및 건강, 사랑과 소속, 자기가치감, 통제, 즐거움과 재미 등을 충족시키기 위해 고안된다.","다섯가지 욕구들을 모두 소유하고 있다고 하더라도 우리들은 각자가 모두 특별한 방법으로 그 욕구들을 충족시키려 한다.","사람들이 바람 또는 욕구와 그들의 환경에서 얻고 있는 지각 사이에 차이가 있을 때는 특별한 행동들이 유발된다.","자기 자신을 어떻게 지각하는가 뿐만 아니라 그들의 주변세계를 어떻게 지각하는지에 대해 그들의 현실세계와 자신을 보는 관점이 된다."]},{"id":"bk20170826-93","r":"bk20170826","n":93,"s":4,"q":"Kitchener가 상담의 기본적인 윤리적 원리를 제시한 것으로 상담자가 내담자와 맺은 약속을 잘 지키며 믿음과 신뢰를 주는 행동을 하는 것은?","a":2,"o":["자율성(autonomy)","무해성(beneficence)","충실성(fidelity)","공정성(justice/fairness)"]},{"id":"bk20170826-94","r":"bk20170826","n":94,"s":4,"q":"효율적인 독서능력의 신장과 장기기억을 돕는 조직화 전략 SQ3R의 순서를 올바르게 나열한 것은?","a":0,"o":["개관 - 질문 - 읽기 - 암송 - 복습","질문 - 개관 - 읽기 - 복습 - 암송","읽기 - 질문 - 개관 - 복습 - 암송","질문 - 개관 - 읽기 - 암송 - 복습"]},{"id":"bk20170826-95","r":"bk20170826","n":95,"s":4,"q":"상담 및 심리치료의 발달역사에 관한 설명으로 옳지 않은 것은?","a":2,"o":["William Glasser는 1960년대에 현실치료를 제시하였다.","가족치료 및 체계치료는 1970년대부터 본격적으로 등장하였다.","Rollo May와 Victor Franks 영향으로 게슈탈트 상담이 발전하였다.","Witmer는 임상심리학이라는 용어를 최초로 사용했으며, 치료적 목적을 위해 심리학의 지식과 방법을 활용하였다."]},{"id":"bk20170826-96","r":"bk20170826","n":96,"s":4,"q":"정신분석 상담에서 말하는 불안의 종류에 해당하는 것은?","a":2,"o":["구체적 불안","특성적 불안","도덕적 불안","실존적 불안"]},{"id":"bk20170826-97","r":"bk20170826","n":97,"s":4,"q":"상담 초기단계에서 내담자를 평가할 때 고려해야 할 사항이 아닌 것은?","a":2,"o":["지적인 기능과 사회경제적 조건","자살에 대한 생각, 의지, 충동성","변화실행과 관련된 내담자의 전략","자신의 문제에 관한 이해"]},{"id":"bk20170826-98","r":"bk20170826","n":98,"s":4,"q":"집단상담을 초기단계, 전환단계, 작업단계, 마무리단계로 구분할 때 전환단계의 특징이 아닌 것은?","a":1,"o":["환경이 얼마나 안전한지를 결정하기 위해 상담자나 다른 참가자들을 시험한다.","참가자들은 존경, 공감, 수용, 관심, 반응에 대한 기본적인 태도를 배운다.","주변에 남아 있을 것인지 아니면 위험에 뛰어들 것인지에 대해 생각한다.","다른 사람이 들을 수 있도록 자신을 표현하는 방법을 배운다."]},{"id":"bk20170826-99","r":"bk20170826","n":99,"s":4,"q":"체계적 둔감법(systematic desensitization)의 기초가 되는 학습원리는?","a":1,"o":["혐오 조건형성","고전적 조건형성","조작적 조건형성","고차적 조건형성"]},{"id":"bk20170826-100","r":"bk20170826","n":100,"s":4,"q":"약물중독 개입모델 중 영적인 성장에 초점을 두고 자조집단을 활용하는 형식으로 진행되는 모델은?","a":0,"o":["12단계모델","동기강화모델","하위문화모델","공중보건모델"]},{"id":"bk20180304-1","r":"bk20180304","n":1,"s":0,"q":"심리측정에 관한 설명으로 옳은 것은?","a":1,"o":["일반적으로 검사도구가 측정하고자 목적한 바를 측정할 때 그 검사도구는 신뢰도가 있다고 한다. \"","내적 일관성 신뢰도는 검사를 1회 사용한 결과만을 가지고 신뢰도를 계산해야 할 때 사용될 수 있는 방식이다.","검사-재검사 신뢰도는 서로 다른 집단의 사람들에게 검사를 반복적으로 사용했을 때 동일한 결과가 나오는 정도이다.","내용타당도는 어떤 검사가 그 검사를 실시한 결과를 통해서 알고자 하는 준거변수와의 상관 정도를 말한다."]},{"id":"bk20180304-2","r":"bk20180304","n":2,"s":0,"q":"집단 전체의 의사결정이 개인적 의사결정의 평균보다 더 극단적으로 되는 현상은?","a":2,"o":["사회적 촉진","사회적 태만","집단 극화","집단 사고"]},{"id":"bk20180304-3","r":"bk20180304","n":3,"s":0,"q":"이성적이고 직접적인 방법으로 불안을 통제할 수 없을 때, 붕괴의 위기에 처한 자아를 보호하기 위해 무의식적으로 사용하는 사고 및 행동 수단은?","a":3,"o":["통제 위치","효능감","사회적 강화","방어기제"]},{"id":"bk20180304-4","r":"bk20180304","n":4,"s":0,"q":"학습에 대한 설명으로 틀린 것은?","a":1,"o":["Tolman은 동물들도 다양한 단편적인 지식 또는 인지를 획득한다고 주장한다.","쥐가 부적자극이 올 것이라는 신호를 알고서 미리 피하는 것을 도피학습이라고 한다.","행동주의 심리학자들은 대부분 동물들의 학습에는 행동이라는 반응수행이 필수적이라고 주장한다.","고전적 조건형성에서 학습되는 것은 조건자극(CS)과 무조건자극(UCS)의 연합이며, Pavlov는 시간적 근접성을 연합의 필요조건이라고 주장했다."]},{"id":"bk20180304-5","r":"bk20180304","n":5,"s":0,"q":"자신의 성공은 자기가 잘한 것 때문이라고 하고, 자신의 실패에 대해서는 자신의 책임을 모면하려고 하는 사람이 있다면, 이 사람이 보이는 성향은?","a":2,"o":["암묵적 자기중심주의 (implicit egotism)","자기애 (narcissism)","자기봉사적 편향(self-serving bias)","성명-글자 효과(name-letter effect)"]},{"id":"bk20180304-6","r":"bk20180304","n":6,"s":0,"q":"'역지사지'라는 말은 특정사건이나 현상을 타인의 입장에서 사고하는 것을 의미한다. 역지사지를 할 수 있는 능력을 Piaget의 인지발달 단계와 관련시켰을 때 가장 적합한 설명은?","a":2,"o":["역지사지 능력은 대상영속성 개념을 형성하는 단계가 되어야 가능하다.","수에 대한 보존개념을 획득하기 전 단계에서 역지사지 능력이 가능하게 된다.","눈으로 보고 만질 수 있는 사물들 간의 관계와 규칙성을 이해하고 조작이 가능한 단계에서 역지사지 능력을 갖출 수 있다.","역지사지 능력은 추상적인 연역적 사고능력이 가능한 단계에서만 갖출 수 있다."]},{"id":"bk20180304-7","r":"bk20180304" 은 될 수 없다.","술을 마셨을 때 얼굴이 신속하게 붉어지는 것은 알코올 분해 효소가 많다는 증거이다.","술이 주로 식사와 함께 제공되는 문화에서는 알코올 문제가 많이 발생한다."]},{"id":"bk20180819-30","r":"bk20180819","n":30,"s":1,"q":"A양은 음대 입학시험을 앞두고 목소리가 나오지 않는 증상(aphonia)이 나타났다. 가장 가능성이 높은 정신장애 진단은?","a":2,"o":["강박장애(obsessive-compulsive disorder)","선택적 함묵증(selective mutism)","전환장애(conversion disorder)","특정공포증(specific phobia)"]},{"id":"bk20180819-31","r":"bk20180819","n":31,"s":1,"q":"남성이 사정에 어려움을 겪으며 성적 절정감을 느끼지 못하는 성기능 장애는?","a":1,"o":["조루증","지루증","발기장애","성교 통증장애"]},{"id":"bk20180819-32","r":"bk20180819","n":32,"s":1,"q":"다음 중 조증 증상일 가능성이 가장 높은 경우는?","a":0,"o":["로또가 당첨될 것 같아서 오늘 자동차를 카드로 결제했고, 내일은 집을 계약할 예정이다.","지난 1년 동안 사람들과 부딪히는 것이 싫어서 낮에는 집에 있다가 밤에만 돌아다녔다.","지능이 상위 0.01%에 속한다는 심리검사결과를 받고 멘사에 등록을 신청했다.","연인이 다른 사람과 결혼한 것이 화가 나서 방송국을 폭파하겠다고 위협하는 전화를 했다."]},{"id":"bk20180819-33","r":"bk20180819","n":33,"s":1,"q":"품행장애에 관한 설명으로 옳은 것은?","a":3,"o":["적대적 반항장애는 품행장애로 발전하지 않는다.","품행장애의 유병률은 남녀의 차이가 없다.","품행장애의 발병에는 환경적 요인보다 유전적 요인이 크다","품행장애가 이른 나이에 발병할수록 예후가 좋지 않다."]},{"id":"bk20180819-34","r":"bk20180819","n":34,"s":1,"q":"의존성 성격장애의 진단기준에 해당하지 않는 것은?","a":0,"o":["자신이 사회적으로 무능하고 열등하다고 생각한다.","자신의 일을 혼자서 시작하거나 수행하기가 어렵다.","타인의 보살핌과 지지를 얻기 위해 무슨 행동이든 한다.","타인의 충고와 보장이 없이는 일상적인 일도 결정을 내리지 못한다."]},{"id":"bk20180819-35","r":"bk20180819","n":35,"s":1,"q":"우울장애에 관한 설명으로 가장 거리가 먼 것은?","a":3,"o":["쌍생아 연구는 우울증의 유전적 소인의 증거를 제시한다.","세로토닌의 낮은 활동은 우울과 관련이 있다.","면역체계의 조절장애가 우울의 유발을 돕는 것으로 나타났다.","우울증과 관련된 뇌회로는 밝혀진 것이 없다."]},{"id":"bk20180819-36","r":"bk20180819","n":36,"s":1,"q":"강한 공포, 곧 죽지 않을까하는 불안, 심계항진, 호흡곤란, 감각이상 등과 같은 문제들이 순식간에 시작되어 10여분 내에 절정에 달하는 증상을 특징으로 하는 장애는?","a":1,"o":["신체증상장애","공황장애","질병불안장애","범불안장애"]},{"id":"bk20180819-37","r":"bk20180819","n":37,"s":1,"q":"DSM-5 특정학습장애의 감별진단과 가장 거리가 먼 것은?","a":3,"o":["신경학적 또는 감각 장애로 인한 학습문제","지적장애","신경인지장애","우울장애"]},{"id":"bk20180819-38","r":"bk20180819","n":38,"s":1,"q":"이상행동 및 정신장애의 판별기준과 가장 거리가 먼 것은?","a":2,"o":["적응적 기능의 저하 및 손상","주관적 불편감과 개인의 고통","가족의 불편감과 고통","통계적 규준의 일탈"]},{"id":"bk20180819-39", 인간은 기본적으로 자유롭고 자신의 목표를 스스로 선택하고자 하는 욕구를 가진 존재이다."]},{"id":"bk20180819-85","r":"bk20180819","n":85,"s":4,"q":"집단상담의 후기 과정에서 일어날 수 있는 구성원의 문제에 해당하는 것은?","a":1,"o":["내담자가 말을 너무 많이 해서 집단 과정을 방해한다.","내담자가 강도 높은 자기 개방으로 인한 불안으로 철수한다.","내담자가 질문과 잡다한 충고 등을 해서 집단 과정을 방해한다.","내담자가 집단을 독점하고 자신만 주목받기를 원한다."]},{"id":"bk20180819-88","r":"bk20180819","n":88,"s":4,"q":"알코올중독 치료에 관한 설명으로 옳은 것은?","a":1,"o":["행동치료가 단독으로 시행되는 경우가 생물학적 혹은 인지적 접근법과 결합하여 시행될 때 보다 효과적이다.","정신역동적 관점에서는 의존욕구와 관련된 갈등이 알코올중독을 일으키는 중요한 요인이라고 간주한다.","생리적 금단증상이 나타나는 경우 메타돈 유지프로그램을 적용하는 것이 권장된다.","알코올중독에 대한 심리치료에서 치료 초기에 무의식적 사고와 감정에 대한 해석을 자주 사용하는 것이 권장된다."]},{"id":"bk20180819-89","r":"bk20180819","n":89,"s":4,"q":"진로상담에서 진로 미결정 내담자를 위한 개입방법과 비교하여 우유부단한 내담자에 대한 개입 방법이 갖는 특징이 아닌 것은?","a":2,"o":["장기적인 계획 하에 상담해야 한다.","대인관계나 가족 문제에 대한 개입이 필요하다.","정보 제공이나 진로 선택에 관한 문제를 명료화하는 개입이 효과적이다.","문제의 기저에 있는 역동을 이해하고 감정을 반영하는 것이 효과적이다."]},{"id":"bk20180819-90","r":"bk20180819","n":90,"s":4,"q":"통합적 상담모형의 기본 개념에 해당하지 않는 것은?","a":2,"o":["내담자와의 동반자 관계를 형성한다.","일상의 상황들에서 성공적으로 대처하기 위해서 재사회화 과정을 거친다.","내담자의 인지보다는 행동에 초점을 둔다.","독특한 내담자에게 최상의 상담기법이 무엇인지 찾는다."]},{"id":"bk20180819-92","r":"bk20180819","n":92,"s":4,"q":"생애별 발달과업을 제시함으로써 상담자에게 전체적인 상담프로그램을 평가하는 기준을 제시해 준 것은?","a":2,"o":["Erikson의 공헌","Piaget의 공헌","Havighurst 의 공헌","Gesell 아동발달연구소의 공헌"]},{"id":"bk20180819-93","r":"bk20180819","n":93,"s":4,"q":"청소년 비행의 원인에 관한 설명으로 옳지 않은 것은?","a":3,"o":["생물학적 접근: 매우 심각한 비행청소년 집단에서 측두엽 간질이 유의미하게 발견되기 도 한다.","사회학습이론: 청소년의 역할 모형이 바람직하지 못한 반사회적 행동이었을 경우에는 그 행동 패턴이 비행적으로 나타나게 된다.","문화전달이론: 빈민가나 우범지대와 같은 사회해체 지역에서 성장하는 청소년은 각종 비행을 배우고 또 직접 행동으로 실행하기도 한다.","아노미이론: 비행행동도 개인과 사회간 상호 행위 과정의 산물로 이해한다."]},{"id":"bk20180819-94","r":"bk20180819","n":94,"s":4,"q":"신체적 장애 발생 시 흔히 나타나는 심리적 적응단계에 대한 설명으로 틀린 것은?","a":0,"o":["초기에 외상 자체에 대한 부정 여부는 회복효과와 관련이 없는 것으로 나타난다.","장애나 질병의 심각성과 정도를 이해하고 완전히 인정하게 될 때에는 우울해진다.","독립적으로 자기간호와 재활의 노력이 가능할 때 나타나는 반작용이 독립에 대한 저항이다.","충격은 외상 시 나타나는 즉각적인 반응이다."]},{"id":"bk20180819-95","r":"bk20180819","n":95,"s":4,"q":"만성 정신장애 환자를 위한 정신재활치료에서 사례관리의 목적으로 가장 적합한 것은?","a":1,"o":["독립적인 사회생활을 할 수 있는 다양한 주거공간 확보","환자에게 필요한 다양한 서비스의 조정‧통합","위기상황에서 환자에게 안정화 전략 제공","효율적인 대인관계 증진 지원"]},{"id":"bk20180819-97","r":"bk20180819","n":97,"s":4,"q":"인간중심 상담에 대한 설명으로 옳은 것은?","a":2,"o":["상담관계보다는 기법을 중시하는 특성을 가지고 있다.","내담자의 무의식적 측면도 충분히 반영하여 상담을 진행한다.","기본원리를 “만일 ~라면 ~이다”라는 형태로 표현할 수 있다.","상담은 내담자가 아닌 상담자가 이끌어가는 과정이다."]},{"id":"bk20180819-98","r":"bk20180819","n":98,"s":4,"q":"노인을 대상으로 한 심리치료에서 고려해야 할 사항으로 적합하지 않은 것은?","a":2,"o":["보다 현실적이고 구체적인 사안에 초점을 맞추는 것이 좋다.","심층치료보다는 지지적인 치료가 더 적합하다.","가급적 가족의 참여를 배제하고 개인 상담을 활용해야 한다.","치료적 의존성을 주의해야 하며, 자조적이고 자립적인 행동을 격려하고 강화할 필요가 있다."]},{"id":"bk20180819-99","r":"bk20180819","n":99,"s":4,"q":"청소년 상담자에게 요구되는 윤리적인 내용과 가장 거리가 먼 것은?","a":3,"o":["비밀보장에 대한 원칙을 내담자에게 알려준다.","청소년 내담자의 법적, 제도적 권리에 대해 알려준다.","청소년 내담자에게 존중의 의미에서 경어를 사용할 수 있다.","비밀보장을 위하여 내담자에 대한 기록물은 상담의 종결과 함께 폐기한다."]},{"id":"bk20180819-100","r":"bk20180819","n":100,"s":4,"q":"도박중독의 심리‧사회적 특징에 대한 설명으로 옳은 것은?","a":3,"o":["도박 중독자들은 대체로 도박에만 집착할 뿐 다른 개인적인 문제를 가지지 않는다.","도박 중독자들은 직장에서 도박 자금을 마련하기 위해 남보다 더 열심히 노력한다.","심리적 특징으로 단기적인 만족을 추구하기 보다는 장기적인 만족을 추구한다.","도박행동에 문제가 있음을 인정하지 않고 변명하려 든다."]},{"id":"bk20190303-1","r":"bk20190303","n":1,"s":0,"q":"망각에 대한 설명으로 틀린 것은?","a":3,"o":["망각은 단기기억과 장기기억에서 모두 일어날 수 있다.","시간이 경과함에 따라 이전의 정보를 더 많이 잃어버리는 현상을 쇠퇴라고 한다.","망각은 적절한 인출 단서가 없거나 유사한 기억 내용이 간섭을 해서 나타날 수있다.","장기기억에서 망각이 일어나는 주요 이유는 대치와 쇠퇴 현상 때문이다."]},{"id":"bk20190303-2","r":"bk20190303","n":2,"s":0,"q":"Fastinger와 Carlsmith(1959)의 연구에 의하면 피험자들이 적은 돈, 혹은 많은 돈을 받고 어떤 지루한 일을 재미있다고 다른 사람에게 말하였을 때, 후에 그 일에 대한 태도의 결과로 옳은 것은?","a":0,"o":["적은 돈을 받은 사람은 실제로 그 일이 재미있다고 생각한다.","많은 돈을 받은 사람은 실제로 그 일이 재미있다고 생각한다.","적은 돈을 받은 사람이나 많은 돈을 받은 사람 모두 실제로 그 일이 재미있다고 생각한다.","적은 돈을 받은 사람이나 많은 돈을 받은 사람 모두 그 일이 지루하다고 생각한다."]},{"id":"bk20190303-3","r":"bk20190303","n":3,"s":0,"q":"성격이론에 대한 설명으로 틀린 것은?","a":2,"o":["유형론이 비연속적 범주에 의해서 성격특징들을 기술하는데 비해 특성론은 연속적인 속성으로 성격특징들을 파악하고 기술한다.","Adler이론에서는 열등감, 보상, 우월성 추구가 핵심적 개념이다.","행동주의적 성격이론에 따르면 성격은 개인이 타고났거나 상당히 지속적인 속성이며 학습에 의해 형성된 것이다.","Rogers가 묘사한 “완전히 기능하는 인간”은 경험에 대한 개방, 자신에 대한 신뢰, 내적 평가, 성장의지를 가진 사람이다."]},{"id":"bk20190303-4","r":"bk20190303","n":4,"s":0,"q":"표집방법 중 확률표집방법에 해당하지 않는 것은?","a":3,"o":["단순 무선표집(simpling random sampling)","체계적 표집(systematic sampling)","군집표집(cluster sampling)","대리적 표집(incidental sampling)"]},{"id":"bk20190303-5","r":"bk20190303","n":5,"s":0,"q":"Freud에 따르면 거세불안을 극복하는 과정에서 형성되는 성격의 요소는?","a":2,"o":["원초아","자아","초자아","무의식"]},{"id":"bk20190303-6","r":"bk20190303","n":6,"s":0,"q":"처벌의 효과적인 사용방법에 대한 설명으로 틀린 것은?","a":0,"o":["처벌은 반응 이후 시간을 두고 주는 것이 효과적이다.","반응이 나올 때마다 매번 처벌을 주는 것이 효과적이다.","처음부터 아주 강한 강도의 처벌을 주는 것이 효과적이다.","처벌행동에 대해 대안적 행동이 있을 때 효과적이다."]},{"id":"bk20190303-7","r":"bk20190303","n":7,"s":0,"q":"Rogers의 성격이론에서 심리적 적응에 가장 중요한 역할을 한다고 가정하는 것은?","a":1,"o":["자아강도(ego strength)","자기(self)","자아이상(ego ideal)","인식(awareness)"]},{"id":"bk20190303-8","r":"bk20190303","n":8,"s":0,"q":"성격심리학의 주요한 모델인 성격 5요인에 대한 설명으로 옳은 것은?","a":1,"o":["5요인에 대한 개인차에서 유전적 요인은 찾아볼 수 없다.","성실성 점수가 높은 사람의 경우 행동을 계획하고 통제하는 것을 돕는 전두엽의 면적이 더 큰 경향이 있다.","뇌의 연결성은 5요인의 특질에 영향을 미치지 않는다.","정서적 불안정성인 신경증은 일생동안 계속해서 증가하고 성실성, 우호성, 개방성과 외향성은 감소한다."]},{"id":"bk20190303-9","r":"bk20190303","n":9,"s":0,"q":"특정 검사에 대한 반복노출로 인해 발생하는 연습효과를 줄이기 위해 이 검사와 비슷한 것을 재는 다른 검사를 이용하여 측정하는 검사의 신뢰도는?","a":1,"o":["반분신뢰도","동형검사 신뢰도","검사-재검사 신뢰도","채점자간 신뢰도"]},{"id":"bk20190303-13","r":"bk20190303","n":13,"s":0,"q":"너무 더우면 땀을 흘리고, 너무 추우면 몸을 떠는 것과 같이 항상성(homeostasis)을 유지하는 것과 관련이 있는 뇌의 부위는?","a":1,"o":["소뇌","시상하부","뇌하수체","변연계"]},{"id":"bk20190303-15","r":"bk20190303","n":15,"s":0,"q":"Piaget의 인지발달단계 중 대상영속성(object permanence)의 발달이 최초로 이루어지는 단계는?","a":0,"o":["감각운동기","전조작기","구체적 조작기","형식적 조작기"]},{"id":"bk20190303-16","r":"bk20190303","n":16,"s":0,"q":"강화계획에 관한 설명으로 틀린 것은?","a":3,"o":["고정비율 계획에서는 매 n번의 반응마다 강화인이 주어진다.","변동비율 계획에서는 평균적으로 n번의 반응마다 강화인이 주어진다.","고정간격 계획에서는 정해진 시간이 지난 후의 첫 번째 반응에 강화인이 주어지고, 강화인이 주어진 시점에서 다시 일정한 시간이 지난 후의 첫 번째 반응에 강화인이 주어진다.","변동비율과 변동간격 계획에서는 강화를 받은 후 일시적으로 반응이 중단되는 특성이 단상담에서의 기본 전제로 적합하지 않은 것은?","a":0,"o":["상담자보다 내담자에 대해서만 기본가정(문화, 인종, 성별 등)을 고려해야 한다.","모든 인간의 만남은 그 자체가 다문화적이다.","사람들의 문화적 배경을 고려해야 한다.","지도자는 다문화적 관점을 갖고 있어야 한다."]},{"id":"bk20190303-87","r":"bk20190303","n":87,"s":4,"q":"Satir의 의사소통 모형에서 스트레스를 다룰 때 자신의 스트레스를 무시하고 다른 사람에게 힘을 넘겨주며 모두에게 동의하는 말을 하는 의사소통 유형은?","a":3,"o":["초이성형","일치형","산만형","회유형"]},{"id":"bk20190303-89","r":"bk20190303","n":89,"s":4,"q":"병적 도박에 관한 설명으로 틀린 것은?","a":2,"o":["대개 돈의 액수가 커질수록 더 흥분감을 느끼며, 흥분감을 느끼기 위해 액수를 더 늘린다.","도박행동을 그만두거나 줄이려고 시도할 때 안절부절 못하거나 신경이 과민해진다.","병적 도박은 DSM-5에서 반사회성 성격장애로 분류된다.","병적 도박은 전형적으로 남자는 초기 청소년기에, 여자는 인생의 후기에 시작되는 경우가 많다."]},{"id":"bk20190303-91","r":"bk20190303","n":91,"s":4,"q":"청소년 상담시 대인관계 문제해결을 위한 상담전략에 관한 설명으로 틀린 것은?","a":3,"o":["정서적 개입 : 문제의 신체적 요소에 초점을 맞춘 신체 인식활동도 포함한다.","인지적 개입 : 내담자가 자신이 처한 상황이나 사건, 사람, 감정 등에 대해 지금과 다르게 생각하도록 돕는다.","행동적 개입 : 내담자에게 비생산적인 현재의 행동을 통제하게 하거나 제거하게 함으로써 새로운 행동이나 기술을 개발하도록 돕는다.","상호작용적 개입 : 습관, 일상생활 방식이나 다른 사람과의 상호작용 패턴을 수정하도록 한다."]},{"id":"bk20190303-92","r":"bk20190303","n":92,"s":4,"q":"개인의 일상적 경험구조, 특히 소속된 분야에서 특별하다고 간주되던 사람들의 일상적 경험구조를 상세하게 연구하고자 하는 목적에서 생겨난 심리상담의 핵심적인 전제조건에 해당하는 것은?","a":3,"o":["매순간 새로운 자아가 출현하고 새로운 경험을 할 때마다 우리는 새로운 위치에 있게 된다.","어린 시절의 창조적 적응은 습관적으로 알아차림을 방해한다.","내담자로 하여금 문제를 해결하는 것뿐만 아니라 그 문제를 유지시키는 보다 근본적인 기술을 변화시키도록 돕는 것이 중요하다.","개인은 마음, 몸, 영혼으로 이루어진 체계이며, 삶과 마음은 체계적 과정이다."]},{"id":"bk20190303-93","r":"bk20190303","n":93,"s":4,"q":"상담초기에 상담관계 형성에 필요한 기법과 가장 거리가 먼 것은?","a":2,"o":["경청하기","상담에 대한 동기부여하기","핵심 문제 해석하기","무조건적인 긍정적 존중하기"]},{"id":"bk20190303-94","r":"bk20190303","n":94,"s":4,"q":"Adler 개인심리학의 기본 가정에 해당하지 않는 것은?","a":0,"o":["개인은 무의식과 의식, 감정과 사고, 행동이 각각 분리되어 있는 것으로 본다.","인간은 미래 목표를 향해 나아가는 창조적인 존재라고 본다.","현실에 대한 주관적 인식을 강조하며 현상학적 접근을 취한다.","인간은 기본적으로 공동체 의식, 즉 사회적 관심을 지닌 존재라고 본다."]},{"id":"bk20190303-95","r":"bk20190303","n":95,"s":4,"q":"중독에 대한 동기강화상담의 기본 기법 4가지(OARS)에 포함되지 않는 것은?","a":1,"o":["인정","공감","반영","요약"]},{"id":"bk20190303-96","r":"bk20190303","n":96,"s":4,"q":"직업발달을 직업 자아정체감을 형성해 나가는 계속적 과정으로 보는 이론은?","a":2,"o":["Ginzberg의 발달이론","Super의 발달이론","Tiedeman과 O'Hara의 발달이론","Tuckman의 발달이론"]},{"id":"bk20190303-97","r":"bk20190303","n":97,"s":4,"q":"면접기법에 대한 설명으로 틀린 것은?","a":1,"o":["구체적인 내용의 해석은 상담관계가 형성되는 중반까지는 보류하는 것이 일반적이다.","감정의 명료화에서 내담자가 원래 제시한 것보다 더 많은 의미를 추가하여 반응하는 것은 삼갈 필요가 있다.","내담자의 성격을 파악하지 못했거나 해석의 실증적 근거가 없을 때는 해석을 하지 말아야 한다.","상담자의 반영, 명료화, 직면, 해석은 별개가 아니라 반응 내용의 정도와 깊이에 차이가 있을 뿐이다."]},{"id":"bk20190303-98","r":"bk20190303","n":98,"s":4,"q":"Lazarus의 중다양식 상담에 관한 설명으로 틀린 것은?","a":2,"o":["성격의 일곱가지 양식은 행동, 감정, 감각, 심상, 인지, 대인관계, 약물/생물학 등이다.","사람은 개인이 타인들과의 긍정적이거나 부정적인 상호작용의 결과들을 관찰함으로써 무엇을 할 것인지를 배운다고 본다.","사람들은 고통, 좌절, 스트레스를 비롯하여 감각자극이나 내적 자극에 대한 반응을 나타내는 식별역이 유사하다.","행동주의 학습이론과 사회학습이론, 인지주의의 영향을 많이 받았으며, 그 외 다른 치료기법들도 절충적으로 사용한다."]},{"id":"bk20190303-99","r":"bk20190303","n":99,"s":4,"q":"3단계 상담모델(탐색단계, 통찰단계, 실행단계)에서 탐색단계의 특징에 해당하는 것은?","a":0,"o":["내담자가 그들의 감정을 표현하고 복잡한 문제를 통한 그들의 생각을 표현하는 기회를 제공한다.","내담자들이 새로운 밝은 면을 볼 수 있도록 돕는다.","내담자에게 어떤 사건을 만드는데 원형을 제공하고 그들이 더 좋은 선택을 할 수 있도록 돕는다.","내담자가 왜 그들이 행동하고, 생각하고, 느끼는가에 관하여 이해할 수 있게 해준다."]},{"id":"bk20190303-100","r":"bk20190303","n":100,"s":4,"q":"청소년을 대상으로 한 자살 위험 평가에 대한 설명으로 틀린 것은?","a":1,"o":["개별적으로 임상 면담을 실시한다.","자살 준비에 대한 구체적인 질문은 자살가능성을 높일 수 있으므로 피한다.","자살의도를 유보하고 있는 기간이라면 청소년의 강점과 자원을 탐색한다.","자살에 대해 생각할 수 있으나 행동으로 실천하지 않겠다는 구체적인 약속을 한다."]},{"id":"bk20190804-2","r":"bk20190804","n":2,"s":0,"q":"호감에 영향을 미치는 요인과 가장 거리가 먼 것은?","a":3,"o":["물리적 접근성","유사성","상보성","내향성"]},{"id":"bk20190804-3","r":"bk20190804","n":3,"s":0,"q":"뉴런이 휴식기에 있을 때의 상태로 옳은 것은?","a":3,"o":["칼륨 이온이 뉴런 밖으로 나간다.","나트륨 이온이 뉴런 안으로 밀려온다.","뉴런이 발화한다.","뉴런 내부는 외부와 비교하여 음성(-)을 띠고 있다."]},{"id":"bk20190804-4","r":"bk20190804","n":4,"s":0,"q":"Freud의 발달이론에서 오이디푸스 갈등을 경험하는 시기는?","a":2,"o":["구강기","항문기","남근기","잠복기"]},{"id":"bk20190804-5","r":"bk20190804","n":5,"s":0,"q":"Ainsworth의 낮선 상황 실험에서 낮선 장소에서 어머니가 사라졌을 때 걱정하는 모습을 약간 보이다가 어머니가 돌아왔을 때 어머니를 피하는 아이의 애착 유형은?","a":2,"o":["안정 애착","불안정 혼란 애착","불안정 회피 애착","불안정 양가 애착"]},{"id":"bk20190804-6","r":"bk201 인 피드백은 적절한 행동을 강화할 수 있다.","지도자는 효과적인 피드백 모델이 될 수 있다.","교정적인 피드백이 긍정적인 피드백보다 중요하다."]},{"id":"bk20190804-92","r":"bk20190804","n":92,"s":4,"q":"성피해자에 대한 심리치료 과정 중 초기 단계에서 상담자가 유의해야 할 사항과 가장 거리가 먼 것은?","a":1,"o":["치료의 관계형성을 위해 수치스럽고 창피한 감정이 정상적인 감정임을 공감한다.","피해상황에 대한 진술은 상담자 주도로 이루어져야 한다.","성피해 사실에 대한 내담자의 부정을 허락한다.","내담자에게 치료자에 대한 감정을 묻고 치료자를 선택할 수 있도록 해 준다."]},{"id":"bk20190804-93","r":"bk20190804","n":93,"s":4,"q":"진로상담의 목표와 가장 거리가 먼 것은?","a":3,"o":["내담자가 이미 결정한 직업적인 선택과 계획을 확인하도록 돕는다.","내담자가 자신의 직업적 목표를 명확하게 해 준다.","내담자로 하여금 자아와 직업세계에 대한 구체적인 이해와 새로운 사실을 발견하도록 한다.","직업선택과 직업생활에서 순응적인 태도를 함양하도록 돕는다."]},{"id":"bk20190804-95","r":"bk20190804","n":95,"s":4,"q":"다음 중 상담의 바람직한 목표설정 방향과 가장 거리가 먼 것은?","a":2,"o":["목표는 구체적이어야 한다.","목표는 실현가능해야 한다.","목표는 상담자의 의도에 맞추어야 한다.","목표는 내담자가 원하고 바라는 것이어야 한다."]},{"id":"bk20190804-96","r":"bk20190804","n":96,"s":4,"q":"게슈탈트 상담에 대한 설명으로 틀린 것은?","a":0,"o":["보조자아(auxiliary ego) 활용은 집단 상담에 많이 사용하는 기법으로 한 구성원의 문제를 집중적으로 다룬다.","알아차림(awareness)과 접촉(contact)을 방해하는 한 요인인 융합(confluence)은 자신과 타인의 경계가 불분명한 지점에서 타인의 의견에 동의하는 것이다.","Zinker는 알아차림-접촉 주기를 배경, 감각, 알아차림, 에너지/흥분, 행동, 접촉 등 여섯 단계로 설명한다.","알아차림은 개체가 자신의 유기체적 욕구나 감정을 지각한 다음 게슈탈트를 형성하여 명료한 전경으로 떠올리는 것을 말한다."]},{"id":"bk20190804-98","r":"bk20190804","n":98,"s":4,"q":"처벌을 사용할 때 고려해야 할 사항이 아닌 것은?","a":1,"o":["강도","융통성","일관성","즉시성"]},{"id":"bk20190804-100","r":"bk20190804","n":100,"s":4,"q":"단기상담에 적합한 내담자의 특성으로 옳은 것은?","a":1,"o":["반사회적 성격장애가 있다.","구체적이거나 발달과정상의 문제가 있다.","지지적인 대화상대자가 전혀 없다.","만성적이고 복합적인 문제가 있다."]},{"id":"bk20200606-1","r":"bk20200606","n":1,"s":0,"q":"기억의 왜곡을 줄이는 데 효과적인 방법으로 가장 거리가 먼 것은?","a":3,"o":["반복해서 학습하기","연합을 통한 인출단서의 확대","기억술 사용","간섭의 최대화"]},{"id":"bk20200606-2","r":"bk20200606","n":2,"s":0,"q":"설문조사에서 문항에 대한 응답을 「매우 찬성」에서 「매우 반대」까지 5개의 답지로 응답하게 만든 척도는?","a":0,"o":["리커트(Likert) 척도","써스톤(Thurstone) 척도","거트만(Guttman) 척도","어의변별(Semantic Differential) 척도"]},{"id":"bk20200606-3","r":"bk20200606","n":3,"s":0,"q":"최빈값에 관한 설명으로 옳지 않은 것은?","a":2,"o":["주어진 자료 중에서 가장 많이 나타나는 측정값이다.","최빈값은 대표성을 갖고 있다.","자료 중 가장 극단적인 값의 영향을 받는다.","중심경향성 기술값 중의 하나이다."]},{"id":"bk20200606-4","r":"bk20200606","n":4,"s":0,"q":"기온에 따라 학습능률이 어떻게 달라지는가를 알아보기 위해 기온을 13℃, 18℃, 23℃인 세조건으로 만들고 학습능률은 단어의 기억력 점수로 측정하였다. 이 때 독립변수는 무엇인가?","a":0,"o":["기온","기억력 점수","학습능률","예언"]},{"id":"bk20200606-5","r":"bk20200606","n":5,"s":0,"q":"인간의 동조행동에 대한 설명으로 틀린 것은?","a":1,"o":["집단이 전문가로 이루어져 있을수록 동조행동은 커진다.","대체로 집단의 크기가 커질수록 동조행동은 줄어든다.","집단의 의견이나 행동의 만장일치가 깨지면 동조행동은 거의 나타나지 않는다.","비동조에의 동조(Conformity to Nonconformity)는 행위자의 과거행동에 일관되게 행동하려는 경향이다."]},{"id":"bk20200606-6","r":"bk20200606","n":6,"s":0,"q":"Küler-Ross가 주장한 죽음의 단계에 대한 순서로 옳은 것은?","a":0,"o":["부정 → 분노 → 타협 → 우울 → 수용","분노 → 우울 → 부정 → 타협 → 수용","우울 → 부정 → 분노 → 타협 → 수용","타협 → 부정 → 분노 → 우울 → 수용"]},{"id":"bk20200606-8","r":"bk20200606","n":8,"s":0,"q":"인본주의 성격이론에 대한 설명으로 옳은 것은?","a":3,"o":["무의식적 욕구나 동기를 강조한다.","대표적인 학자는 Bandura와 Watson이다.","외부 환경자극에 의해 행동이 결정된다고 본다.","개인의 성장 방향과 선택의 자유에 중점을 둔다."]},{"id":"bk20200606-9","r":"bk20200606","n":9,"s":0,"q":"성격의 5요인 모델에 속하지 않는 것은?","a":3,"o":["개방성","성실성","외향성","창의성"]},{"id":"bk20200606-10","r":"bk20200606","n":10,"s":0,"q":"성격의 일반적인 특성과 가장 거리가 먼 것은?","a":3,"o":["독특성","안정성","일관성","적응성"]},{"id":"bk20200606-11","r":"bk20200606","n":11,"s":0,"q":"프로이트(Freud)의 성격체계에서 자아(Ego)의 역할이 아닌 것은?","a":3,"o":["중재역할","현실원칙","충동지연","도덕적가치"]},{"id":"bk20200606-12","r":"bk20200606","n":12,"s":0,"q":"다음 중 모집단의 표준편차를 적은 수의 표본자료에서 추정할 경우 사용하는 분포로 가장 적합한 것은?","a":1,"o":["정규분포","t분포","χ2 분포","F분포"]},{"id":"bk20200606-13","r":"bk20200606","n":13,"s":0,"q":"효과적인 설득을 위해 고려해야 할 사항이 아닌 것은?","a":3,"o":["설득자가 설득행위가 일어난 상황에 주의를 기울일 필요가 있다.","설득자는 피설득자의 특질과 상태를 고려할 필요가 있다.","메시지의 강도가 중요하다.","설득자의 자아존중감이 무엇보다 중요하다."]},{"id":"bk20200606-14","r":"bk20200606","n":14,"s":0,"q":"강화계획 중 유기체는 여전히 특정한 수의 반응을 행한 후에 강화를 받지만 그 숫자가 예측할 수 없게 변하는 것은?","a":1,"o":["고정비율 강화계획","변동비율 강화계획","고정간격 강화계획","변동간격 강화계획"]},{"id":"bk20200606-15","r":"bk20200606","n":15,"s":0,"q":"뉴런의 전기화학적 활동에 관한 설명으로 옳지 않은 것은?","a":0,"o":["뉴런은 자연적으로 전하를 띠는데, 이를 활동전위라고 한다.","안정전위는 뉴런의 세포막 안과 밖 사이의 전하 차이를 의미한다.","활동전위는 축색의 세포막 채널에 변화가 있을 경우 발생한다.","활동전위는 전치 쇼크가 일정 수준 즉, 역치에 도달할 때에만 발생한다."]},{"id":"bk20200606-16","r":"bk20200606","n":16,"s":0,"q":"Piaget가 발달심리학에 끼친 영향과 가장 거리가 먼 것은?","a":1,"o":["환경 속의 자극을 적극적으로 구축하는 가설-생성적인 개체로 아동을 보게 하였다.","인간 마음의 변화를 생득적-경험적이라는 두 대립된 시각으로 보는 데 큰 기여를 했다.","발달심리학에서 추구하는 학습이론이 구조와 규칙에 대한 심리학이 되는 데 그 기반을 제공했다.","발달심리학이 인간의 복잡한 지적능력의 변화를 탐색하는 분야가 되는 데 기여했다."]},{"id":"bk20200606-17","r":"bk20200606","n":17,"s":0,"q":"로저스(Rogers)의 ‘자기 개념’에 관한 설명으로 옳지 않은 것은?","a":1,"o":["사람의 세상에 대한 지각에 영향을 준다.","상징화되지 못한 감정들로 구성되어 있다.","자기에는 지각된 자기 외에 되고 싶어 하는 자기도 포함된다.","지각된 경험에 의해 형성된다."]},{"id":"bk20200606-18","r":"bk20200606","n":18,"s":0,"q":"장기기억의 특성에 관한 설명 중 옳지 않은 것은?","a":0,"o":["장기기억에서 주의를 기울인 정보는 다음 기억인 작업기억으로 전이된다.","장기기억의 정보는 일반적으로 의미에 따라서 부호화된다.","장기기억에서의 망각은 인출 실패에 따른 것이다.","장기기억의 몇몇 망각은 저장된 정보의 상실에 의해 일어난다."]},{"id":"bk20200606-19","r":"bk20200606","n":19,"s":0,"q":"연합학습 이론에 대한 설명으로 틀린 것은?","a":0,"o":["고전적 조건형성 이론 : 능동적 차원의 행동변화","조작적 조건형성 이론 : 결과에 따른 행동변화","고전적 조건형성 이론 : 무조건 자극과 조건자극의 짝짓기 빈도, 시간적 근접성, 수반성 등이 중요","조작적 조건형성 이론 : 강화계획을 통해 행동출현 빈도의 조절 가능"]},{"id":"bk20200606-20","r":"bk20200606","n":20,"s":0,"q":"음식, 물과 같이 하나 이상의 보상과 연합되어 중립 자극 자체가 강화적 속성을 띠게 되는 현상은?","a":3,"o":["소거(Extinction)","자발적 회복(Spontaneous Recovery)","자극 일반화(Stimulus Generalization)","일반적 강화인(Generalized Reinforcer)"]},{"id":"bk20200606-21","r":"bk20200606","n":21,"s":1,"q":"병적 도벽에 관한 설명으로 옳은 것은?","a":0,"o":["개인적으로 쓸모가 없거나 금전적으로 가치가 없는 물건을 훔치려는 충동을 저지하는 데 반복적으로 실패한다.","훔친 후에 고조되는 긴장감을 경험한다.","훔치기 전에 기쁨, 충족감, 안도감을 느낀다.","훔치는 행동이 품행장애로 더 잘 설명되는 경우에도 추가적으로 진단한다."]},{"id":"bk20200606-22","r":"bk20200606","n":22,"s":1,"q":"주요 우울장애에 대한 설명으로 옳은 것은?","a":3,"o":["주요 우울장애의 유병률은 문화권에 관계없이 비슷하다.","주요 우울장애의 유병률은 60세 이상에서 가장 높다.","정신증적 증상이 나타나면 주요 우울장애로 진단할 수 없다.","생물학적 개입방법으로는 경두개자기자극법, 뇌심부자극 등이 있다."]},{"id":"bk20200606-23","r":"bk20200606","n":23,"s":1,"q":"성격장애에 대한 설명으로 옳은 것은?","a":3,"o":["성격장애는 아동기, 청소년기에는 진단할 수 없다.","반사회성 성격장애의 경우 품행장애의 과거력이 있다면 연령과 상관없이 진단할 수 있다.","회피성 성격장애의 유병률은 여성에게서 더 높다.","경계성 성격장애의 유병률은 여성에게서 더 높다."]},{"id":"bk20200606-24","r":"bk20200606","n":24,"s":1,"q":"자폐스펙트럼 장애의 진단에 특징적인 증상만으로 묶인 것은?","a":0,"o":["사회적-감정적 상호성의 결함, 관계 발전·유지 및 관계에 대한 이해의 결함, 상동증적이거나 반복적인 운동성 동작","구두 언어 발달의 지연, 비영양성 물질을 지속적으로 먹음, 상징적 놀이 발달의 지연","일반적인 의학적 상태, 타인과의 대화를 시작하거나 지속하는 능력의 현저한 장애, 발달수준에 적합한 친구관계 발달의 실패","동물에게 신체적으로 잔혹하게 대함, 반복적인 동작성 매너리즘(Mannerism), 다른 사람들과 자발적으로 기쁨을 나누지 못함"]},{"id":"bk20200606-25","r":"bk20200606","n":25,"s":1,"q":"이상심리학의 역사에 관한 설명으로 틀린 것은?","a":2,"o":["Kraepelin은 현대 정신의학의 분류체계에 공헌한 바가 크다.","고대 원시사회에서는 정신병을 초자연적 현상으로 이해하였다.","Hippocrates는 모든 질병은 그 원인이 마음에 있다고 하였다.","서양 중세에는 과학적 접근 대신 악마론적 입장이 성행하였다."]},{"id":"bk20200606-26","r":"bk20200606","n":26,"s":1,"q":"우울장애의 원인에 관한 설명으로 옳은 것은?","a":0,"o":["신경전달물질인 노르에피네프린 및 세로토닌의 결핍과 관련이 있다.","갑상선 기능 항진과 관련된다.","코티졸 분비감소와 관련된다.","비타민 B1, B6엽산의 과다와 관련이 있다."]},{"id":"bk20200606-27","r":"bk20200606","n":27,"s":1,"q":"환각제에 해당되는 약물은?","a":0,"o":["펜시클리딘","대마","카페인","오피오이드"]},{"id":"bk20200606-28","r":"bk20200606","n":28,"s":1,"q":"자기애성 성격장애에 대한 설명으로 틀린 것은?","a":2,"o":["과도한 숭배를 원한다.","자신의 중요성에 대해 과대한 느낌을 가진다.","자신의 방식에 따르지 않으면 일을 맡기지 않는다.","대인관계에서 착취적이다."]},{"id":"bk20200606-29","r":"bk20200606","n":29,"s":1,"q":"주요우울장애와 양극성 장애의 비교설명으로 옳은 것은?","a":2,"o":["주요우울장애와 양극성 장애의 발병률은 비슷하다.","주요우울장애는 여자가 남자보다, 양극성 장애는 남자가 여자보다 높은 발병률을 보인다.","주요우울장애는 사회경제적으로 낮은 계층에서 발생비율이 높고, 양극성 장애는 높은 계층에서 더 많이 발견된다.","주요우울장애 환자는 성격적으로 자아가 약하고 의존적이며, 강박적인 사고를 보이는 경우가 많은 데 비해, 양극성 장애의 경우에는 병전 성격이 히스테리성 성격장애의 특징을 보인다."]},{"id":"bk20200606-30","r":"bk20200606","n":30,"s":1,"q":"소인, 스트레스이론(Diathesis-Stress Theory)에 대한 설명으로 가장 적합한 것은?","a":3,"o":["소인은 생후 발생하는 생물학적 취약성을 의미한다.","스트레스가 소인을 변화시킨다.","소인과 스트레스는 서로 억제한다.","소인은 스트레스 상황에서 발현된다."]},{"id":"bk20200606-31","r":"bk20200606","n":31,"s":1,"q":"알츠하이머병으로 인한 신경인지장애의 특성에 대한 설명으로 옳은 것은?","a":1,"o":["초기에는 일반적으로 오래된 과거에 관한 기억장애만을 가지고 있다.","인지 기능의 저하는 서서히 나타난다.","기질적 장애 없이 나타나는 정신병적 상태이다.","약물, 인지, 행동적 치료 성공률이 높은 편이다."]},{"id":"bk20200606-32","r":"bk20200606","n":32,"s":1,"q":"다음 중 만성적인 알코올 중독자에게서 흔히 발생하는 것으로 비타민 B1(티아민) 결핍과 관련이 깊으며, 지남력 장애, 최근 및 과거 기억력의 상실, 작화증 등의 증상을 보이는 장애는?","a":1,"o":["혈관성 치매","코르사코프 증후군","진전 섬망","다운 증후군"]},{"id":"bk20200606-33","r":"bk20200606","n":33,"s":1,"q":"불안 증상을 중심으로 한 정신장애에 대한 설명으로 가장 거리가 먼 것은?","a":3,"o":["강박장애 : 원치 않는 생각이 침습적으로 경험되고, 이를 무시하거나 억압하려 하고, 중화시키려고 노력한다.","외상후스트레스장애 : 외상적 사건을 경험하고 난 후에 불안상태가 지속된다.","공황장애 : 갑자기 엄습하는 강렬한 불안, 즉 공황발작을 반복적으로 경험한다.","범불안장애 : 다른 사람들과 상호작용하는 사회적 상황을 두려워하여 회피한다."]},{"id":"bk20200606-34","r":"bk20200606","n":34,"s":1,"q":"DSM-5에서 변태성욕장애의 유형에 대한 설명으로 옳은 것은?","a":2,"o":["노출장애 : 다른 사람이 옷을 벗고 있는 모습을 몰래 훔쳐봄으로써 성적 흥분을 느끼는 경우","관음장애 : 동의하지 않는 사람에게 자신의 성기나 신체 일부를 반복적으로 나타내는 경우","소아성애장애 : 사춘기 이전의 아동을 대상으로 한 성적 활동을 통해 반복적이고 강렬한 성적 흥분이 성적 공상, 충동, 행동으로 발현되는 경우","성적가학장애 : 굴욕을 당하거나 매질을 당하거나 묶이는 등 고통을 당하는 행위를 중심으로 성적 흥분을 느끼거나 성적행위를 반복"]},{"id":"bk20200606-35","r":"bk20200606","n":35,"s":1,"q":"급식 및 섭식장애에 대한 설명으로 틀린 것은?","a":1,"o":["이식증은 아동기에서 가장 발병률이 높다.","되새김 증상은 다른 정신장애에서 발생하는 경우 심각성과 상관없이 추가적으로 진단할 수 있다.","신경성 폭식장애에서는 체중증가를 막기 위한 반복적이고 부적절한 보상행동이 나타난다.","신경성 식욕부진증의 유병률은 여성이 남성보다 높다."]},{"id":"bk20200606-36","r":"bk20200606","n":36,"s":1,"q":"지적장애에 관한 설명으로 틀린 것은?","a":3,"o":["심각한 두부외상으로 인해 이전에 습득한 인지적 기술을 소실한 경우에는 지적장애와 신경인지장애로 진단할 수 있다.","경도의 지적장애는 여성보다 남성에게 더 많다.","지적장애는 개념적, 사회적, 실행적 영역에 대한 평가로 진단된다.","지적장애 개인의 지능지수는 오차 범위를 포함해서 대략 평균에서 1표준편차 이하로 평가 된다."]},{"id":"bk20200606-37","r":"bk20200606","n":37,"s":1,"q":"조현병의 원인에 관한 설명으로 옳은 것은?","a":1,"o":["사회적 낙인 : 조현병 환자는 발병 후 도시에서 빈민거주지역으로 이동한다.","도파민(Dopamine) 가설 : 조현병의 발병이 도파민이라는 신경전달물질의 과다활동에 의해 유발된다.","사회선택이론 : 조현병이 냉정하고 지배적이며 갈등을 심어주는 어머니에 의해 유발된다.","표출정서 : 조현병이 뇌의 특정 영역의 구조적 손상에 의해 유발된다."]},{"id":"bk20200606-38","r":"bk20200606","n":38,"s":1,"q":"신경성 식욕부진증에 관한 설명으로 틀린 것은?","a":0,"o":["폭식하거나 하제를 사용하는 경우는 해당하지 않는다.","체중과 체형이 자기평가에 지나치게 영향을 미친다.","말랐는데도 체중의 증가와 비만에 대한 극심한 두려움이 있다.","체중을 회복시키고 다른 합병증의 치료를 위해 입원치료가 필요한 경우도 있다."]},{"id":"bk20200606-39","r":"bk20200606","n":39,"s":1,"q":"대형 화재현장에서 살아남은 남성이 불이 나는 장면에 극심하게 불안증상을 느낄 때 의심할 수 있는 가능성이 가장 높은 장애는?","a":0,"o":["외상후스트레스장애","적응장애","조현병","범불안장애"]},{"id":"bk20200606-40","r":"bk20200606","n":40,"s":1,"q":"섬망(Delirium) 증상의 특징이 아닌 것은?","a":2,"o":["주의를 기울이고 집중, 유지, 전환하는 능력의 감소","환경 또는 자신에 대한 지남력의 저하","증상은 오랜 기간에 걸쳐서 발생","오해, 착각 또는 환각을 포함하는 지각장애"]},{"id":"bk20200606-41","r":"bk20200606","n":41,"s":2,"q":"심리검사의 윤리적 문제에 대한 설명으로 옳지 않은 것은?","a":0,"o":["검사자들은 검사제작의 기술적 측면에만 관심을 가질 필요가 있다.","제대로 자격을 갖춘 검사자만이 검사를 사용해야 한다는 조건은 부당한 검사사용으로부터 피검자를 보호하기 위한 조치이다.","검사자는 규준, 신뢰도, 타당도 등에 관한 기술적 가치를 평가할 수 있어야 한다.","심리학자에게 면허와 자격에 관한 법을 시행하는 것은 직업적 윤리 기준을 세우기 위함이다."]},{"id":"bk20200606-42","r":"bk20200606","n":42,"s":2,"q":"MMPI-2의 재구성 임상척도 중 역기능적 부정 정서를 나타내며, 불안과 짜증 등을 경험하는 경우 상승하는 척도는?","a":2,"o":["RC4","RC1","RC7","RC9"]},{"id":"bk20200606-43","r":"bk20200606","n":43,"s":2,"q":"시각운동협응 및 시각적 단기기억, 계획성을 측정하며 운동(Motor)없이 순수하게 정보처리 속도를 측정하는 소검사는?","a":1,"o":["순서화","동형찾기","지우기","어휘"]},{"id":"bk20200606-44","r":"bk20200606","n":44,"s":2,"q":"MMPI-2의 임상척도 중 0번 척도가 상승한 경우 나타나는 특징은?","a":1,"o":["외향적이다.","소극적이다.","자신감이넘친다.","관계를 맺는 데 능숙하다."]},{"id":"bk20200606-45","r":"bk20200606","n":45,"s":2,"q":"표본에서 얻은 타당도 계수가 표집에 의한 우연요소에 의해 산출된 것이 아님을 확인하기 위해 필요한 것은?","a":0,"o":["추정의 표준오차","모집단의 표준편차","표본의 표준편차","표본의 평균"]},{"id":"bk20200606-46","r":"bk20200606","n":46,"s":2,"q":"Wechsler 지능검사를 실시할 때 주의할 사항으로 옳은 것은?","a":3,"o":["피검자가 응답을 못하거나 당황하면 정답을 알려주는 것이 원칙이다.","모호하거나 이상하게 응답한 문항을 다시 질문하여 확인할 필요는 없다.","모든 검사에서 피검자가 응답할 수 있을 때까지 충분한 여유를 주어야 한다.","피검자의 반응을 기록할 때는 그대로 기록하는 것이 원칙이다."]},{"id":"bk20200606-47","r":"bk20200606","n":47,"s":2,"q":"BGT(Bender-Gestalt Test)에 관한 설명으로 옳지 않은 것은?","a":2,"o":["기질적 장애를 판별하려는 목적에서 만들어졌다.","언어적인 방어가 심한 환자에게 유용하다.","정서적 지수와 기질적 지수가 거의 중복되지 않는다.","통일된 채점체계가 없으며 전문가간의 불일치가 발생할 수 있다."]},{"id":"bk20200606-48","r":"bk20200606","n":48,"s":2,"q":"다음 중 뇌손상으로 인해 기능이 떨어진 환자를 평가하고자 할 때 흔히 부딪힐 수 있는 환자의 문제와 가장 거리가 먼 것은?","a":0,"o":["시력장애","주의력 저하","동기저하","피로"]},{"id":"bk20200606-49","r":"bk20200606","n":49,"s":2,"q":"K-WAIS-IV에 규명한다.","내담자의 무의식을 의식화하고 자아를 강화시킨다.","주요한 상담기술로 인지적 재구성, 스트레스 면역 등이 있다.","합리적 행동 반응을 개발, 촉진하기 위한 행동연습을 실시한다."]},{"id":"bk20200606-98","r":"bk20200606","n":98,"s":4,"q":"가족상담의 기본적인 원리와 가장 거리가 먼 것은?","a":3,"o":["가족체제의 문제성을 이해하도록 한다.","자녀행동과 부모관계를 파악한다.","감정노출보다는 생산적 이해에 초점을 둔다.","현재보다 과거 상황에 초점을 둔다."]},{"id":"bk20200606-99","r":"bk20200606","n":99,"s":4,"q":"상담 종결에 관한 설명으로 옳지 않은 것은?","a":3,"o":["상담목표가 달성되지 않아도 상담을 종결할 수 있다.","상담의 진행결과가 성공적이었거나 실패했을 때에 이루어진다.","조기종결 시 상담자는 조기종결에 따른 내담자의 감정을 다뤄야 한다.","조기종결 시 상담자가 내담자에게 조기종결에 따른 솔직한 감정을 표현하는 것은 도움이 되지 않는다."]},{"id":"bk20200606-100","r":"bk20200606","n":100,"s":4,"q":"와이너(Weiner)의 비행분류에 관한 설명으로 옳지 않은 것은?","a":3,"o":["비행자의 심리적인 특징에 따라 사회적 비행과 심리적 비행을 구분한다.","심리적 비행에는 성격적 비행, 신경증적 비행, 정신병적(기질적) 비행이 있다.","신경증적 비행은 행위자가 타인의 주목을 끌 수 있는 방식으로 비행을 저지르는 경우가 많다.","소속된 비행하위집단 내에서 통용되는 삶의 방식들은 자존감과 소속감을 가져다주므로 장기적으로 적응적이라고 할 수 있다."]},{"id":"bk20210307-1","r":"bk20210307","n":1,"s":0,"q":"고전적 조건형성에서 조건자극과 무조건 자극을 배열할 때 조건형성효과가 가장 오래 지속되는 배열은?","a":2,"o":["후진 배열","흔적 배열","지연 배열","동시적 배열"]},{"id":"bk20210307-2","r":"bk20210307","n":2,"s":0,"q":"조건형성의 원리와 그에 해당하는 예를 잘못 연결시킨 것은?","a":2,"o":["조작적 조건형성의 응용 - 행동수정","소거에 대한 저항 – 부분강화 효과","강화보다 처벌 강조 - 행동조성","고전적 조건형성의 응용 – 유명연예인 광고모델"]},{"id":"bk20210307-3","r":"bk20210307","n":3,"s":0,"q":"성격의 5요인 이론 중 다른 사람들의 복지에 대해 관심을 가지며, 사람들을 신뢰하고, 다른 사람에 대해 편견을 덜 갖는 경향을 나타내는 것은?","a":2,"o":["개방성(Openness)","외향성(Extraversion)","우호성(Agreeableness)","성실성(Conscientiousness)"]},{"id":"bk20210307-6","r":"bk20210307","n":6,"s":0,"q":"심리검사의 오차유형 중 측정 결과에 변화를 주는 것은?","a":2,"o":["해석적 오차","항상적 오차","외인적 오차","검사자 오차"]},{"id":"bk20210307-7","r":"bk20210307","n":7,"s":0,"q":"프로이트(S. Freud)의 성격 구조에 관한 설명으로 옳은 것은?","a":0,"o":["자아는 현실원리를 따르며 개인이 현실에 적응하도록 돕는다.","자아는 일차적 사고과정을 따른다.","자아는 자아이상과 양심으로 구성되어 있다.","초자아는 성적욕구와 관련된 것으로 쾌락의 원리를 따른다."]},{"id":"bk20210307-8","r":"bk20210307","n":8,"s":0,"q":"검사에 포함된 각 질문 또는 문항들이 동일한 것을 측정하는 정도를 나타내는 것은?","a":0,"o":["내적일치도","경험타당도","구성타당도","준거타당도"]},{"id":"bk20210307-9","r":"bk20210307","n":9,"s":0,"q":"성격과 환경간의 상호작용 중 개인의 성격은 타인으로부터 독특한 반응을 이끌어낸다는 것은?","a":0,"o":["유도적 상호작용","반응적 상호작용","주도적 상호작용","조건적 상호작용"]},{"id":"bk20210307-10","r":"bk20210307","n":10,"s":0,"q":"캘리(Kelly)의 개인적 구성개념이론에 관한 설명으로 옳지 않은 것은?","a":2,"o":["성격 연구의 목적은 개인이 자신과 자신의 사회적 세상을 해석하는데 사용하는 차원을 찾는 것이어야 한다.","개개인을 직관적으로 과학자로 보아야 한다.","특질검사는 개인의 구성개념을 측정하기에 가장 적합하다.","구성개념의 대조 쌍은 논리적으로 반대일 필요가 없다."]},{"id":"bk20210307-11","r":"bk20210307","n":11,"s":0,"q":"성격의 정의에 관한 설명으로 틀린 것은?","a":3,"o":["성격에는 개인이 가지고 있는 고유하고 독특한 성질이 포함된다.","개인의 독특성은 시간이 지나도 비교적 안정적으로 변함없이 일관성을 지닌다.","성격은 다른 사람이나 환경과 상호작용하는 관계에서 행동양식을 통해 드러난다.","성격은 타고난 것으로 개인이 속한 가정과 사회적 환경에 영향을 받지 않는다."]},{"id":"bk20210307-12","r":"bk20210307","n":12,"s":0,"q":"단기기억의 특성이 아닌 것은?","a":3,"o":["정보의 용량이 매우 제한적이다.","작업기억(working memory)이라 불린다.","현재 의식하고 있는 정보를 의미한다.","거대한 도서관에 비유할 수 있다."]},{"id":"bk20210307-13","r":"bk20210307","n":13,"s":0,"q":"사람들이 자기 자신의 행동을 설명할 때 현저한 상황적 원인들은 지나치게 강조하고 사적인 원인들은 미흡하게 강조하는 것은?","a":1,"o":["사회억제 효과","과잉정당화 효과","인지부조화 효과","책임감 분산 효과"]},{"id":"bk20210307-14","r":"bk20210307","n":14,"s":0,"q":"연구방법의 주요 개념에 관한 설명으로 옳지 않은 것은?","a":2,"o":["측정 : 한 변인의 여러 값들에 숫자를 할당하는 체계","실험 : 원인과 결과에 대한 가설을 정밀하게 검사하는 것","실험집단 : 가설의 원인이 제공되지 않는 집단","독립변인 : 실험자에 의해 정밀하게 통제되는 가설의 원인으로서 참가자의 과제와 무관한 변인"]},{"id":"bk20210307-15","r":"bk20210307","n":15,"s":0,"q":"사랑의 삼각형 이론에서 사랑의 3가지 요소에 포함되지 않는 것은?","a":0,"o":["관심(Attention)","친밀감(Intimacy)","열정(Passion)","투신(Commitment)"]},{"id":"bk20210307-16","r":"bk20210307","n":16,"s":0,"q":"사람들은 혼자 있을 때보다 자신과 같은 일을 수행하고 있는 다른 사람들이 있을 때 수행이 향상된다는 것을 지칭하는 것은?","a":2,"o":["동조효과","방관자효과","사회촉진","사회태만"]},{"id":"bk20210307-18","r":"bk20210307","n":18,"s":0,"q":"기억에 정보를 저장하기 위해서 환경의 물리적 정보의 속성을 기억에 저장할 수 있는 속성으로 변화시키는 과정은?","a":2,"o":["주의과정","각성과정","부호화과정","인출과정"]},{"id":"bk20210307-19","r":"bk20210307","n":19,"s":0,"q":"통계분석에 관한 설명으로 옳지 않은 것은?","a":0,"o":["2개의 모평균 간에 차이가 있는지를 검정하기 위해서 중다회귀분석(multiple regression analysis)을 이용한다.","3개 또는 그 이상의 평균치 사이에 차이가 있는지를 검정하기 위해서 분산분석을 사용한다.","빈도 차이의 유의성을 검증하기 위해서 χ2검정을 사용한다.","피어슨 상관계수 r은 근본적으로 관련성을 보여주는 지표이지 어떠한 인과적 요인을 밝혀주지는 않는다."]},{"id":"bk20210307-20","r":"bk20210307","n":20,"s":0,"q":"소거(extinction)가 영구적인 망각이 아니라는 증거가 될 수 있는 것은?","a":3,"o":["변별","조형","자극 일반화","자발적 회복"]},{"id":"bk20210307-21","r":"bk20210307","n":21,"s":1,"q":"이상행동의 분류와 평가에 관한 설명으로 옳지 않은 것은?","a":2,"o":["범주적 분류는 이상행동이 정상행동과는 질적으로 구분되며 흔히 독특한 원인에 의한 것이기 때문에 정상행동과는 명료한 차이점을 지니고 있다는 가정에 근거한다.","차원적 분류는 정상행동과 이상행동의 구분이 부적응성 정도의 문제일 뿐 질적인 차이는 없다는 가정에 근거한다.","타당도는 한 분류체계를 적용하여 환자들의 증상이나 장애를 평가했을 때 동일한 결과가 도출되는 정도를 의미한다.","같은 장애로 진단된 사람들에게서 동일한 원인적 요인들이 발전되는 정도는 원인론적 타당도이다."]},{"id":"bk20210307-22","r":"bk20210307","n":22,"s":1,"q":"조현병의 양성증상에 해당하는 것은?","a":2,"o":["무의욕증","무사회증","와해된 행동","감퇴된 정서 표현"]},{"id":"bk20210307-23","r":"bk20210307","n":23,"s":1,"q":"물질관련장애에 관한 설명으로 옳지 않은 것은?","a":2,"o":["물질에 대한 생리적 의존은 내성과 금단증상으로 나타난다.","임신 중의 과도한 음주는 태아알코올증후군을 유발할 수 있다.","모르핀과 헤로인은 자극제(흥분제)의 대표적 종류이다.","헤로인의 과다 복용은 뇌의 호흡 중추를 막아 죽음에 이르게 할 수 있다."]},{"id":"bk20210307-24","r":"bk20210307","n":24,"s":1,"q":"조현병 스펙트럼 및 기타 정신병적장애에 해당하지 않는 것은?","a":1,"o":["망상장애","순환성장애","조현양상장애","단기 정신병적 장애"]},{"id":"bk20210307-25","r":"bk20210307","n":25,"s":1,"q":"반사회성 성격장애와 가장 관련이 없는 것은?","a":2,"o":["품행장애의 과거력","역기능적 양육환경","붕괴된 자아와 강한 도덕성 발달","신경전달물질인 세로토닌(SErotonin)의 부족"]},{"id":"bk20210307-26","r":"bk20210307","n":26,"s":1,"q":"DSM-5에 의한 성격장애의 분류로 옳지 않은 것은?(문제 오류로 가답안 발표시 2번으로 발표되었지만 확정답안 발표시 1, 2번이 정답처리 되었습니다. 여기서는 가답안인 2번을 누르시면 정답 처리 됩니다.)","a":1,"o":["A군 성격장애 : 조현성 성격장애","C군 성격장애 : 편집성 성격장애","B군 성격장애 : 연극성 성격장애","C군 성격장애 : 회피성 성격장애"]},{"id":"bk20210307-27","r":"bk20210307","n":27,"s":1,"q":"노출장애에 관한 설명과 가장 거리가 먼 것은?","a":3,"o":["성도착적 초점은 낯선 사람에게 성기를 노출시키는 것이다.","성기를 노출시켰다는 상상을 하면서 자위행위를 하기도 한다.","청소년기나 성인기 초기에 시작되는 것으로 알려져 있다.","노출 대상은 사춘기 이전의 아동에게 국한된다."]},{"id":"bk20210307-28","r":"bk20210307","n":28,"s":1,"q":"DSM-5의 신경발달장애에 해당하지 않는 것은?","a":1,"o":["지적장애","분리불안장애","자폐스펙트럼장애","주의력결핍 과잉행동장애"]},{"id":"bk20210307-29","r":"bk20210307","n":29,"s":1,"q":"스트레스 호르몬이라고 불리는 코티솔(cortisol)이 분비되는 곳은?","a":0,"o":["부신","변연계","해마","대뇌피질"]},{"id":"bk20210307-30","r":"bk20210307","n":30,"s":1,"q":"강박장애를 가진 내담자의 심리치료에 가장 효과적인 방법은?","a":2,"o":["행동조형","자유연상법","노출 및 반응 방지법","혐오조건화"]},{"id":"bk20210307-31","r":"bk20210307","n":31,"s":1,"q":"우울장애에 대한 치료방법으로 적절하지 않은 것은?","a":1,"o":["대인관계치료(interpersonal psychotherapy)","기억회복치료(memory recovery therapy)","인지행동치료(cognitive behavioral therapy)","단기정신역동치료(brief psychodynamic therapy)"]},{"id":"bk20210307-32","r":"bk20210307","n":32,"s":1,"q":"알코올 사용장애에 관한 설명으로 옳은 것은?","a":3,"o":["가족력이나 유전과는 관련성이 거의 없다.","성인 여자가 성인 남자보다 유병률이 높다.","자살, 사고, 폭력과의 관련성이 거의 없다.","금단 증상의 불쾌한 경험을 피하거나 경감시키기 위해 음주를 지속하게 된다."]},{"id":"bk20210307-33","r":"bk20210307","n":33,"s":1,"q":"파괴적, 충동조절 및 품행장애에 관한 설명으로 옳지 않은 것은?","a":3,"o":["병적 방화의 필수 증상은 고의적이고 목적이 있는, 수차례의 방화 삽화가 존재하는 것이다.","품행장애의 유병률은 아동기에서 청소년기로 갈수록 증가한다.","병적 도벽은 보통 도둑질을 미리 계획하지 않고 행한다.","간헐적 폭발성 장애는 언어적 공격과 신체적 공격을 모두 포함해야 한다."]},{"id":"bk20210307-34","r":"bk20210307","n":34,"s":1,"q":"양극성장애(Bipolar disorder) 조증시기에 있는 환자의 방어적 대응양상을 판단할 수 있는 행동이 아닌 것은?","a":3,"o":["화장을 진하게 하고 다닌다.","자신이 신의 사자라고 이야기 한다.","증거도 없는 행동을 두고 남을 탓한다.","활동 의욕은 줄어들어 과다 수면을 취한다."]},{"id":"bk20210307-35","r":"bk20210307","n":35,"s":1,"q":"DSM-5에 제시된 신경인지장애의 병인에 해당하지 않는 것은?","a":1,"o":["알츠하이머병","레트","루이소체","파킨슨병"]},{"id":"bk20210307-37","r":"bk20210307","n":37,"s":1,"q":"치매에 관한 설명으로 가장 적합한 것은?","a":3,"o":["기억손실이 없다.","약물남용의 가능성이 많다.","증상은 오전에 가장 심해진다.","자신의 무능을 최소화하거나 자각하지 못한다."]},{"id":"bk20210307-39","r":"bk20210307","n":39,"s":1,"q":"해리장애에 대한 설명으로 적절하지 않은 것은?","a":1,"o":["해리 현상에 영향을 주는 주된 요인으로 학대받은 개인경험, 고통스러운 상태로부터의 도피 등이 있다.","해리 현상을 유발하는 가장 주된 방어기제는 투사로 알려져 있다.","해리성 둔주는 정체감과 과거를 망각할 뿐만 아니라 완전히 다른 장소로 이동한다.","해리성 기억상실증은 중요한 자서전적 정보를 회상하지 못하는 것으로, 해리성 둔주가 나타날 수 있다."]},{"id":"bk20210307-40","r":"bk20210307","n":40,"s":1,"q":"주요우울장애 환자가 일반적으로 나타내는 특징적 증상이 아닌 것은?","a":0,"o":["거절에 대한 두려움","불면 혹은 과다수면","정신운동성 초조","일상활동에서의 흥미와 즐거움의 상실"]},{"id":"bk20210307-41","r":"bk20210307","n":41,"s":2,"q":"신경심리학적 능력 중 BGT 및 DAP, 시계 그리기를 통해 가장 효과적으로 평가할 수 있는 것은?","a":3,"o":["주의 능력","기억 능력","실행 능력","시공간 구성 능력"]},{"id":"bk20210307-42","r":"bk20210307","n":42,"s":2,"q":"신경심리검사에 대한 설명으로 옳은 것은?","a":3,"o":["Broca와 Wernicke는 실어증 연구에 뛰어난 업적을 남겼으며, Benton은 임상신경 심리학의 창시자라고 할 수 있다.","X레이, MRI 등 의료적 검사결과가 정상으로 나온 경우에는 신경심리검사보다는 의료적 검사결과를 신뢰하는 것이 타당하다.","신경심리검사는 고정식(fixed) battery와 융통식(flexible) battery 접근이 있는데, 두 가지 접근 모두 하위검사들이 독립적인 검사들은 아니다.","신경심리검사는 환자에 대한 진단 환자의 강점과 약점, 향후 직업능력의 판단, 치료계획, 법의학적 판단, 연구 등에 널리 활용된다."]},{"id":"bk20210307-44","r":"bk20210307","n":44,"s":2,"q":"표집 시 남녀 비율을 정해놓고 표집해야 하는 경우에 가장 적합한 방법은?","a":1,"o":["군집표집(cluster sampling)","유층표집(stratified sampling)","체계적표집(systematic sampling)","구체적 표집(specific sampling)"]},{"id":"bk20210307-45","r":"bk20210307","n":45,"s":2,"q":"MMPI-2의 각 척도에 대한 해석으로 가장 적합한 것은?","a":0,"o":["6번 척도가 60T 내외로 약간 상승한 것은 대인관계 민감성에 대한 경험을 나타낸다.","2번 척도는 반응성 우울증보다는 내인성 우울증과 관련이 높다.","4번 척도의 상승 시 심리치료 동기가 높고 치료의 예후가 좋음을 나타낸다.","7번 척도는 불안 가운데 상태불안 증상과 연관성이 높다."]},{"id":"bk20210307-46","r":"bk20210307","n":46,"s":2,"q":"웩슬러 지능검사의 하위지수 중 지적 장애를 가진 사람들의 어려움을 겪는 것으로 알려진 소검사자들을 가장 많이 포함하고 있는 것은?","a":0,"o":["언어이해","지각추론","작업기억","처리속도"]},{"id":"bk20210307-47","r":"bk20210307","n":47,"s":2,"q":"Guilford의 지능구조 입체모형에서 조작(operation) 요인에 해당하는 것은?","a":1,"o":["표정, 동작 등의 행동적 정보","사고결과의 적절성을 판단하는 평가","의미 있는 단어나 개념의 의미적 정보","어떤 정보에서 생기는 예상이나 기대들의 합"]},{"id":"bk20210307-48","r":"bk20210307","n":48,"s":2,"q":"지능검사를 해석할 때 고려사항으로 옳지 않은 것은?","a":2,"o":["작업기억과 처리속도는 상황적 요인에 민감한 지수임을 감안한다.","지수점수를 해석할 때 여러 지수들 간에 점수 차이가 유의한지를 살펴봐야 한다.","지수가 유의한 차이가 있을 경우 전체척도 IQ는 해석하기가 용이하다.","지수 점수간의 비교를 통해 상대적 약점이 문제의 원인이 될 수 있는지 확인한다."]},{"id":"bk20210307-50","r":"bk20210307","n":50,"s":2,"q":"BSID-Ⅱ(Bayley Scale of Infant Development-Ⅱ)에 대한 설명으로 틀린 것은?","a":3,"o":["신뢰도와 타당도에 관한 보다 많은 정보를 제공하여 검사의 심리측정학적 질이 개선되었다.","유아의 기억, 습관화, 시각선호도, 문제해결 등과 관련된 문항들이 추가되었다.","BSID-Ⅱ에서는 대상 연령범위가 16일에서 42개월까지로 확대되었다.","지능척도, 운동척도의 2가지 척도로 구성되어 있다."]},{"id":"bk20210307-51","r":"bk20210307","n":51,"s":2,"q":"성격을 측정하는 자기보고 검사에 관한 설명으로 옳은 것은?","a":3,"o":["개인의 심층적인 내면을 탐색하는데 흔히 사용된다.","응답결과는 개인의 반응경향성과 무관하다.","강제선택형 문항은 개인의 묵종 경향성을 예방하는데 효과적이다.","사회적으로 바람직하게 응답하려는 경향을 나타내기 쉽다."]},{"id":"bk20210307-52","r":"bk20210307","n":52,"s":2,"q":"80세 이상의 노인집단용 규준이 마련되어 있는 심리검사는?","a":2,"o":["MMPI-A","K-WISC-Ⅳ","K-Vineland-Ⅱ","SMS(Social Maturity Scale)"]},{"id":"bk20210307-53","r":"bk20210307","n":53,"s":2,"q":"Rorschach 검사에서 반응의 결정인 중 인간운동반응(M)에 대한 설명으로 옳지 않은 것은?","a":3,"o":["M 반응이 많은 사람은 행동이 안정되어 있고 능력이 뛰어남을 나타낸다.","M 반응이 많을수록 그 사람은 그의 세계의 지각을 풍부하게 만들기 위해 자유롭게 구사할 수 있는 상상력을 지니고 있다.","상쾌한 기분은 M 반응의 수를 증가시킨다.","좋은 형태의 수준을 가진 M의 출현은 높은 지능의 존재를 부정하는 것이며 가능한 M이 많이 나타난다는 사실은 낮은 지능을 의미한다."]},{"id":"bk20210307-54","r":"bk20210307","n":54,"s":2,"q":"MMPI-2의 자아강도 척도(ego strength scale)에 관한 설명으로 틀린 것은?","a":3,"o":["정신치료의 성공여부를 예측하기 위해 고안되었다.","개인의 전반적인 기능수준과 상관이 있다.","효율적인 기능과 스트레스를 견디는 능력을 반영한다.","F 척도가 높을수록 자아 강도 척도의 점수는 높아진다."]},{"id":"bk20210307-55","r":"bk20210307","n":55,"s":2,"q":"MMPI-2 검사를 실시할 때 고려해야 할 사항으로 옳지 않은 것은?","a":3,"o":["검사의 목적과 결과의 비밀보장에 대해 설명한다.","검사 결과는 환자와 치료자에게 중요한 자료가 됨을 강조할 필요가 있다.","수검자들이 피로해있지 않는 시간대를 선택한다.","수검자의 독해력은 중요하지 않다."]},{"id":"bk20210307-56","r":"bk20210307","n":56,"s":2,"q":"신경심리검사의 실시에 대한 설명으로 옳은 것은?","a":1,"o":["두부 외상이나 뇌졸중 환자의 경우에는 급성기에 바로 검사를 실시하는 것이 바람직하다.","어려운 검사는 피로가 적은 상태에서 실시하고 어려운 검사와 쉬운 검사를 교대로 실시하는 것이 좋다.","운동 기능을 측정하는 검사는 과제제시와 검사 사이에 간섭과제를 사용한다.","진행성 뇌질환의 경우 6개월 정도가 지난 후에 정신상태와 인지기능을 평가하는 것이 바람직하다."]},{"id":"bk20210307-57","r":"bk20210307","n":57,"s":2,"q":"타당도에 관한 설명으로 틀린 것은?","a":2,"o":["준거타당도는 검사점수와 외부 측정에서 얻은 일련의 수행을 비교함으로써 결정된다.","준거타당도는 경험타당도 또는 예언타당도라고 불리기도 한다.","구성타당도는 측정될 구성개념에 대한 평가도구의 대표성과 적합성을 말한다.","구성타당도는 내용 및 준거타당도 접근법에서 직면하게 될 부적합성 및 문제점을 해결하기 위해 개발되었다."]},{"id":"bk20210307-58","r":"bk20210307","n":58,"s":2,"q":"지능을 구성하는 요인에 관한 Cattell과 Horn의 이론 중 결정화된 지능(crystallized intelligence)에 관한 설명으로 옳은 것은?","a":3,"o":["비언어적 요인과 관련된 능력을 말한다.","후천적이기 보다는 선천적으로 이미 결정화된 지능의 측면을 말한다.","나이가 늘어감에 따라 낮아진다.","문화적 요인에 의해 더 많은 영향을 받는다."]},{"id":"bk20210307-59","r":"bk20210307","n":59,"s":2,"q":"적성검사에 관한 설명으로 옳지 않은 것은?","a":3,"o":["개인의 특수한 영역에서의 능력을 측정한다.","적성검사는 능력검사로 불리기도 한다.","적성검사는 개인의 미래수행을 예측하는데 사용된다.","학업적성은 실제 학업성취도와 일치한다."]},{"id":"bk20210307-60","r":"bk20210307","n":60,"s":2,"q":"K-WISC-Ⅳ에서 인지효능지표에 포함되는 소검사가 아닌 것은?","a":1,"o":["숫자","행렬 추리","기호쓰기","순차연결"]},{"id":"bk20210307-61","r":"bk20210307","n":61,"s":3,"q":"강제입원, 아동 양육권, 여성에 대한 폭력, 배심원 선정 등의 문제에 특히 관심을 가지는 심리학 영역은?","a":2,"o":["아동임상심리학","임상건강심리학","법정심리학","행동의학"]},{"id":"bk20210307-62","r":"bk20210307","n":62,"s":3,"q":"MMPI-2의 타당도 척도 중 부정 왜곡을 통해 극단적인 수준으로 정신병적 문제가 있음을 나타내려는 경우에 상승되는 것은?","a":1,"o":["S scale","F(P) scale","TRIN scale","VRIN scale"]},{"id":"bk20210307-63","r":"bk20210307","n":63,"s":3,"q":"역할-연기에 대한 설명과 가장 거리가 먼 것은?","a":3,"o":["주장 훈련과 관련이 있다.","사회적 기술을 포함하고 있다.","행동시연을 해야 한다.","이완 훈련을 해야 한다."]},{"id":"bk20210307-64","r":"bk20210307","n":64,"s":3,"q":"미국에서 임상심리학이 비약적으로 발전하게 된 계기가 된 것은?","a":2,"o":["자원봉사자들의 활동","루스벨트 대통령의 후원","제2차 세계대전","매카시즘의 등장"]},{"id":"bk20210307-65","r":"bk20210307","n":65,"s":3,"q":"임상심리사로서 전문적인 관계를 유지하는데 바람직한 지침사항과 가장 거리가 먼 것은?","a":3,"o":["다른 전문직에 종사하는 동료들의 욕구, 특수한 능력, 그리고 의무에 대하여 적절한 관심을 가져야 한다.","동료 전문가와 관련된 단체나 조직의 특권 및 의무를 존중하여 행동하여야 한다.","소비자의 최대이익에 기여하는 모든 자원들을 활용해야 한다.","동료 전문가의 윤리적 위반가능성을 인지하면 즉시 해당 전문가 단체에 고지해야 한다."]},{"id":"bk20210307-66","r":"bk20210307","n":66,"s":3,"q":"시각적 처리와 시각적으로 중재된 기억의 일부 측면에 관여하는 뇌의 위치는?","a":1,"o":["두정엽","후두엽","전두엽","측두엽"]},{"id":"bk20210307-67","r":"bk20210307","n":67,"s":3,"q":"불안에 관한 노출치료의 내용과 가장 거리가 먼 것은?","a":0,"o":["노출은 불안을 더 일으키는 자극에서 낮은 불안을 일으키는 자극 순으로 진행되어야 한다.","노출은 공포, 불안이 제거될 때까지 반복되어야 한다.","노출은 불안을 유발해야 한다.","환자는 될 수 있는 한 공포스러운 자극에 주의를 기울이고 그 자극과 관계를 맺도록 노력해야 한다."]},{"id":"bk20210307-69","r":"bk20210307","n":69,"s":3,"q":"행동평가에 관한 설명으로 가장 적합한 것은?","a":2,"o":["자연적인 상황에서 실제 발생한 것만을 대상으로 평가한다.","행동표본은 내면심리를 반영한 것으로 해석된다.","특정 표적행동의 조작적 정의가 상이할 수 있음을 고려해야 한다.","관찰 결과는 요구특성이나 피험자의 반응성 요인과는 무관하다."]},{"id":"bk20210307-70","r":"bk20210307","n":70,"s":3,"q":"문장완성검사에 관한 설명으로 틀린 것은?","a":1,"o":["수검자의 자기개념, 가족관계 등을 파악할 수 있다.","수검자가 검사자극의 내용을 감지할 수 없도록 구성되어 있다.","수검자에 따라 각 문항의 모호함을 정도는 달라질 수 있다.","개인과 집단 모두에게 실시될 수 있다."]},{"id":"bk20210307-71","r":"bk20210307","n":71,"s":3,"q":"심리치료 이론 중 전이와 역전이의 중요성을 강조하고 치료에 활용하는 접근은?","a":0,"o":["정신분석적 접근","행동주의적 접근","인본주의적 접근","게슈탈트적 접근"]},{"id":"bk20210307-72","r":"bk20210307","n":72,"s":3,"q":"인간중심치료에 대한 설명으로 적합하지 않은 것은?","a":3,"o":["인간중심접근은 개인의 독립과 통합을 목표로 삼는다.","인간 중심적 상담(치료)은 치료과정과 결과에 대한 연구관심사를 포괄하면서 개발되었다.","치료자는 주로 내담자의 자기와 세계에 대한 인식에 주로 관심을 가진다.","내담자가 정상인인가, 신경증 환자인가, 정신병 환자인가에 따라 각기 다른 치료원리가 적용된다."]},{"id":"bk20210307-73","r":"bk20210307","n":73,"s":3,"q":"임상심리사가 수행하는 역할과 가장 거리가 먼 것은?","a":2,"o":["심리치료상담","심리검사","언어치료","심리재활"]},{"id":"bk20210307-76","r":"bk20210307","n":76,"s":3,"q":"합동가족치료에 대한 설명으로 틀린 것은?","a":0,"o":["비행 청소년들과 그들의 가족들을 위한 개입법으로 개발되었다.","한 치료자가 가족전체를 동시에 본다.","치료자는 상황에 따라 비지시적인 역할을 할 수 있다.","치료자는 가족 구성원에게 과제를 준다."]},{"id":"bk20210307-77","r":"bk20210307","n":77,"s":3,"q":"Rogers가 제안한 내담자의 긍정적 변화를 촉진시키기 위한 치료자의 3가지 조건에 해당하지 않는 것은?","a":2,"o":["무조건적 존중","정확한 공감","창의성","솔직성"]},{"id":"bk20210307-78","r":"bk20210307","n":78,"s":3,"q":"접수면접의 목적에 대한 설명으로 가장 적합한 것은?","a":1,"o":["환자의 심리적 기능 수준과 망상, 섬망 또는 치매와 같은 이상 정신현상의 유무를 선별하기 위해 실시한다.","가장 적절한 치료나 중재 계획을 권고하고 환자의 증상이나 관심을 더 잘 이해하기 위해 실시한다.","환자가 중대하고 외상적이거나 생명을 위협하는 위기에 있을 때 그 상황에서 구해내기 위해서 실시한다.","환자가 보고하는 증상들과 문제들을 진단으로 분류하기 위해서 실시한다."]},{"id":"bk20210307-80","r":"bk20210307","n":80,"s":3,"q":"평가면접에서 면접자의 태도에 대한 설명으로 틀린 것은?","a":1,"o":["수용 : 내담자의 가치에 대한 기본적인 존중과 관련되어 있다.","해석 : 면접자가 자신의 내면과 부합하는 심상을 수용하는 것과 관련되어 있다.","이해 : 내담자의 관점에서 세계를 보기 위한 노력과 관련되어 있다.","진실성 : 면접자의 내면과 부합하는 것을 전달하는 정도와 관련되어 있다."]},{"id":"bk20210307-82","r":"bk20210307","n":82,"s":4,"q":"보딘(Bordin)이 제시한 작업동맹(working alliance)의 3가지 측면이 옳은 것은?","a":2,"o":["작업의 동의, 진솔한 관계, 유대관계","진솔한 관계, 유대관계, 서로에 대한 호감","유대관계, 작업의 동의, 목표에 대한 동의","서로에 대한 호감, 동맹, 작업의 동의"]},{"id":"bk20210307-83","r":"bk20210307","n":83,"s":4,"q":"인간중심상담에 관한 설명으로 옳지 않은 것은?","a":3,"o":["모든 인간에게 실현경향성이 있다고 보는 긍정적 인간관을 지닌다.","이상적 자기와 현실적 자기 간의 괴리가 큰 경우 심리적 부적응이 발생한다고 본다.","상담자가 내담자에 대해 무조건적 긍정적 존중의 태도를 지니는 것을 강조한다.","아동은 부모의 기대와 가치를 내면화하여 현실적인 자기를 형성한다."]},{"id":"bk20210307-84","r":"bk20210307","n":84,"s":4,"q":"정신분석적 상담기법 중 상담진행을 방해하고 현재 상태를 유지하려는 의식적, 무의식적 생각, 태도, 감정, 행동을 의미하는 것은?","a":1,"o":["전이","저항","해석","훈습"]},{"id":"bk20210307-85","r":"bk20210307","n":85,"s":4,"q":"Krumboltz가 제시한 상담의 목표에 해당하지 않는 것은?","a":3,"o":["내담자가 요구하는 목표이어야 한다.","상담자의 도움을 통해 내담자가 달성할 수 있는 목표이어야 한다.","내담자가 상담목표 성취의 정도를 평가할 수 있어야 한다.","모든 내담자에게 동일하게 적용될 수 있는 목표이어야 한다."]},{"id":"bk20210307-86","r":"bk20210307","n":86,"s":4,"q":"상담 진행과정에 관한 설명으로 옳지 않은 것은?","a":0,"o":["초기 : 비자발적 내담자의 경우 상담목표를 설정하지 않음","중기 : 내담자가 자신의 문제를 이해하고 반복적인 학습이 일어남","중기 : 문제 해결 과정에서 저항이 나타날 수 있음","종결기 : 상담 목표를 기준으로 상담성과를 평가함"]},{"id":"bk20210307-87","r":"bk20210307","n":87,"s":4,"q":"글래서(Glasser)의 현실치료 이론에서 가정하는 기본적인 욕구가 아닌 것은?","a":2,"o":["생존의 욕구","권력의 욕구","자존감의 욕구","재미에 대한 욕구"]},{"id":"bk20210307-88","r":"bk20210307","n":88,"s":4,"q":"내담자의 현재 상황에서의 욕구와 체험하는 감정의 자각을 중요시하는 상담이론은?","a":1,"o":["인간중심 상담","게슈탈트 상담","교류분석 상담","현실치료 상담"]},{"id":"bk20210307-89","r":"bk20210307","n":89,"s":4,"q":"위기개입전력으로 옳지 않은 것은?","a":2,"o":["내담자의 즉각적인 욕구에 주목한다.","내담자와 진실한 관계를 형성하는 것이 중요하다.","위기개입 시 현재 상황과 관련된 과거에 초점을 맞춘다.","각각의 내담자와 위기를 독특한 것으로 보고 반응한다."]},{"id":"bk20210307-90","r":"bk20210307","n":90,"s":4,"q":"도박중독의 심리·사회적 특징에 대한 설명으로 옳은 것은?","a":3,"o":["도박 중독자들은 대체로 도박에만 집착할 뿐 다른 개인적인 문제를 가지지 않는다.","도박 중독자들은 직장에서 도박 자금을 마련하기 위해 남보다 더 열심히 노력한다.","심리적 특징으로 단기적인 만족을 추구하기 보다는 장기적인 만족을 추구한다.","도박행동에 문제가 있음을 인정하지 않고 변명하려 든다."]},{"id":"bk20210307-91","r":"bk20210307","n":91,"s":4,"q":"학업상담의 특징에 관한 설명으로 틀린 것은?","a":2,"o":["비자발적 내담자가 많다.","부모의 관여가 적절한 수준과 형태로 이루어지도록 돕는다.","학습의 영역에서 문제가 발생하였으므로 문제의 원인은 인지적인 것이다.","학습과정에서 겪는 문제를 통합적으로 해결하여 유능한 학습자가 되도록 조력하는 과정이다."]},{"id":"bk20210307-92","r":"bk20210307","n":92,"s":4,"q":"상담자의 윤리의 관한 설명으로 틀린 것은?","a":3,"o":["비밀보장은 상담진행 과정 중 가장 근본적인 윤리기준이다.","내담자의 윤리는 개인 상담뿐만 아니라 집단상담이나 가족상담에서도 고려되어야 한다.","상담여부를 결정하는 것을 내담자이며 상담자는 내담자에게 정확한 정보를 제공해야 한다.","상담이론과 기법은 반복적으로 검증된 것이므로 시대 및 사회여건과 무관하게 적용해야 한다."]},{"id":"bk20210307-93","r":"bk20210307","n":93,"s":4,"q":"성희롱 피해 경험으로 인해 분노, 불안, 수치심을 느끼고 대인관계를 기피하는 내담자에 대한 초기 상담 개입 전략으로 옳지 않은 것은?","a":3,"o":["분노상황을 탐색하고 호소 문제를 구체화한다.","불안감소를 위해 이완 기법을 실시한다.","수치심과 관련된 감정을 반영해 준다.","대인관계 문제 해결을 위해 가해자에 대한 공감 훈련을 한다."]},{"id":"bk20210307-94","r":"bk20210307","n":94,"s":4,"q":"청소년 비행의 원인을 사회학적 관점에서 설명하는 이론이 아닌 것은?","a":2,"o":["아노미이론","사회통제이론","욕구실현이론","하위문화이론"]},{"id":"bk20210307-95","r":"bk20210307","n":95,"s":4,"q":"교류분석에서 치료의 바람직한 목표인 치유의 4단계에 해당되지 않는 것은?","a":0,"o":["계약의 설정","증상의 경감","전이의 치유","각본의 치유"]},{"id":"bk20210307-96","r":"bk20210307","n":96,"s":4,"q":"진로상담에서 진로 미결정 내담자를 위한 개입방법과 비교하여 우유부단한 내담자에 대한 개입방법이 갖는 특징이 아닌 것은?","a":2,"o":["장기적인 계획 하에 상담해야 한다.","대인관계나 가족 문제에 대한 개입이 필요하다.","정보제공이나 진로선택에 관한 문제를 명료화하는 개입이 효과적이다.","문제의 기저에 있는 역동을 이해하고 감정을 반영하는 것이 효과적이다."]},{"id":"bk20210307-98","r":"bk20210307","n":98,"s":4,"q":"심리학 지식을 상담이나 치료의 목적으로 활용하기 위해 최초의 심리클리닉을 펜실베니아 대학교에 설립한 사람은?","a":0,"o":["위트머(Witmer)","볼프(Wolpe)","스키너(Skinner)","로저스(Rogers)"]},{"id":"bk20210307-99","r":"bk20210307","n":99,"s":4,"q":"Ellis의 ABCDE 모형에 관한 설명으로 옳은 것은?","a":2,"o":["A : 문제 장면에 대한 내담자의 신념","B : 선행사건","C : 정서적·행동적 결과","D : 새로운 감정과 행동"]},{"id":"bk20210814-1","r":"bk20210814","n":1,"s":0,"q":"기질과 애착에 관한 설명으로 틀린 것은?","a":0,"o":["불안정-회피애착 아동은 주양육자에게 과도한 집착을 보인다.","내적작동모델은 아동의 대인관계에 대한 지표 역할을 한다.","기질은 행동 또는 반응의 개인차를 설명해 주는 생물학적 기초를 가지고 있다.","주양육자가 아동의 기질을 고려하여 적절하게 양육한다면 아동의 까다로운 기질이 반드시 불안정애착으로 이어지는 것은 아니다."]},{"id":"bk20210814-2","r":"bk20210814","n":2,"s":0,"q":"다음 중 온도나 지능검사의 점수를 측정할 때 사용되는 척도는?","a":2,"o":["명목척도","서열척도","등간척도","비율척도"]},{"id":"bk20210814-3","r":"bk20210814","n":3,"s":0,"q":"기억의 인출과정에 대한 설명으로 틀린 것은?","a":3,"o":["인출이 이후의 기억을 증가시킬 수 있다.","장기기억에서 한 항목을 인출한 것이 이후에 관련된 항목의 회상을 방해할 수 있다.","인출행위가 경험에서 기억하는 것을 변화시킬 수 있다.","기분과 내적 상태는 인출단서가 될 수 없다."]},{"id":"bk20210814-4","r":"bk20210814","n":4,"s":0,"q":"인상형성에 관한 설명으로 틀린 것은?","a":1,"o":["인상형성 시 정보처리를 할 때 최소의 노력으로 빨리 처리하려고 하기 때문에 많은 오류나 편향을 나타내는데, 이러한 현상에서 인간을'인지적 구두쇠'라고 보는 입장도 있다.","내현성격이론은 사람들이 인상형성을 할 때 타인과 관련된 다양한 정보를 통합적이고 객관적으로 평가하는 것을 말한다.","Anderson은 인상형성과 관련하여 가중평균모형을 주장했다.","인상형성 시 긍정적인 정보보다 부정적인 정보가 더 큰 영향을 미치는데, 이를 부정성효과라고 한다."]},{"id":"bk20210814-5","r":"bk20210814","n":5,"s":0,"q":"Freud가 설명한 인간의 3가지 성격 요소 중 현실 원리를 따르는 것은?","a":1,"o":["원초아","자아","초자아","무의식"]},{"id":"bk20210814-6","r":"bk20210814","n":6,"s":0,"q":"성격의 결정요인에 관한 설명으로 틀린 것은?","a":1,"o":["유전적 영향에 대한 증거는 쌍생아 연구에 근거하고 있다.","초기 성격이론가들은 환경적 요인을 강조하여 체형과 기질을 토대로 성격을 분류하였다.","환경적 요인이 성격에 영향을 주는 방식은 학습이론의 맥락에서 이해할 수 있다.","성격은 유전적 요인과 환경적 요인의 상호작용에 의하여 결정된다."]},{"id":"bk20210814-7","r":"bk20210814","n":7,"s":0,"q":"훈련받은 행동이 빨리 습득되고 높은 비율로 오래 유지되는 강화계획은?","a":2,"o":["고정비율계획","고정간격계획","변화비율계획","변화간격계획"]},{"id":"bk20210814-8","r":"bk20210814","n":8,"s":0,"q":"조사연구에서, 참가자의 인지기능을 측정하기 위해 그가 가입한 정당을 묻는 것은 어떤 점에서 가장 문제가 되는가?","a":0,"o":["안면타당도","외적타당도","공인타당도","예언타당도"]},{"id":"bk20210814-9","r":"bk20210814","n":9,"s":0,"q":"단기기억의 특징이 아닌 것은?","a":1,"o":["용량이 제한되어 있다.","절차기억이 저장되어 있다.","정보를 유지하는 시간이 제한되어 있다.","망각의 일차적 원인은 간섭이다."]},{"id":"bk20210814-10","r":"bk20210814","n":10,"s":0,"q":"현상학적 이론에 대한 설명으로 틀린 것은?","a":3,"o":["인간을 성취를 추구하는 존재로 파악한다.","인간을 자신의 환경에 굴복하지 않고 오히려 환경을 통제하고 조정할 수 있는 적극적인 힘을 갖고 있는 존재로 파악한다.","현재 개인이 경험하고, 느끼고, 행동하는 것이 중요하며, 개인의 진정한 모습을 이해하는 것도 이를 통해 가능하다고 본다.","인간은 타고난 욕구에 끌려 다니는 존재로 간주한다."]},{"id":"bk20210814-11","r":"bk20210814","n":11,"s":0,"q":"자신과 타인의 휴대폰 소리를 구별하거나 식용버섯과 독버섯을 구별하는 것은?","a":0,"o":["변 별","일반화","행동조형","차별화"]},{"id":"bk20210814-12","r":"bk20210814","n":12,"s":0,"q":"표본의 크기에 관한 설명으로 틀린 것은?","a":2,"o":["모집단이 동질적일수록 표본 크기는 작아도 된다.","동일한 조건에서 표본의 크기가 클수록 통계적 검증력은 증가한다.","사례수가 작으면 표준오차가 커지므로 작은 크기의 효과를 탐지할 수 있다.","측정도구의 신뢰도가 낮을 경우 대규모 표본을 이용하는 것이 효과적이다."]},{"id":"bk20210814-13","r":"bk20210814","n":13,"s":0,"q":"발달의 일반적 특징으로 틀린 것은?","a":2,"o":["발달은 이전 경험의 누적에 따른 산물이다.","한 개인의 발달은 역사·문화적 맥락의 영향을 받는다.","발달의 각 영역은 상호의존적이기보다는 서로 배타적이다.","대부분의 발달적 변화는 성숙과 학습의 산물이다."]},{"id":"bk20210814-14","r":"bk20210814","n":14,"s":0,"q":"고전적 조건형성에 대한 설명으로 맞는 것은?","a":3,"o":["중립자극은 무조건 자극 직후에 제시되어야 한다.","행동변화의 효과를 거두기 위해서는 적절한 반응의 수나 비율에 따라 강화가 이루어져야 한다.","적절한 행동은 즉시 강화하고, 부적절한 행동은 무시함으로써 새로운 행동을 가르칠 수 있다.","대부분의 정서적인 반응들은 고전적 조건형성을 통해 학습될 수 있다."]},{"id":"bk20210814-15","r":"bk20210814","n":15,"s":0,"q":"정신분석의 방어기제 중 투사에 해당하는 것은?","a":2,"o":["아주 위협적이고 고통스러운 충동이나 기억을 의식에서 추방시키는 것","반대되는 동기를 강하게 표현함으로써 자신의 동기를 숨기는 것","자신이 가진 바람직하지 않은 자질들을 과장하여 다른 사람에게 부여하는 것","불쾌한 현실이 있음을 부정하는 것"]},{"id":"bk20210814-17","r":"bk20210814","n":17,"s":0,"q":"성격심리학의 주요한 모델인 성격 5요인에 대한 설명으로 옳은 것은?","a":1,"o":["5요인에 대한 개인차에서 유전적 요인은 찾아볼 수 없다.","성실성 점수가 높은 사람의 경우 행동을 계획하고 통제하는 것을 돕는 전두엽의 면적이 더 큰 경향이 있다.","뇌의 연결성은 5요인의 특질에 영향을 미치지 않는다.","정서적 불안정성인 신경증은 일생동안 계속해서 증가하고 성실성, 우호성, 개방성과 외향성은 감소한다."]},{"id":"bk20210814-18","r":"bk20210814","n":18,"s":0,"q":"대뇌의 우반구가 손상되었을 때 주로 영향을 받게 될 능력은?","a":2,"o":["통장잔고 점검","말하기","얼굴 재인","논리적 문제해결"]},{"id":"bk20210814-19","r":"bk20210814","n":19,"s":0,"q":"비행기 여행에 두려움을 가지고 있는 환자의 경우, 정신분석적 입장에서 볼 때 이 두려움의 주된 원인으로 가정할 수 있는 것은?","a":0,"o":["두려운 느낌을 갖게 만드는 무의식적 갈등의 전이","어린 시절 사랑하는 부모에게 닥친 비행기 사고의 경험","비행기의 추락 등 비행기 관련 요소들의 통제 불가능성","자율신경계 등 생리적 활동의 이상"]},{"id":"bk20210814-20","r":"bk20210814","n":20,"s":0,"q":"귀인이론에 관한 설명으로 틀린 것은?","a":3,"o":["성공 상황에서 노력 요인으로 귀인할 경우 학습 행동을 동기화할 수 있다.","귀인 성향은 과거 성공, 실패 상황에서의 반복적인 원인 탐색 경험에 의해 형성된다.","귀인의 결과에 따라 자부심, 죄책감, 수치심 등의 정서가 유발되기도 한다.","능력 귀인은 내적, 안정적, 통제 가능한 귀인 유형으로 분류된다."]},{"id":"bk20210814-21","r":"bk20210814","n":21,"s":1,"q":"반사회성 인격장애의 진단기준이 아닌 것은?","a":1,"o":["반사회적 행동은 조현병이나 양극성장애의 경과 중에만 발생되지는 않는다.","10세 이전에 품행장애의 증거가 있어야 한다.","사회적 규범을 지키지 못한다.","충동성과 무계획성을 보인다."]},{"id":"bk20210814-22","r":"bk20210814","n":22,"s":1,"q":"이상행동 및 정신장애의 판별기준과 가장 거리가 먼 것은?","a":2,"o":["적응적 기능의 저하 및 손상","주관적 불편감과 개인의 고통","가족의 불편감과 고통","통계적 규준의 일탈"]},{"id":"bk20210814-23","r":"bk20210814","n":23,"s":1,"q":"알츠하이머병으로 인한 신경인지장애와 주요우울장애의 증상 구분에 관한 설명으로 옳은 것은?","a":0,"o":["알츠하이머병으로 인한 신경인지장애는 기억 손실을 감추려는 시도를 하는 데 반해 주요우울장애에서는 기억 손실을 불평한다.","알츠하이머병으로 인한 신경인지장애는 자기의 무능이나 손상을 과장하는 데 반해 주요우울장애에서는 숨기려 한다.","주요우울장애보다 알츠하이머병으로 인한 신경인지장애에서 알코올 등의 약물남용이 많다.","주요우울장애에서는 증상의 진행이 고른 데 반해 알츠하이머병으로 인한 신경인지장애에서는 몇 주 안에도 진행이 고르지 못하다."]},{"id":"bk20210814-24","r":"bk20210814","n":24,"s":1,"q":"회피성성격장애에서 나타나는 대인관계 특징은?","a":3,"o":["자신의 목적을 달성하기 위해서 타인을 이용한다.","타인에게 과도하게 매달리고 복종적인 경향을 띤다.","친밀한 관계를 바라지도 않으며 타인의 칭찬이나 비판에 무관심해 보인다.","비판이나 거절, 인정받지 못함 등에 대한 두려움이 특징적이다."]},{"id":"bk20210814-25","r":"bk20210814","n":25,"s":1,"q":"다음 중 치매의 원인에 따른 유형으로 볼 수 없는 것은?","a":3,"o":["알츠하이머 질환","혈관성 질환","파킨슨 질환","페닐케톤뇨증"]},{"id":"bk20210814-26","r":"bk20210814","n":26,"s":1,"q":"우울장애에 대한 설명으로 옳지 않은 것은?","a":3,"o":["주요우울장애의 발병은 20대에 최고치를 보인다.","주요우울장애의 유병률은 남자보다 여자에게서 더 높다.","노르에피네프린이나 세로토닌 같은 신경전달물질이 우울장애와 관련된다.","적어도 1년 동안 심하지 않은 우울을 지속적으로 경험할 때 지속성우울장애로 진단한다."]},{"id":"bk20210814-27","r":"bk20210814","n":27,"s":1,"q":"양극성장애에 대한 설명으로 틀린 것은?","a":2,"o":["조증 상태에서는 사고의 비약 등의 사고장애가 나타난다.","우울증 상태에서는 자살을 시도하기도 한다.","조증은 서서히, 우울증은 급격히 나타난다.","조증과 우울증이 반복되는 장애이다."]},{"id":"bk20210814-28","r":"bk20210814","n":28,"s":1,"q":"사람이 스트레스 장면에 처하게 되면 일차적으로 불안해지고 그 장면을 통제할 수 없게 되면 우울해진다고 할 때 이를 설명하는 이론은?","a":0,"o":["학습된 무기력 이론","실존주의 이론","사회문화적 이론","정신분석 이론"]},{"id":"bk20210814-29","r":"bk20210814","n":29,"s":1,"q":"알코올사용장애에 관한 설명으로 틀린 것은?","a":1,"o":["금단 증상은 과도하게 장기간 음주하던 것을 줄이거나 양을 줄인지 4~12시간 정도 후 나타나는 것이 특징이다.","장기간의 알코올 사용에 따르는 비타민 B의 결핍은 극심한 혼란, 작화반응 등을 특징으로 하는 헌팅턴병을 유발할 수 있다.","알코올은 중추신경계에서 다양한 뉴런과 결합하여 개인을 진정시키는 효과를 가져온다.","아시아인들은 알코올을 분해하는 탈수소효소가 부족하여 알코올 섭취시 부정적인 반응이 쉽게 나타난다."]},{"id":"bk20210814-30","r":"bk20210814","n":30,"s":1,"q":"신체증상 및 관련 장애에 관한 설명으로 틀린 것은?","a":3,"o":["전환장애는 스트레스 요인이 동반되지 않는 경우도 있다.","신체증상장애는 일상에 중대한 지장을 일으키는 신체증상이 존재한다.","질병불안장애는 심각한 질병에 걸렸다는 집착이 6개월 이상 지속된다.","허위성장애는 외적 보상이 쉽게 확인된다"]},{"id":"bk20210814-31","r":"bk20210814","n":31,"s":1,"q":"DSM-5의 조현병 진단기준에 해당하지 않는 것은?","a":2,"o":["망상이나 환각 등의 특징적 증상들이 2개 이상 1개월의 기간 동안 상당 시간에 존재한다.","직업, 대인관계 등 주요한 생활영역에서의 기능수준이 발병 전에 비해 현저하게 저하된다.","장애의 지속적 징후가 적어도 3개월 이상 계속된다.","장애가 물질의 생리적 효과나 다른 의학적 상태로 인한 것이 아니다."]},{"id":"bk20210814-32","r":"bk20210814","n":32,"s":1,"q":"성도착장애에 관한 설명으로 틀린 것은?","a":1,"o":["물품음란장애는 여성보다 남성에게서 훨씬 더 많이 나타난다.","동성애를 하위 진단으로 포함한다.","복장도착장애는 강렬한 성적 흥분을 위해 이성의 옷을 입는 것이다.","관음장애는 대부분 15세 이전에 발견되며 지속되는 편이다."]},{"id":"bk20210814-33","r":"bk20210814","n":33,"s":1,"q":"조현병의 양성증상에 포함되지 않는 것은?","a":3,"o":["망상","환각","와해된 언어","둔화된 정서"]},{"id":"bk20210814-36","r":"bk20210814","n":36,"s":1,"q":"품행장애에 대한 설명으로 틀린 것은?","a":3,"o":["발병연령은 일반적으로 7~15세이며, 이 진단을 받은 아동 중 3/4은 소년이다.","주요한 사회적 규범을 위반하고 다른 사람들의 기본적인 권리를 종종 침해한다.","사람이나 동물에 대한 공격적 행동, 절도나 심각한 거짓말 등이 전형적인 행동이다.","청소년기 발병형은 아동기 발병형에 비해 성인기까지 지속되는 경향이 있다."]},{"id":"bk20210814-37","r":"bk20210814","n":37,"s":1,"q":"물질 관련 장애에 포함되지 않는 것은?","a":2,"o":["알코올 중독(Intoxication)","대마계(칸나비스) 사용장애(Use Disorder)","담배 중독(Intoxication)","아편계 금단(Withdrawal)"]},{"id":"bk20210814-38","r":"bk20210814","n":38,"s":1,"q":"지적 장애에 관한 설명으로 옳지 않은 것은?","a":2,"o":["지적 장애 중 가장 많은 비율을 차지하는 것은 경도의 지적 장애이다.","지적 장애를 일으키는 염색체 이상 중 가장 일반적인 것은 다운증후군에 의한 것이다.","최고도의 지적 장애인 경우, 훈련을 해도 걷기, 약간의 말하기, 스스로 먹기 같은 기초기술을 배우거나 나아질 수 없다.","경도의 지적 장애를 가진 아동의 경우, 자기관리는 연령에 적합하게 수행할 수 있다."]},{"id":"bk20210814-39","r":"bk20210814","n":39,"s":1,"q":"배설장애 중 유뇨증에 관한 설명으로 틀린 것은?","a":2,"o":["반복적으로 불수의적으로 잠자리나 옷에 소변을 본다.","유병률은 5세에서 5~10%, 10세에서 3~5%이며, 15세 이상에서는 약 1% 정도이다.","야간 유뇨증은 여성에서 더 흔하다.","야간 유뇨증은 종종 REM 수면 단계 동안 일어난다."]},{"id":"bk20210814-40","r":"bk20210814","n":40,"s":1,"q":"광장공포증에 관한 설명으로 가장 적합한 것은?","a":3,"o":["광장공포증의 남녀 간 발병비율은 비슷한 수준이다.","아동기에 발병률이 가장 높다.","광장공포증이 있으면 공황장애는 진단할 수 없다.","공포, 불안, 회피 반응은 전형적으로 6개월 이상 지속된다."]},{"id":"bk20210814-41","r":"bk20210814","n":41,"s":2,"q":"집-나무-사람(HTP) 검사에 관한 설명으로 맞는 것은?","a":0,"o":["집, 나무, 사람의 순서대로 그리도록 한다.","각 그림마다 시간제한을 두어야 한다.","문맹자에게는 실시할 수 없다.","머레이(H. Murray) 가 개발하였다."]},{"id":"bk20210814-43","r":"bk20210814","n":43,"s":2,"q":"지능의 개념에 관한 연구자와 주장의 연결이 틀린 것은?","a":1,"o":["Wechsler : 지능은 성격과 분리될 수 없다.","Horn : 지능은 독립적인 7개 요인으로 이루어져 있다.","Cattell : 지능은 유동적 지능과 결정화된 지능으로 구분할 수 있다.","Spearman : 지적 능력에는 g요인과 s요인이 존재한다."]},{"id":"bk20210814-44","r":"bk20210814","n":44,"s":2,"q":"선로잇기검사(Trail Making Test)는 대표적으로 어떤 기능 또는 능력을 측정하기 위해 고안된 검사인가?","a":0,"o":["주의력","기억력","언어능력","시공간 처리능력"]},{"id":"bk20210814-45","r":"bk20210814","n":45,"s":2,"q":"로샤(Rorschach) 검사의 엑스너(J. Exner) 종합체계에서 유채색 반응이 아닌 것은?","a":0,"o":["C'","CF","FC","Cn"]},{"id":"bk20210814-46","r":"bk20210814","n":46,"s":2,"q":"WAIS-IV의 소검사 중 언어이해 지수 척도의 보충 소검사에 해당되는 것은?","a":3,"o":["공통성","상식","어휘","이해"]},{"id":"bk20210814-47","r":"bk20210814","n":47,"s":2,"q":"심리검사의 윤리에 관한 설명으로 틀린 것은?","a":3,"o":["자격을 갖춘 사람이 심리검사를 실시해야 한다.","검사동의를 구할 때에는 비밀유지의 한계에 대해 알려야 한다.","동의할 능력이 없는 사람에게도 평가의 본질과 목적을 알려야 한다.","자동화된 서비스를 사용할 경우 검사자는 평가의 해석에 대한 책임을 지지 않는다."]},{"id":"bk20210814-48","r":"bk20210814","n":48,"s":2,"q":"지능에 대한 설명으로 틀린 것은?","a":0,"o":["아동기의 전반적인 인지발달은 청소년기보다 그 속도가 느리다.","발달규준에서는 수검자의 생활연령과 정신연령을 함께 표기한다.","편차 IQ는 집단 내 규준에 속한다.","추적규준은 연령별로 동일한 백분위를 갖는다고 가정한다."]},{"id":"bk20210814-49","r":"bk20210814","n":49,"s":2,"q":"카우프만 아동용지능검사(K-ABC)에 관한 설명으로 틀린 것은?","a":3,"o":["정보처리적인 이론적 관점에서 제작되었다.","성취도를 평가할 수도 있다.","언어적 기술에 덜 의존하므로 언어능력의 문제가 있는 아동에게 적합하다.","아동용 웩슬러지능검사(WISC)와 동일한 연령대의 아동을 대상으로 한다."]},{"id":"bk20210814-50","r":"bk20210814","n":50,"s":2,"q":"MMPI 제작 방식에 관한 설명으로 옳은 것은?","a":2,"o":["정신병리 이론을 바탕으로 하여 제작되었다.","합리적·이론적 방식을 결합하여 제작되었다.","정신장애군과 정상군을 변별하는 통계적 결과에 따라 경험적 방식으로 제작되었다.","인성과 정신병리와의 상관성에 대한 선행연구 결과들을 바탕으로 하여 제작되었다."]},{"id":"bk20210814-51","r":"bk20210814","n":51,"s":2,"q":"표준점수에 관한 설명으로 틀린 것은?","a":3,"o":["대표적인 표준점수로는 Z점수가 있다.","표준점수는 원점수를 직선변환하여 얻는다.","웩슬러지능검사의 IQ 수치도 일종의 표준점수이다.","Z점수가 0이라는 것은, 그 사례가 해당 집단의 평균치보다 1 표준편차 위에 있다는 것을 의미한다."]},{"id":"bk20210814-52","r":"bk20210814","n":52,"s":2,"q":"노년기 인지발달에 관한 설명으로 옳은 것은?","a":2,"o":["정보처리 속도가 크게 증가한다.","결정지능의 감퇴가 유동지능보다 현저해진다.","인지발달의 변화양상에서 개인차가 더 커지게 된다.","의미기억이 일화기억보다 더 많이 쇠퇴한다."]},{"id":"bk20210814-53","r":"bk20210814","n":53,"s":2,"q":"성격검사에 관한 설명으로 틀린 것은?","a":3,"o":["MMPI는 만15세 수
