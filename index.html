20210814","n":85,"s":4,"q":"Beck의 인지적 왜곡 중 개인화에 대한 예로 적절한 것은?","a":0,"o":["“관계가 끝나버린 건 모두 내 잘못이야.”","“이 직업을 구하지 못하면, 다시는 일하지 못할거야.”","“나는 정말 멍청해.”","“너무 불안하니까, 고속도로를 달리는 것은 위험할거야.”"]},{"id":"bk20210814-86","r":"bk20210814","n":86,"s":4,"q":"Gottfredson의 직업포부 발달이론에서 직업과 관련된 개인발달의 단계에 해당하지 않는 것은?","a":2,"o":["힘과 크기 지향성","성역할 지향성","개인선호 지향성","내적 고유한 자아 지향성"]},{"id":"bk20210814-87","r":"bk20210814","n":87,"s":4,"q":"내담자에게 바람직한 목표행동을 설정해두고, 그 행동에 근접하는 행동을 보일 때 단계적으로 차별강화를 주어 바람직한 행동에 접근해가도록 만드는 치료기법은?","a":1,"o":["역할연기","행동조형(조성)","체계적 둔감화","재구조화"]},{"id":"bk20210814-88","r":"bk20210814","n":88,"s":4,"q":"임상적인 상황에서 활용되는 최면에 관한 가정과 가장 거리가 먼 것은?","a":0,"o":["최면상태는 자연스러운 것이나 치료자에 의해 형식을 갖춘 최면유도로만 일어날 수 있다.","모든 최면은 자기최면이라 할 수 있다.","각 개인은 치료와 자기실현에 필요한 자원을 담고 있는 무의식을 소유하고 있다.","내담자는 무의식 탐구로 알려진 일련의 과정을 진행시킬 수 있다."]},{"id":"bk20210814-89","r":"bk20210814","n":89,"s":4,"q":"가족치료의 주된 목표와 가장 거리가 먼 것은?","a":2,"o":["가계의 특징을 파악하고 이를 재구조화한다.","가족구성원 간의 잘못된 관계를 바로잡는다.","특정 가족구성원의 문제행동을 수정한다.","가족구성원 간의 의사소통 유형을 파악하고 의사소통이 잘 되도록 한다."]},{"id":"bk20210814-91","r":"bk20210814","n":91,"s":4,"q":"중학교 교사인 상담자가 학생을 상담하는 과정에서 구조화를 하는 방법으로 틀린 것은?","a":3,"o":["상담자와 내담자는 상담관계 이외에 사제관계를 맺고 있으므로 이런 이중적인 관계로 인해 예상되는 문제나 어려움을 사전에 논의한다.","상담에 대해 현실적으로 기대할 수 있는 바가 무엇인지. 기대의 실현을 위해 상담자와 내담자가 각각 해야 할 역할이 무엇인지에 대해 설명한다.","정규적인 상담을 할 계획이라면 상담자와 내담자가 만나는 요일이나 시간을 정하고, 한번 만나면 매회 면접시간의 길이와 전체 상담과정의 길이나 횟수에 대해서도 알려준다.","상담내용에 대한 비밀보장의 원칙을 내담자에게 알려주고, 비밀보장의 한계에 대한 정보는 내담자의 솔직한 자기개방을 저해할 수 있으므로 상담관계의 신뢰성이 충분히 형성된 이후에 알려주는 것이 좋다."]},{"id":"bk20210814-92","r":"bk20210814","n":92,"s":4,"q":"청소년기 자살의 위험인자와 가장 거리가 먼 것은?","a":2,"o":["공격적이고 약물남용 병력이 있으며 충동성이 높은 행동장애의 경우","성적이 급락하고 식습관 및 수면행동의 변화가 심한 경우","습관적으로 부모에 대한 반항이나 저항을 보이는 경우","동료나 가족 등 가까운 이들과 떨어져 지내는 회피행동이 증가한 경우"]},{"id":"bk20210814-94","r":"bk20210814","n":94,"s":4,"q":"특성-요인 상담에 관한 설명으로 틀린 것은?","a":2,"o":["상담자 중심의 상담방법이다.","사례연구를 상담의 중요한 자료로 삼는다.","문제의 객관적 이해보다는 내담자에 대한 정서적 이해에 초점을 둔다.","내담자에게 정보를 제공하고 학습기술과 사회적 적응기술을 알려 주는 것을 중요시한다"]},{"id":"bk20210814-95","r":"bk20210814","n":95,"s":4,"q":"학습상담 과정에 대한 설명과 가장 거리가 먼 것은?","a":3,"o":["현실성 있는 상담목표를 설정해서 상담한다.","학습문제와 관련된 내담자의 감정을 이해하고 격려한다.","내담자의 장점, 자원 등을 학습상담과정에 적절히 활용한다.","학습문제와 무관한 개인의 심리적 문제들은 회피하도록 한다"]},{"id":"bk20210814-97","r":"bk20210814","n":97,"s":4,"q":"성상담을 할 때 상담자가 가져야 할 시행지침으로 옳은 것은?","a":3,"o":["성과 관련된 개인적 사고는 다루지 않는다.","내담자의 죄책감과 수치심은 다루지 않는다.","성폭력은 낯선 사람에 의해서만 발생함을 감안한다.","성폭력은 성적 자기결정권의 침해임을 감안한다."]},{"id":"bk20210814-98","r":"bk20210814","n":98,"s":4,"q":"상담 시 내담자에게 관심을 집중시키는 기술과 가장 거리가 먼 것은?","a":3,"o":["개방적인 몸자세를 취한다.","내담자를 향해서 편안한 자세로 앉는다.","내담자를 지나치게 응시하지 않는다.","내담자에게 잘 듣고 있다고 항상 말로 확인해준다."]},{"id":"bk20210814-100","r":"bk20210814","n":100,"s":4,"q":"심리치료의 발전사에 관한 설명으로 옳지 않은 것은?","a":3,"o":["인지심리학의 발전과 더불어 개발된 치료방법들은 1960~70년대 행동치료와 접목되면서 인지행동치료로 발전하였다.","로저스(Rogers)는 정신분석치료의 대안으로 인간중심치료를 제시하면서 자신의 치료활동을 카운슬링(Counseling)으로 지칭하였다.","윌버(Wilber)는 자아초월 심리학의 이론체계를 발전시켰으며 그의 이론에 근거한 통합적 심리치료를 제시하였다.","제임스(James)는 펜실베니아 대학교에 최초의 심리클리닉을 설립하여 학습장애와 행동장애 아동을 대상으로 치료활동을 시작하였다."]},{"id":"bk20220305-1","r":"bk20220305","n":1,"s":0,"q":"임상심리학 연구방법 중 내담자와의 면접을 통해 증상과 경과를 체계적으로 연구하는 방법은?","a":2,"o":["실험연구","상관연구","사례연구","혼합연구"]},{"id":"bk20220305-2","r":"bk20220305","n":2,"s":0,"q":"성격이론과 대표적인 연구자가 잘못 짝지어진 것은?(오류 신고가 접수된 문제입니다. 반드시 정답과 해설을 확인하시기 바랍니다.)","a":1,"o":["정신분석이론 - 프로이드(Freud)","행동주의이론 - 로저스(Rogers)","인본주의이론 - 매슬로우(Maslow)","특질이론 - 올포트(Allport)"]},{"id":"bk20220305-3","r":"bk20220305","n":3,"s":0,"q":"기억 연구에서 집단이 회상한 수가 집단구성원 각각 회상한 수의 합보다 적은 것을 의미하는 것은?","a":3,"o":["책임감 분산","청크효과","스트룹효과","협력 억제"]},{"id":"bk20220305-4","r":"bk20220305","n":4,"s":0,"q":"여러 상이한 연령에 속하는 사람들로부터 동시에 어떤 특성에 대한 자료를 얻고, 그 결과를 연령 간 비교하여 발달적 변화과정을 추론하는 연구방법은?","a":1,"o":["종단적 연구방법","횡단적 연구방법","교차비교 연구방법","단기종단적 연구방법"]},{"id":"bk20220305-5","r":"bk20220305","n":5,"s":0,"q":"단순 공포증이 유사한 대상에게 확대되는 현상을 설명하는 학습원리는?","a":1,"o":["변별조건형성","자극 일반화","자발적 회복","소거"]},{"id":"bk20220305-6","r":"bk20220305","n":6,"s":0,"q":"실험장면에서 실험자가 조작하는 처치변인은?","a":0,"o":["독립변인","종속변인","조절변인","매개변인"]},{"id":"bk20220305-7","r":"bk20220305","n":7,"s":0,"q":"프로이드의 성격의 구조에 대한 설명으로 틀린 것은?","a":1,"o":["이드는 쾌락원칙을 따른다.","초자아는 항문기의 배변훈련 과정을 겪으면서 발달한다.","성격의 구조 가운데 가장 마지막으로 발달하는 체계가 초자아이다.","자아는 성격의 집행자로서, 인지능력에 포함된다."]},{"id":"bk20220305-8","r":"bk20220305","n":8,"s":0,"q":"Cattell의 성격이론에 관한 설명과 가장 거리가 먼 것은?","a":3,"o":["주로 요인분석을 사용하여 성격요인을 규명하였다.","지능을 성격의 한 요인인 능력특질로 보았다.","개인의 특정 행동을 설명할 수 있느냐에 따라 특질을 표면특질과 근원특질로 구분하였다.","성격특질이 서열적으로 조직화되어 있다고 보았다."]},{"id":"bk20220305-9","r":"bk20220305","n":9,"s":0,"q":"성격을 정의할 때 고려하는 특징으로 가장 거리가 먼 것은?","a":3,"o":["시간적 일관성","환경에 대한 적응성","개인의 독특성","개인의 자율성"]},{"id":"bk20220305-10","r":"bk20220305","n":10,"s":0,"q":"인지학습이론에 대한 설명으로 틀린 것은?","a":0,"o":["형태주의는 공간적인 관계보다는 시간변인에 주로 관심을 갖는다.","Tolman은 강화가 무슨 행동을 하면 어떤 결과가 일어날 것이란 기대를 확인시켜 준다고 보았다.","통찰은 해결 전에서 해결로 갑자기 일어나며 대개 ‘아하’ 경험을 하게 된다.","인지도는 학습에서 내적 표상이 중요함을 보여준다."]},{"id":"bk20220305-11","r":"bk20220305","n":11,"s":0,"q":"에릭슨의 심리사회적 발달이론에서 노년기에 맞는 위기는?","a":3,"o":["고립감","열등감","단절감","절망감"]},{"id":"bk20220305-12","r":"bk20220305","n":12,"s":0,"q":"고전적 조건형성에 관한 설명으로 옳은 것은?","a":0,"o":["대부분의 정서적인 반응들은 고전적 조건형성을 통해 학습될 수 있다.","중립자극은 무조건 자극 직후에 제시되어야 한다.","행동변화의 효과를 거두기 위해서는 적절한 반응의 수나 비율에 따라 강화가 이루어져야 한다.","모든 자극에 대한 모든 반응은 연쇄(chaining)를 사용하여 조건형성을 할 수 있다."]},{"id":"bk20220305-13","r":"bk20220305","n":13,"s":0,"q":"자신의 행동을 통해서 태도를 확인하고 이해하는 과정을 설명하는 이론은?","a":1,"o":["인지부조화이론","자기지각이론","자기고양편파이론","자기정체성이론"]},{"id":"bk20220305-14","r":"bk20220305","n":14,"s":0,"q":"집단사고가 일어나는 상황과 가장 거리가 먼 것은?","a":2,"o":["집단의 응집력이 높은 경우","집단이 외부 영향으로부터 고립된 경우","집단의 리더가 민주적인 경우","실행 가능한 대안이 부족하여 집단의 스트레스가 높은 경우"]},{"id":"bk20220305-15","r":"bk20220305","n":15,"s":0,"q":"어떤 사람의 행동을 보고 상황이나 외적 요인보다는 사람의 기질이나 내적 요인에 그 원인을 두려고 하는 것은?","a":3,"o":["고정관념","현실적 왜곡","후광효과","기본적 귀인오류"]},{"id":"bk20220305-16","r":"bk20220305","n":16,"s":0,"q":"의미망 모형에 관한 설명으로 틀린 것은?","a":2,"o":["많은 정보들은 의미망으로 조직화할 수 있고 의미망은 노드(node)와 통로(pathway)로 구성되어 있다.","모형의 가정을 어휘결정 과제로 검증할 수 있다.","버터가 단어인지를 판단하는데 걸리는 시간은 간호사보다 빵이라는 단어가 먼저 제시되었을 때 더 느리다.","활성화 확산 과정으로 설명할 수 있다."]},{"id":"bk20220305-17","r":"bk20220305","n":17,"s":0,"q":"동조에 관한 설명으로 옳은 것은?","a":2,"o":["집단의 크기에 비례하여 동조의 가능성이 증가한다.","과제가 쉬울수록 동조가 많이 일어난다.","개인이 집단에 매력을 느낄수록 동조하는 경향이 더 높다.","집단에 의해서 완전하게 수용 받고 있다고 느낄수록 동조하는 경향이 더 크다."]},{"id":"bk20220305-18","r":"bk20220305","n":18,"s":0,"q":"연구설계 시 내적 타당도를 위협하는 요인이 아닌 것은?","a":2,"o":["평균으로의 회귀","측정도구의 변화","피험자의 반응성","피험자의 학습효과"]},{"id":"bk20220305-19","r":"bk20220305","n":19,"s":0,"q":"기억에 관한 설명 중 옳지 않은 것은?","a":2,"o":["기억의 세 단계는 부호화, 저장, 인출이다.","감각기억은 매우 큰 용량을 가지고 있지만 순식간에 소멸한다.","외현기억은 무의식적이며, 암묵기억은 의식적이다.","부호화와 인출을 증진시키는 한 가지 방법은 심상을 사용하는 것이다."]},{"id":"bk20220305-20","r":"bk20220305","n":20,"s":0,"q":"비율척도에 해당하는 것은?","a":1,"o":["성별","길이","온도","석차"]},{"id":"bk20220305-21","r":"bk20220305","n":21,"s":1,"q":"DSM-5에서 알코올사용장애 진단기준에 관한 설명으로 옳은 것은?","a":0,"o":["증상의 갯수로 알코올사용장애 심각도를 분류한다.","알코올로 인한 법적문제가 진단기준에 포함된다.","교차중독 현상이 진단기준에 포함된다.","음주량과 음주횟수가 진단기준에 포함된다."]},{"id":"bk20220305-22","r":"bk20220305","n":22,"s":1,"q":"여성의 알코올 중독에 관한 설명으로 옳은 것은?","a":2,"o":["알코올 중독의 남녀 비율은 비슷한 수준이다.","여성은 유전적으로 남성보다 알코올 중독의 가능성이 더 높다.","여성 알코올 중독자들은 남성 알코올 중독자들보다 우울을 더 많이 경험하고 자살시도 횟수가 더 많다.","여성은 남성보다 체지방이 많기 때문에 술의 효과가 늦게 나타나고 대사가 빠르다."]},{"id":"bk20220305-23","r":"bk20220305","n":23,"s":1,"q":"지속성 우울장애(기분저하증)의 진단기준에 관한 설명으로 틀린 것은?","a":1,"o":["우울 기간 동안 자존감 저하, 절망감 등의 2가지 증상이 나타난다.","순환성장애의 진단기준을 충족해야 한다.","조증 삽화, 경조증 삽화가 없어야 한다.","청소년에서는 기분이 과민한 상태로 나타나기도 한다."]},{"id":"bk20220305-24","r":"bk20220305","n":24,"s":1,"q":"이상심리의 이론적 모형에 관한 설명으로 틀린 것은?","a":2,"o":["양극성 장애와 조현병은 유전을 비롯한 생물학적 요인에 영향을 받는다.","행동주의자들은 부적응 행동이 학습의 원리에 따라 형성된다고 제안하였다.","실존주의자들은 정신장애가 뇌의 생화학적 이상에 의해서 유발된다고 본다.","인지이론가들은 비합리적 신념과 역기능적 사고가 이상 행동에 영향을 준다고 본다."]},{"id":"bk20220305-25","r":"bk20220305","n":25,"s":1,"q":"조현병 스펙트럼 및 기타 정신병적 장애에 해당하지 않는 것은?","a":0,"o":["순환성장애","조현양상장애","조현정동장애","단기 정신병적 장애"]},{"id":"bk20220305-26","r":"bk20220305","n":26,"s":1,"q":"사회불안장애에 대한 설명으로 가장 적합한 것은?","a":0,"o":["공포스러운 사회적 상황이나 활동상황에 대한 회피, 예기 불안으로 일상생활, 직업 및 사회적 활동에 영향을 받는다.","특정 뱀이나 공원, 동물, 주사 등에 공포스러워 한다.","터널이나 다리에 대해 공포반응이 일어나는 경우이다.","생리학적으로 부교감신경계의 활성 등의 생리적 반응에서 기인한다."]},{"id":"bk20220305-27","r":"bk20220305","n":27,"s":1,"q":"신경발달장애에 관한 설명으로 틀린 것은?","a":0,"o":["투렛장애 진단 시 운동성 틱과 음성 틱은 항상 동시에 나타나야 한다.","생의 초기부터 나타나는 유아기 및 아동기장애와 관련이 있다.","비유창성이 청소년기 이후에 시작되면 성인기-발병 유창성 장애로 진단한다.","상동증적 운동장애는 특정 패턴의 행동을 목적 없이 반복하여 부적응적 문제가 초래된다."]},{"id":"bk20220305-28","r":"bk20220305","n":28,"s":1,"q":"Bleuler가 제시한 조현병(정신분열병)의 4가지 근본증상, 즉 4A에 해당하지 않는 것은?","a":3,"o":["감정의 둔마(affective blunting)","자폐증(autism)","양가감정(ambivalence)","무논리증(alogia)"]},{"id":"bk20220305-29","r":"bk20220305","n":29,"s":1,"q":"주의력 결핍 및 과잉행동장애(ADHD)에 관한 설명으로 틀린 것은?","a":1,"o":["학령전기에 보이는 주요 증상은 과잉행동이다.","앉아 있도록 요구되는 상황에서 자리를 떠나는 것은 부주의 증상에 해당된다.","증상이 지속되면 적대적 반항장애로 동반이환할 가능성이 높다.","여성보다 남성에게 더 흔하게 나타난다."]},{"id":"bk20220305-31","r":"bk20220305","n":31,"s":1,"q":"주요 신경인지장애에 관한 설명으로 옳은 것은?","a":3,"o":["인지 기능의 저하 여부는 병전 수행 수준을 기준으로 삼지 않는다.","가족력이나 유전자 검사에서 원인이 되는 유전적 돌연변이의 증거가 있어야 한다.","기억 기능의 저하가 항상 나타난다.","알츠하이머병으로 인한 경우는 서서히 시작되고 점진적으로 진행된다."]},{"id":"bk20220305-32","r":"bk20220305","n":32,"s":1,"q":"분리불안장애에 관한 설명으로 틀린 것은?","a":3,"o":["행동치료, 놀이치료, 가족치료 등을 통하여 호전될 수 있다.","부모의 양육행동, 아동의 유전적 기질, 인지행동적 요인 등이 영향을 미친다.","학령기 아동에서는 학교에 가기 싫어하거나 등교 거부로 나타난다.","성인의 경우 증상이 1개월 이상 나타날 때 진단될 수 있다."]},{"id":"bk20220305-33","r":"bk20220305","n":33,"s":1,"q":"B군 성격장애에 해당하지 않는 것은?","a":1,"o":["경계성 성격장애","강박성 성격장애","반사회성 성격장애","연극성 성격장애"]},{"id":"bk20220305-34","r":"bk20220305","n":34,"s":1,"q":"다음 장애 중 성기능부전에 포함되지 않는 것은?","a":2,"o":["사정지연","발기장애","마찰도착장애","여성극치감장애"]},{"id":"bk20220305-36","r":"bk20220305","n":36,"s":1,"q":"전환장애에 관한 설명으로 틀린 것은?","a":2,"o":["전환장애 진단을 위해서는 증상이 신경학적 질병으로 설명되지 않아야 한다.","전환증상은 다양하지만 특히 흔한 것은 보이지 않음, 들리지 않음, 마비, 무감각증 등이다.","전환증상은 의학적 증거로 설명되지는 않고 있으며 환자들이 일시적인 어려움을 피하기 위하여 의도적으로 꾸며낸 것이다.","전환증상은 내적 갈등의 자각을 차단하는 일차 이득이 있고, 책임감으로부터 구제해주고 동정과 관심을 끌어내는 이차 이득이 있다."]},{"id":"bk20220305-37","r":"bk20220305","n":37,"s":1,"q":"변태성욕장애에 해당하지 않는 것은?","a  하면 일단 수용해준다."]},{"id":"bk20220305-91","r":"bk20220305","n":91,"s":4,"q":"학업상담에 있어 지능에 관한 설명으로 틀린 것은?","a":0,"o":["지능에 대한 학습자의 주관적인 인식은 학습 태도와 관련이 없다.","지능지수는 같은 연령대 학생들 간의 상대적 위치를 의미한다.","지능검사는 스탠퍼드-비네 검사, 웩슬러검사, 카우프만 검사 등이 있다.","지능점수를 통해 학생의 인지적 강점 및 약점을 파악할 수 있다."]},{"id":"bk20220305-92","r":"bk20220305","n":92,"s":4,"q":"상담 초기 단계에서 사용하기에 가장 적합한 기법은?","a":0,"o":["경청","자기개방","피드백","감정의 반영"]},{"id":"bk20220305-93","r":"bk20220305","n":93,"s":4,"q":"생애기술 상담이론에서 기술언어(skills language)에 해당하는 것은?","a":3,"o":["내담자가 어떻게 생각하고 느끼는가를 의미하는 것이다.","내담자가 어떤 외현적 행동을 하는가를 의미하는 것이다.","내담자 자신의 책임감 있는 삶을 의미하는 것이다.","내담자의 행동을 설명하고 분석하기 위해 사용하는 것을 의미하는 것이다."]},{"id":"bk20220305-94","r":"bk20220305","n":94,"s":4,"q":"알코올중독 가정의 성인아이(Adult Child)에 관한 특성이 아닌 것은?","a":1,"o":["처음부터 끝까지 일을 완수하는데 어려움이 있다.","권위 있는 사람에게 친밀감을 느낀다.","지속적으로 타인의 인정과 확인을 받고 싶어 한다.","자신을 평가절하 한다."]},{"id":"bk20220305-95","r":"bk20220305","n":95,"s":4,"q":"병적 도박에 관한 설명으로 틀린 것은?","a":2,"o":["대개 돈의 액수가 커질수록 더 흥분감을 느끼며 흥분감을 느끼기 위해 액수를 더 늘린다.","도박행동을 그만두거나 줄이려고 시도할 때 안절부절 못하거나 신경이 과민해진다.","병적 도박은 DSM-5에서 반사회성 성격장애로 분류된다.","병적 도박은 전형적으로 남자는 초기 청소년기에, 여자는 인생의 후기에 시작되는 경우가 많다."]},{"id":"bk20220305-96","r":"bk20220305","n":96,"s":4,"q":"집단상담에서 침묵 상황에 대한 효과적 개입으로 틀린 것은?","a":3,"o":["회기 초기에 오랜 침묵을 허용하는 것은 지도력 발휘가 안된 것이다.","생산적으로 여겨지는 침묵 상황에서 말하려는 집단원에게 기다리라고 제지할 수 있다.","말하고 싶으나 기회를 잡지 못하는 집단원에게 말할 기회를 준다.","대리학습이나 경험이 되므로 침묵하는 집단원이 집단 내내 말하지 않더라도 그대로 놔둔다."]},{"id":"bk20220305-97","r":"bk20220305","n":97,"s":4,"q":"자살로 인해 가까운 사람을 잃은 자살 생존자에 관한 설명으로 틀린 것은?","a":2,"o":["분노는 자살생존자가 겪는 흔한 감정 중 하나이다.","자살생존자는 스스로를 비난하기 때문에 고통 받는다.","자살생존자에게 상실에 대한 경험을 이야기하게 하는 것은 과거의 상황을 재경험하게 하므로 피하는 것이 좋다.","자살생존자는 종종 자살에 관한 사회문화적 낙인에 대처하는 데 부담감을 느끼게 된다."]},{"id":"bk20220305-98","r":"bk20220305","n":98,"s":4,"q":"인간중심상담 이론에 관한 설명으로 틀린 것은?","a":1,"o":["가치의 조건화는 주요 타자로부터 긍정적 존중을 받기 위해 그들이 원하는 가치와 기준을 내면화하는 것이다.","자아는 성격의 조화와 통합을 위해 노력하는 원형이다.","현재 경험이 자기개념과 불일치할 때 불안을 경험하게 된다.","실현화 경향성은 자기를 보전, 유지하고 향상시키고자 하는 선천적 성향이다."]},{"id":"bk20220305-99","r":"bk20220305","n":99,"s":4,"q":"행동주의 상담의 한계에 관한 설명으로 틀린 것은?","a":3,"o":["상담과정에서 감정과 정서의 역할을 강조하지 않는다.","내담자의 문제에 대한 통찰이나 심오한 이해가 불가능하다.","고차원적 기능과 창조성, 자율성을 무시한다.","상담자와 내담자의 관계를 중시하여 기술을 지나치게 강조한다."]},{"id":"bk20220305-100","r":"bk20220305","n":100,"s":4,"q":"키츠너(Kitchener)가 제시한 상담의 기본적 윤리원칙 중 상담자가 내담자와 맺은 약속을 잘 지키며 믿음과 신뢰를 주는 행동을 하는 것은?","a":2,"o":["자율성(autonomy)","무해성(nonmaleficence)","충실성(fidelity)","공정성(justice)"]}]}</script>

h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.c1{--c:var(--s1)}.c2{--c:var(--s2)}.c3{--c:var(--s3)}.c4{--c:var(--s4)}.c5{--c:var(--s5)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:19px;padding-block:10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--omr);font-weight:400}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
nav a{padding:12px 11px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav a[aria-current]{color:var(--ink);border-color:var(--omr);font-weight:700}
main{max-width:1040px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 15px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--omr);color:var(--on-omr);border-color:var(--omr)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.h2{font-family:var(--display);font-size:22px;font-weight:400}
.h3{font-size:16px;font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--c,var(--muted));border:1px solid currentColor;border-radius:99px;padding:1px 9px;white-space:nowrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 13px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 홈 */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:stretch}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,38px)}
.hero h1 span{color:var(--omr)}
.hero p{margin:8px 0 16px;color:var(--muted);max-width:34em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.way{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;border-top:4px solid var(--c)}
.way:hover{border-color:var(--c)}
.way b{font-family:var(--display);font-weight:400;font-size:18px}
.way span{font-size:13px;color:var(--muted)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.info dt{color:var(--muted)}.info dd{margin:0;font-weight:500}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist th,.hist td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* 시험 선택 */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--omr));border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.pick:hover{border-color:var(--c,var(--omr))}
.pick b{font-size:16px}.pick span{font-size:13px;color:var(--muted)}

/* 시험 진행 */
.runbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.runbar .t{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--omr);min-width:76px}
.runbar .sp{flex:1}
.run{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;border-top:5px solid var(--c);min-width:0}
.qcard .qt{font-size:17px;font-weight:700;margin:10px 0 14px;display:flex;gap:8px}
.qcard .qt i{font-family:var(--display);font-style:normal;color:var(--c);font-size:20px;line-height:1.35;flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.opt .b{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1}
.opt:hover:not([disabled]){border-color:var(--omr)}
.opt.sel{border-color:var(--omr);background:var(--omr-soft)}
.opt.sel .b{background:var(--omr);color:var(--on-omr)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default;color:inherit}
.exp{margin-top:14px;background:var(--sunk);border-radius:10px;padding:11px 14px;font-size:14px}
.exp b.v{font-weight:900}.exp .okc{color:var(--ok)}.exp .badc{color:var(--bad)}
.qnav{margin-top:16px;justify-content:space-between}
.omr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 130px);overflow:auto}
.omr h3{font-size:13px;color:var(--muted);font-weight:500;margin:10px 0 6px}.omr h3:first-child{margin-top:0}
.bub{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:5px}
.bub button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;padding:0;color:var(--muted)}
.bub button.a{background:var(--omr);border-color:var(--omr);color:var(--on-omr);font-weight:700}
.bub button.f{border-color:var(--mn-line);box-shadow:0 0 0 2px var(--mn-bg)}
.bub button.cur{outline:2px solid var(--ink);outline-offset:1px}
.bub button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bub button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--mn-bg);border:1px dashed var(--mn-line);color:var(--mn-ink);border-radius:10px;padding:12px 14px}

/* 결과 */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score .big{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--muted)}
.stamp{display:inline-block;font-family:var(--display);font-size:22px;border:3px solid currentColor;border-radius:8px;padding:2px 14px;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok)}.stamp.bad{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:86px 1fr 74px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:6px}
.bar .tr::after{content:"";position:absolute;left:40%;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.45}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rev{display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:13px 15px}
.ritem.x{border-left-color:var(--bad)}
.ritem .q{font-weight:700;margin-bottom:6px}
.ritem ol{margin:0 0 8px;padding:0;list-style:none;font-size:14px}
.ritem li.ans{color:var(--ok);font-weight:700}.ritem li.mine{color:var(--bad);text-decoration:line-through}
.ritem .e{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 11px}

/* 암기노트 */
.secs{display:flex;gap:6px;flex-wrap:wrap}
.secs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.secs button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface);font-weight:700}
.sechead{border-left:6px solid var(--c);padding-left:12px}
.sechead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cards{columns:2;column-gap:14px}
.ncard{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:11px;padding:13px 14px;margin:0 0 14px}
.ncard h3{font-family:var(--display);font-weight:400;font-size:17px;margin-bottom:6px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who .face{width:48px;height:53px;flex:none}
.who b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--c);display:block;line-height:1.2}
.who span{font-size:13px;color:var(--muted)}
.mn{background:var(--mn-bg);border:1.5px dashed var(--mn-line);border-radius:9px;padding:7px 11px;margin:4px 0 8px;display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap}
.mn .k{font-family:var(--display);font-size:21px;color:var(--hl);line-height:1.25}
.mn .s{font-size:13px;color:var(--mn-ink);min-width:0}.mn .s b{color:var(--hl);font-weight:900}
.ncard ul{list-style:none;margin:0;padding:0;font-size:14px}
.ncard li{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
.ncard li:last-child{border:0}
.ncard li>b{font-weight:700}
.ncard em{font-style:normal;color:var(--hl);font-weight:900;background:var(--hl-bg);border-radius:3px;padding:0 2px}
.ncard u{text-decoration:underline;text-decoration-color:var(--s1);text-underline-offset:3px}
.ncard table{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
.ncard th,.ncard td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
.ncard th{background:var(--sunk);font-weight:700}
.ncard td small{color:var(--muted)}
.quote{border-left:3px solid var(--c);background:var(--sunk);padding:6px 10px;margin:4px 0 8px;font-size:14px}
.tip{margin-top:8px;background:var(--sunk);border-radius:7px;padding:5px 9px;font-size:13px}
.tip::before{content:"함께 외우기 ";font-weight:700;color:var(--c)}
.kn{margin-top:9px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.kn input{width:16px;height:16px;accent-color:var(--ok)}
.hiding .ncard li>span,.hiding .ncard td,.hiding .mn .s{filter:blur(6px);cursor:pointer;user-select:none}
.hiding .ncard .rv li>span,.hiding .ncard .rv td,.hiding .mn.rv .s,.hiding .ncard li.rv>span{filter:none}

/* 플래시카드 */
.fc{max-width:620px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.fcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:26px 22px;text-align:center;min-height:230px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.fcard .k{font-family:var(--display);font-size:clamp(28px,7vw,42px);color:var(--hl);line-height:1.25}
.fcard .ncard{border:0;padding:0;margin:0;text-align:left;background:none}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}

.empty{text-align:center;color:var(--muted);padding:34px 10px}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){
  .hero,.info{grid-template-columns:1fr}.ways{grid-template-columns:1fr 1fr}.picks{grid-template-columns:1fr 1fr}
  .run{grid-template-columns:1fr}.omr{position:static;max-height:none}.cards{columns:1}
  .runbar{top:calc(env(safe-area-inset-top,0px) + 88px)}
  nav{flex-basis:100%;margin-top:-6px}.brand{padding-bottom:0}nav a{padding:9px 10px}
}
@media (max-width:460px){.picks{grid-template-columns:1fr}.score{grid-template-columns:1fr}.bar{grid-template-columns:70px 1fr 64px}.ncard li{grid-template-columns:1fr;gap:0}.ncard li>span{color:var(--muted)}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.way,.pick{transition:border-color .12s,background .12s}}
.qimgnote{font-size:13px;color:var(--muted)}
.ncard [data-k]{cursor:pointer}
.ncard li[data-k]:hover,.ncard tr[data-k]:hover td,.who[data-k]:hover,.ncard h3[data-k]:hover{background:var(--sunk)}
.ncard h3[data-k]::after,.who[data-k] b::after{content:" ›";color:var(--muted);font-family:var(--body);font-size:14px}
.hiding .ncard [data-k]:hover{background:none}
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(10,14,24,.55);display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px}
.sheet .lead{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.sheet .lead em{font-style:normal;color:var(--hl);font-weight:900}
.gl{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--omr);border-radius:10px;padding:13px 15px}
.gl p{margin:0 0 10px}.gl p:last-child{margin:0}
.gl .pt{background:var(--mn-bg);color:var(--mn-ink);border-radius:8px;padding:8px 11px;font-size:14px}
.gl .pt b{color:var(--hl)}
.sheet .ritem{font-size:14px}
</style>

<script>
const D = {"subj":["심리학개론","이상심리학","심리검사","임상심리학","심리상담"],"q":[{"n":1,"s":0,"q":"피아제의 인지발달 단계에서 “대상영속성”을 획득하는 시기는?","o":["전조작기","감각운동기","구체적 조작기","형식적 조작기"],"a":1,"e":"눈앞에서 사라져도 대상이 계속 존재함을 아는 능력 → 감각운동기(0~2세). 단계 순서 “감전구형”."},{"n":2,"s":0,"q":"피아제 이론에서 보존개념, 가역성, 서열화가 가능해지는 단계는?","o":["감각운동기","전조작기","형식적 조작기","구체적 조작기"],"a":3,"e":"구체적 조작기(7~11세): 보존·가역성·서열화·유목화. 전조작기는 자기중심성·물활론."},{"n":3,"s":0,"q":"에릭슨의 심리사회적 발달단계 중 청소년기의 발달 과업(위기)은?","o":["근면성 대 열등감","친밀감 대 고립감","주도성 대 죄책감","정체감 대 역할혼미"],"a":3,"e":"“신자주근 정친생통” 중 다섯 번째 = 정체감(청소년기)."},{"n":4,"s":0,"q":"낯선 상황 실험에서 어머니와 분리되어도 거의 울지 않고, 다시 만나도 어머니를 피하거나 무시하는 애착 유형은?","o":["안정 애착","불안정-회피 애착","불안정-저항(양가) 애착","혼란 애착"],"a":1,"e":"회피형: 분리에도 무덤덤, 재회 시 회피. 저항(양가)형: 심하게 울고 재회 시 매달리면서도 밀어냄."},{"n":5,"s":0,"q":"파블로프의 실험에서 조건형성이 이루어진 후, 침 분비를 일으키는 “종소리”는 무엇에 해당하는가?","o":["무조건자극(UCS)","조건자극(CS)","무조건반응(UCR)","중성반응"],"a":1,"e":"먹이=무조건자극, 종소리=(학습 후) 조건자극, 종소리에 대한 침=조건반응."},{"n":6,"s":0,"q":"다음 중 “부적 강화”의 예로 가장 적절한 것은?","o":["숙제를 해 온 학생에게 칭찬 스티커를 주었다","안전벨트를 매면 시끄러운 경고음이 꺼져서, 벨트를 매는 행동이 늘었다","떠든 학생에게 벌점을 주었다","약속을 어긴 자녀의 게임 시간을 없앴다"],"a":1,"e":"부적 강화 = 싫은 자극을 “제거”하여 행동 “증가”. 스티커=정적 강화, 벌점=정적 처벌, 게임 금지=부적 처벌."},{"n":7,"s":0,"q":"슬롯머신 도박처럼 몇 번째 반응에서 보상이 나올지 예측할 수 없는 강화계획으로, 반응률이 가장 높고 소거가 잘 되지 않는 것은?","o":["고정비율 계획","변동간격 계획","고정간격 계획","변동비율 계획"],"a":3,"e":"반응률: 변동비율 > 고정비율 > 변동간격 > 고정간격. “변비가 제일 세다”."},{"n":8,"s":0,"q":"밀러(Miller)가 제시한 단기기억의 용량은?","o":["7±2 항목","3±1 항목","12±2 항목","용량의 제한이 없다"],"a":0,"e":"단기기억: 용량 7±2(매직넘버 7), 지속시간 약 20~30초. 청킹으로 늘릴 수 있음."},{"n":9,"s":0,"q":"이전에 학습한 내용이 새로 학습한 내용의 기억을 방해하는 현상은?","o":["역행간섭","인출 실패","부호화 특수성","순행간섭"],"a":3,"e":"순행 = 옛것 → 새것 방해. 역행 = 새것 → 옛것 방해."},{"n":10,"s":0,"q":"마음속으로는 미워하는 사람에게 오히려 지나치게 친절하게 대하는 방어기제는?","o":["투사","합리화","반동형성","전치"],"a":2,"e":"반동형성 = 속마음과 반대로 행동. “미운 놈 떡 하나 더 준다”."},{"n":11,"s":0,"q":"성격의 5요인 모형(Big Five)에 포함되지 \u003cu>않는\u003c/u> 것은?","o":["개방성","지배성","성실성","신경증"],"a":1,"e":"5요인 “개성외우신”: 개방성·성실성·외향성·우호성·신경증."},{"n":12,"s":0,"q":"매슬로의 욕구위계에서 가장 상위에 있는 욕구는?","o":["존중의 욕구","소속과 애정의 욕구","자아실현의 욕구","안전의 욕구"],"a":2,"e":"생리 → 안전 → 소속·애정 → 존중 → 자아실현. “생안소존자”."},{"n":13,"s":0,"q":"타인의 행동 원인을 추론할 때 상황 요인은 과소평가하고 성격 등 성향 요인을 과대평가하는 경향은?","o":["자기고양 편향","허위 합의 효과","기본적 귀인오류","후광 효과"],"a":2,"e":"기본적 귀인오류 = “남의 행동은 성격 탓”. 자기고양 편향 = 성공은 내 덕, 실패는 상황 탓."},{"n":14,"s":0,"q":"태도와 행동이 일치하지 않을 때 생기는 불편감을 줄이기 위해 태도를 바꾼다고 설명하는 이론과 학자는?","o":["인지부조화 이론 – 페스팅거","사회비교 이론 – 애쉬","균형 이론 – 밀그램","귀인 이론 – 반두라"],"a":0,"e":"페스팅거의 인지부조화. 애쉬=동조(선분 실험), 밀그램=복종(전기충격 실험)."},{"n":15,"s":0,"q":"권위자의 명령에 따라 타인에게 전기충격을 가하는 실험으로 “복종”을 연구한 학자는?","o":["애쉬","짐바르도","셰리프","밀그램"],"a":3,"e":"밀그램=복종, 애쉬=동조, 짐바르도=교도소 실험(역할), 셰리프=자동운동·규범 형성."},{"n":16,"s":0,"q":"정규분포에서 평균을 중심으로 ±1 표준편차 안에 포함되는 사례의 비율은 약 얼마인가?","o":["약 68%","약 50%","약 95%","약 99%"],"a":0,"e":"±1SD 68% / ±2SD 95% / ±3SD 99.7%."},{"n":17,"s":0,"q":"절대영점이 있어서 “2배, 3배”와 같은 비율 계산이 가능한 측정 척도는?","o":["비율척도","명명척도","서열척도","등간척도"],"a":0,"e":"“명서등비”: 명명(구분) → 서열(순위) → 등간(같은 간격, 온도·IQ) → 비율(절대영점, 키·몸무게)."},{"n":18,"s":0,"q":"실험연구에서 연구자가 의도적으로 조작하는 변인은?","o":["종속변인","가외변인","독립변인","매개변인"],"a":2,"e":"독립변인(원인, 조작) → 종속변인(결과, 측정). 가외변인은 통제 대상."},{"n":19,"s":0,"q":"파킨슨병은 주로 어떤 신경전달물질의 부족과 관련되는가?","o":["세로토닌","아세틸콜린","도파민","GABA"],"a":2,"e":"도파민: 부족 → 파킨슨, 과잉 → 조현병. 아세틸콜린 부족 → 알츠하이머."},{"n":20,"s":0,"q":"콜버그의 도덕성 발달이론에서 “법과 질서를 지켜야 한다”는 판단이 속하는 수준은?","o":["인습 수준","전인습 수준","후인습 수준","무도덕 수준"],"a":0,"e":"전인습(1벌·복종, 2욕구충족) – 인습(3착한 아이, 4법과 질서) – 후인습(5사회계약, 6보편윤리)."},{"n":21,"s":1,"q":"DSM-5에서 조현병과 증상은 같지만 지속 기간이 “1개월 이상 6개월 미만”인 장애는?","o":["조현양상장애","단기 정신병적 장애","조현정동장애","망상장애"],"a":0,"e":"단기 정신병적 장애(1일~1개월) → 조현양상장애(1~6개월) → 조현병(6개월 이상)."},{"n":22,"s":1,"q":"조현병의 음성증상에 해당하지 \u003cu>않는\u003c/u> 것은?","o":["정서적 둔마","무의욕증","환각","무언어증"],"a":2,"e":"환각·망상·와해된 언어/행동은 양성증상(없던 것이 생김)."},{"n":23,"s":1,"q":"주요우울장애 진단을 위해 증상이 지속되어야 하는 최소 기간은?","o":["1주","1개월","2주","6개월"],"a":2,"e":"9개 증상 중 5개 이상이 2주. 우울한 기분 또는 흥미 상실 중 하나는 필수."},{"n":24,"s":1,"q":"제II형 양극성장애의 진단에 필요한 삽화의 조합은?","o":["조증 삽화 + 경조증 삽화","조증 삽화만 1회 이상","경조증 삽화 + 주요우울 삽화","경조증 삽화만 1회 이상"],"a":2,"e":"제I형 = 조증 삽화(1주 이상) 1회 이상. 제II형 = 경조증(4일 이상) + 주요우울."},{"n":25,"s":1,"q":"범불안장애에서 과도한 불안과 걱정이 지속되어야 하는 최소 기간은?","o":["2주","6개월","1개월","2년"],"a":1,"e":"범불안장애 6개월. “걱정을 통제하기 어렵다”가 핵심."},{"n":26,"s":1,"q":"공황장애를 “신체감각에 대한 파국적 오해석”으로 설명한 학자는?","o":["셀리그만(Seligman)","울프(Wolpe)","클락(Clark)","보울비(Bowlby)"],"a":2,"e":"클락의 인지모델: 심장 두근거림 → “심장마비다!”로 오해석 → 불안 증폭."},{"n":27,"s":1,"q":"DSM-5의 “강박 및 관련 장애” 범주에 속하지 \u003cu>않는\u003c/u> 것은?","o":["신체이형장애","수집광","발모광","질병불안장애"],"a":3,"e":"강박 관련 “강신수발피”: 강박·신체이형·수집광·발모광·피부뜯기. 질병불안장애는 신체증상 관련 장애."},{"n":28,"s":1,"q":"외상 사건 후 PTSD와 유사한 증상이 “3일 이상 1개월 이내”로 나타날 때의 진단은?","o":["적응장애","외상후 스트레스장애","급성 스트레스장애","지속성 복합 애도장애"],"a":2,"e":"급성 스트레스장애 3일~1개월, 1개월 넘게 지속되면 PTSD."},{"n":29,"s":1,"q":"한 사람 안에 둘 이상의 서로 다른 성격 상태가 존재하며 번갈아 행동을 지배하는 장애는?","o":["해리성 정체감 장애","해리성 기억상실","이인증/비현실감 장애","조현병"],"a":0,"e":"과거의 “다중인격장애”. 조현병(정신분열)과 혼동하지 말 것."},{"n":30,"s":1,"q":"신경학적 원인 없이 마비·실명 등 운동이나 감각 기능의 이상이 나타나는 장애는?","o":["전환장애","질병불안장애","인위성 장애","신체이형장애"],"a":0,"e":"전환장애 = 기능성 신경학적 증상장애. 인위성 장애는 환자 역할을 위해 증상을 “꾸며냄”."},{"n":31,"s":1,"q":"신경성 폭식증의 특징으로 옳지 \u003cu>않은\u003c/u> 것은?","o":["통제력을 잃고 폭식하는 삽화가 반복된다","정상 체중에 현저히 못 미치는 저체중을 보인다","구토·하제 사용 등 부적절한 보상행동을 한다","체형과 체중이 자기평가에 과도한 영향을 미친다"],"a":1,"e":"폭식증은 대개 정상 체중 범위. 현저한 저체중은 신경성 식욕부진증의 특징."},{"n":32,"s":1,"q":"B군 성격장애에 속하지 \u003cu>않는\u003c/u> 것은?","o":["회피성 성격장애","경계성 성격장애","연극성 성격장애","자기애성 성격장애"],"a":0,"e":"B군 “반경연자”: 반사회성·경계성·연극성·자기애성. 회피성은 C군(회의강)."},{"n":33,"s":1,"q":"불안정한 대인관계, 정체감 혼란, 충동성, 버림받는 것에 대한 극심한 두려움, 반복적 자해가 특징인 성격장애는?","o":["연극성 성격장애","경계성 성격장애","의존성 성격장애","조현형 성격장애"],"a":1,"e":"경계성: 이상화↔평가절하를 오가는 관계, 만성적 공허감. DBT가 대표적 치료."},{"n":34,"s":1,"q":"관계사고, 마술적 사고, 기이한 믿음과 행동을 보이지만 조현병 수준에는 이르지 않는 성격장애는?","o":["조현성 성격장애","편집성 성격장애","회피성 성격장애","조현형 성격장애"],"a":3,"e":"조현“형” = 기이함. 조현“성” = 관계에 무관심·고립. 편집성 = 의심·불신."},{"n":35,"s":1,"q":"반사회성 성격장애의 진단 기준으로 옳은 것은?","o":["15세 이상이면 진단할 수 있다","18세 이상이며, 15세 이전에 품행장애의 증거가 있어야 한다","12세 이전에 ADHD 진단이 있어야 한다","아동기부터 진단할 수 있다"],"a":1,"e":"아동·청소년기에는 품행장애, 18세 이상부터 반사회성 성격장애."},{"n":36,"s":1,"q":"DSM-5에서 ADHD 진단을 위해 증상이 나타나야 하는 연령 기준은?","o":["12세 이전","7세 이전","15세 이전","18세 이전"],"a":0,"e":"DSM-5에서 7세 → 12세 이전으로 변경. 2개 이상 장면, 6개월 이상."},{"n":37,"s":1,"q":"자폐 스펙트럼 장애의 두 가지 핵심 증상은?","o":["부주의 / 과잉행동-충동성","운동 틱 / 음성 틱","지적 기능 결함 / 적응 기능 결함","사회적 의사소통의 결함 / 제한적이고 반복적인 행동·관심"],"a":3,"e":"부주의/과잉행동=ADHD, 운동·음성 틱=투렛장애, 지적·적응 기능 결함=지적장애."},{"n":38,"s":1,"q":"만성 알코올 중독에서 티아민(비타민 B1) 결핍으로 생기며 심한 기억장애와 작화증을 보이는 것은?","o":["진전섬망","코르사코프 증후군","알코올성 환각증","금단 발작"],"a":1,"e":"베르니케-코르사코프 증후군. 진전섬망은 금단 시의 떨림·환시·의식 혼탁."},{"n":39,"s":1,"q":"알츠하이머병으로 인한 신경인지장애의 초기에 가장 두드러지는 증상은?","o":["오래된 과거 기억의 완전한 상실","갑작스러운 의식 소실","환청과 피해망상","최근 일에 대한 기억력 저하"],"a":3,"e":"최근 기억(새로운 학습)부터 서서히 저하. 아세틸콜린 감소와 관련."},{"n":40,"s":1,"q":"우울증의 귀인이론에 따르면, 우울한 사람은 실패 경험을 어떻게 귀인하는 경향이 있는가?","o":["외부적 · 안정적 · 특수적 귀인","내부적 · 불안정적 · 특수적 귀인","외부적 · 불안정적 · 전반적 귀인","내부적 · 안정적 · 전반적 귀인"],"a":3,"e":"“내 탓(내부), 늘 그럴 것(안정), 뭘 해도(전반)” → “내안전”. 에이브럼슨 등의 개정된 학습된 무기력 이론."},{"n":41,"s":2,"q":"문항 내적 합치도(내적 일관성) 신뢰도를 나타내는 지수는?","o":["크론바흐 알파 계수","검사-재검사 상관계수","카파 계수","난이도 지수"],"a":0,"e":"신뢰도 “재동반내”. 내적 합치도 = 크론바흐 α, KR-20."},{"n":42,"s":2,"q":"새로 만든 우울검사의 점수와 이미 타당성이 입증된 기존 우울검사 점수의 상관을 같은 시점에 구했다. 이는 어떤 타당도인가?","o":["예언타당도","공인타당도","내용타당도","안면타당도"],"a":1,"e":"준거타당도 = 공인(현재 시점) + 예언(미래 예측)."},{"n":43,"s":2,"q":"Z점수가 +1.0인 사람의 T점수는?","o":["55","65","115","60"],"a":3,"e":"T = 50 + 10Z = 60. (IQ로는 100 + 15×1 = 115)"},{"n":44,"s":2,"q":"웩슬러 지능검사에서 사용하는 편차지능지수의 평균과 표준편차는?","o":["평균 100, 표준편차 15","평균 100, 표준편차 10","평균 50, 표준편차 10","평균 10, 표준편차 3"],"a":0,"e":"IQ 100/15, T점수 50/10, 소검사 환산점수 10/3."},{"n":45,"s":2,"q":"K-WAIS-IV에서 “작업기억 지표”의 핵심 소검사로 묶인 것은?","o":["공통성, 어휘","토막짜기, 퍼즐","동형찾기, 기호쓰기","숫자, 산수"],"a":3,"e":"언어이해(공통성·어휘·상식) / 지각추론(토막·행렬·퍼즐) / 작업기억(숫자·산수) / 처리속도(동형·기호)."},{"n":46,"s":2,"q":"지능이 일반요인(g)과 특수요인(s)으로 구성된다는 2요인설을 주장한 학자는?","o":["서스톤","스피어만","길포드","가드너"],"a":1,"e":"스피어만 g·s / 서스톤 7개 기본정신능력 / 길포드 지능구조 3차원 / 가드너 다중지능."},{"n":47,"s":2,"q":"뇌손상 환자의 병전 지능을 추정할 때 주로 활용하는 웩슬러 소검사는?","o const GL = [{"k":["프로이트"],"s":["프로이트","프로이드","Freud"],"t":"프로이트 (S. Freud, 1856–1939)","d":"오스트리아의 신경과 의사로 정신분석을 창시했다. 인간 행동이 무의식적 동기와 어린 시절 경험에 의해 결정된다고 보았고(심리적 결정론), 마음을 의식·전의식·무의식(지형학적 모형)과 원초아·자아·초자아(구조 모형)로 설명했다. 성격은 구강기–항문기–남근기–잠복기–생식기를 거치며 발달하고, 각 단계에서 욕구가 지나치게 충족되거나 좌절되면 고착이 일어난다고 했다.","p":"불안 3유형(현실·신경증적·도덕적), 방어기제, 치료기법(자유연상·꿈 분석·전이·저항·해석·훈습)이 단골. 남근기의 오이디푸스 콤플렉스와 초자아 형성도 자주 나온다."},{"k":["아들러"],"s":["아들러","Adler"],"t":"아들러 (A. Adler, 1870–1937)","d":"프로이트와 결별하고 개인심리학을 세웠다. 인간을 쪼갤 수 없는 전체적 존재, 목적을 향해 나아가는 존재로 보았다. 누구나 열등감을 느끼며 이를 보상하고 우월해지려는 노력이 성장의 동력이라고 했다. 정신건강의 기준은 사회적 관심(공동체감)이며, 4~5세 무렵 만들어진 생활양식이 평생의 행동 방향을 이끈다.","p":"생활양식 4유형(지배형·기생형·회피형·사회적 유용형)은 “사회적 관심 × 활동 수준”으로 나눈다. 기법으로는 격려, 초기기억 분석, “마치 ~인 것처럼 행동하기”, 수프에 침 뱉기, 단추 누르기가 나온다."},{"k":["로저스"],"s":["로저스","Rogers","인간중심","내담자 중심"],"t":"로저스 (C. Rogers, 1902–1987)","d":"인간중심(내담자중심) 상담의 창시자. 인간은 스스로 성장하려는 실현경향성을 타고났으며, 상담자가 기법보다 태도로써 안전한 관계를 제공하면 내담자가 스스로 변화한다고 보았다. 부적응은 “자기개념”과 “실제 경험”의 불일치에서 생기고, 이는 조건부 가치(조건적 존중) 때문에 만들어진다.","p":"상담자의 3태도(일치성·무조건적 긍정적 존중·공감적 이해), 완전히 기능하는 사람의 특성, 현상학적 장, 가치의 조건화가 핵심 키워드. “비지시적”, “지금-여기”, “진단·해석을 강조하지 않음”도 선택지에 자주 나온다."},{"k":["엘리스"],"s":["엘리스","Ellis","REBT","합리적 정서","합리정서"],"t":"엘리스 (A. Ellis, 1913–2007)","d":"합리적 정서행동치료(REBT)를 만들었다. 사람을 괴롭히는 것은 사건 자체가 아니라 그 사건에 대한 비합리적 신념이라고 보았다. 치료자는 적극적·지시적으로 비합리적 신념을 논박하여 합리적 신념으로 바꾸도록 돕는다.","p":"ABCDE(F) 모형의 각 글자 의미, 비합리적 신념의 특징(당위적 사고·파국화·낮은 인내성·인간 비하), 논박의 종류(논리적·경험적·실용적 논박)를 구분할 수 있어야 한다."},{"k":["=벡"],"s":["Beck","벡(","벡의","인지치료"],"t":"벡 (A. Beck, 1921–2021)","d":"우울증 연구에서 출발해 인지치료를 만들었다. 우울한 사람은 자기·세상·미래를 부정적으로 보는 인지삼제를 가지며, 그 밑에는 역기능적 인지도식(스키마)과 체계적인 인지적 오류가 있다고 보았다. 치료는 협력적 경험주의에 따라 내담자와 함께 생각의 근거를 검증한다.","p":"인지 수준(자동적 사고 → 중간신념 → 핵심신념), 인지적 오류의 예시 구분, 소크라테스식 질문, BDI(벡 우울척도)가 자주 출제된다. 엘리스가 “논박”이라면 벡은 “함께 검증”이다."},{"k":["스키너"],"s":["스키너","Skinner","조작적 조건"],"t":"스키너 (B. F. Skinner, 1904–1990)","d":"조작적 조건형성을 체계화한 급진적 행동주의자. 행동은 그 뒤에 따라오는 결과(강화·처벌)에 의해 늘거나 줄어든다고 보았다. 스키너 상자 실험으로 강화계획에 따라 반응 양상이 달라짐을 밝혔다.","p":"정적/부적 × 강화/처벌 4칸 구분, 강화계획(고정·변동 × 비율·간격), 행동조성, 소거, 토큰경제, 프리맥 원리가 나온다. 부적 강화는 처벌이 아니라 “행동 증가”라는 점이 함정."},{"k":["파블로프"],"s":["파블로프","Pavlov","고전적 조건"],"t":"파블로프 (I. Pavlov, 1849–1936)","d":"러시아의 생리학자. 개의 침 분비 실험으로 고전적 조건형성을 발견했다. 중성자극(종소리)이 무조건자극(먹이)과 반복해서 짝지어지면 조건자극이 되어 조건반응(침)을 일으킨다.","p":"획득·소거·자발적 회복·자극 일반화·변별·고차 조건형성의 뜻. 체계적 둔감법·혐오치료·홍수법이 고전적 조건형성에 기반한 치료다."},{"k":["반두라","모델링"],"s":["반두라","Bandura","관찰학습","모델링","자기효능감"],"t":"반두라 (A. Bandura, 1925–2021)","d":"사회학습이론(사회인지이론)을 제시했다. 직접 강화를 받지 않아도 다른 사람의 행동과 그 결과를 관찰하는 것만으로 학습이 일어난다고 보았다(보보인형 실험). 행동·개인·환경이 서로 영향을 주고받는다는 상호결정론과 자기효능감 개념으로 유명하다.","p":"관찰학습 4과정(주의집중 → 파지 → 운동재생 → 동기화), 대리강화, 자기효능감의 원천(성취경험·대리경험·언어적 설득·정서적 각성)."},{"k":["울프","체계적 둔감"],"s":["체계적 둔감","울프","Wolpe","상호억제","상호제지"],"t":"울프와 체계적 둔감법 (J. Wolpe, 1915–1997)","d":"울프는 이완과 불안이 동시에 일어날 수 없다는 상호억제(상호제지) 원리로 체계적 둔감법을 만들었다. 근육이완을 익힌 뒤, 불안을 일으키는 장면을 약한 것부터 차례로 상상하며 이완 상태를 유지하게 한다.","p":"3단계 순서(이완훈련 → 불안위계목록 → 둔감화)를 묻는다. 고전적 조건형성(역조건형성)에 기반하며 공포증·불안에 주로 쓴다."},{"k":["펄스"],"s":["펄스","Perls","게슈탈트","형태주의"],"t":"펄스 (F. Perls, 1893–1970)","d":"게슈탈트 치료를 만들었다. 과거의 “왜”보다 지금-여기에서 “무엇을, 어떻게” 경험하는지를 알아차리는 것을 강조한다. 해결되지 않은 감정(미해결 과제)이 전경으로 떠올라 현재의 접촉을 방해하므로, 이를 알아차리고 완결하도록 돕는다.","p":"전경과 배경, 알아차림-접촉 주기, 접촉경계 혼란 6가지, 신경증의 5층, 기법(빈 의자·과장하기·머물러 있기·꿈 작업·반대로 하기)이 나온다."},{"k":["글래서"],"s":["글래서","Glasser","현실치료","현실요법","선택이론"],"t":"글래서 (W. Glasser, 1925–2013)","d":"현실치료와 선택이론을 만들었다. 인간은 5가지 기본욕구를 채우기 위해 스스로 행동을 선택하며, 과거나 무의식이 아니라 현재의 행동과 책임에 초점을 둔다. 사람이 직접 바꿀 수 있는 것은 전행동 중 “활동하기”와 “생각하기”라고 보았다.","p":"5욕구, 전행동의 4요소, WDEP, 3R(책임·현실·옳고 그름), “변명을 받아들이지 않는다, 처벌하지 않는다, 포기하지 않는다”."},{"k":["=번"],"s":["Berne","교류분석","에릭 번"],"t":"번 (E. Berne, 1910–1970)","d":"교류분석(TA)을 만들었다. 성격을 부모(P)·어른(A)·어린이(C) 세 자아상태로 설명하고, 사람 사이의 의사소통을 이 자아상태 간의 교류로 분석한다. 어린 시절 부모의 메시지를 바탕으로 쓴 인생 각본이 삶을 좌우한다고 보았다.","p":"교류 유형(상보·교차·이면), 스트로크, 게임, 생활자세 4가지, 각본분석. 상담 목표는 “자율성(각성·자발성·친밀성)의 회복”."},{"k":["얄롬"],"s":["얄롬","Yalom"],"t":"얄롬 (I. Yalom, 1931– )","d":"미국의 정신과 의사로 실존주의 심리치료와 집단정신치료의 대표 이론가다. 인간이 피할 수 없는 네 가지 궁극적 관심사(죽음·자유·고립·무의미)와 마주할 때 실존적 불안이 생긴다고 보았다. 집단치료에서는 치료적 요인 11가지를 정리했다.","p":"실존 4주제와 집단 치료요인 11가지는 서로 다른 문제로 각각 나온다. 치료요인 중 보편성·희망의 고취·응집력의 뜻을 구분할 것."},{"k":["프랭클","의미치료"],"s":["프랭클","Frankl","의미치료","의미요법","로고테라피","역설적 의도"],"t":"프랭클과 의미치료 (V. Frankl, 1905–1997)","d":"나치 수용소 체험을 바탕으로 의미치료(로고테라피)를 만들었다. 인간의 가장 근본적인 동기는 “의미를 찾으려는 의지”이며, 의미를 잃으면 실존적 공허에 빠진다고 보았다.","p":"기법 2가지: 역설적 의도(두려워하는 것을 일부러 하게 함), 탈숙고(지나친 자기관찰에서 주의를 돌림). 의미를 찾는 3가지 길: 창조적 가치·경험적 가치·태도적 가치."},{"k":["사티어"],"s":["사티어","Satir","경험적 가족"],"t":"사티어 (V. Satir, 1916–1988)","d":"경험적 가족치료의 대표자. 가족 문제의 뿌리를 낮은 자존감과 역기능적 의사소통에서 찾았다. 가족이 지금-여기에서 감정을 직접 경험하고 솔직하게 표현하도록 돕는다.","p":"의사소통 유형 5가지(회유형·비난형·초이성형·산만형·일치형)에서 각각 무엇을 무시하는지(자기·타인·상황). 기법은 가족조각, 가족 재구조화, 빙산 탐색."},{"k":["보웬"],"s":["보웬","Bowen","자아분화","자기분화","다세대"],"t":"보웬 (M. Bowen, 1913–1990)","d":"다세대 가족치료(가족체계이론)를 만들었다. 핵심은 자아분화로, 사고와 감정을 구분하고 가족의 정서적 덩어리에서 벗어나 자기 입장을 지킬 수 있는 정도를 말한다. 분화 수준이 낮으면 불안할 때 제3자를 끌어들이는 삼각관계가 생긴다.","p":"자아분화, 삼각관계, 핵가족 정서체계, 가족투사 과정, 다세대 전수 과정, 정서적 단절, 출생순위. 대표 기법은 가계도와 “나-입장” 취하기."},{"k":["미누친"],"s":["미누친","Minuchin","구조적 가족"],"t":"미누친 (S. Minuchin, 1921–2017)","d":"구조적 가족치료를 만들었다. 증상은 개인이 아니라 잘못된 가족 구조에서 나온다고 보고, 하위체계 간의 경계선과 위계를 바로잡아 가족을 재구조화한다.","p":"경계선 3종(명확한·경직된·밀착된/혼돈된), 하위체계(부부·부모·형제), 기법(합류·실연·경계선 만들기·균형 깨뜨리기)."},{"k":["헤일리"],"s":["헤일리","Haley","전략적 가족"],"t":"헤일리 (J. Haley, 1923–2007)","d":"전략적 가족치료의 대표자. 통찰보다 현재의 문제 해결에 초점을 두고, 치료자가 구체적 전략과 지시를 주어 반복되는 상호작용 패턴을 바꾼다. 증상을 가족 내 힘과 통제의 문제로 보았다.","p":"역설적 개입(증상 처방), 지시, 시련(고된 체험) 기법, 재명명. 밀란 학파의 순환질문과 함께 묻기도 한다."},{"k":["리네한"],"s":["리네한","Linehan","변증법적 행동치료","DBT"],"t":"리네한 (M. Linehan, 1943– )","d":"경계성 성격장애와 만성 자살·자해 행동을 치료하기 위해 변증법적 행동치료(DBT)를 만들었다. “있는 그대로의 수용”과 “변화”라는 상반된 것 사이의 균형(변증법)을 핵심으로 한다. 정서적 취약성과 감정을 인정받지 못하는 환경(비타당화 환경)이 만나 문제가 생긴다고 본다.","p":"4가지 기술훈련(마음챙김·고통 감내·정서 조절·대인관계 효율성). 수용 쪽은 마음챙김과 고통 감내, 변화 쪽은 정서 조절과 대인관계."},{"k":["웩슬러"],"s":["웩슬러","Wechsler","WAIS","WISC"],"t":"웩슬러 (D. Wechsler, 1896–1981)","d":"1939년 웩슬러-벨뷰 지능검사를 만들었다. 지능을 “개인이 목적에 맞게 행동하고, 합리적으로 사고하며, 환경을 효과적으로 다루는 종합적·총체적 능력”으로 정의했다. 정신연령 대신 같은 연령 집단 안에서의 상대적 위치를 나타내는 편차지능지수(평균 100, 표준편차 15)를 도입했다.","p":"K-WAIS-IV의 4지표와 소검사 배치, 핵심/보충 구분, 병전 지능 추정 소검사(어휘·상식·토막짜기)가 가장 많이 나온다."},{"k":["로샤"],"s":["로샤","로르샤","Rorschach"],"t":"로샤 (H. Rorschach, 1884–1922)","d":"스위스의 정신과 의사로 1921년 잉크반점 검사를 발표했다. 대칭형 잉크반점 카드 10장을 보여 주고 무엇처럼 보이는지 묻는 대표적 투사검사다. 지금은 엑스너의 종합체계로 채점·해석하는 것이 표준이다.","p":"카드 구성(무채색 5·흑적 2·유채색 3), 채점 항목(반응영역·발달질·결정인·형태질·반응내용·평범반응·조직활동·특수점수), 질문단계에서 유도질문 금지."},{"k":["피아제"],"s":["피아제","Piaget"],"t":"피아제 (J. Piaget, 1896–1980)","d":"스위스의 심리학자로 인지발달이론을 세웠다. 아동은 능동적으로 세계를 탐색하며 도식(스키마)을 만들고, 동화(기존 도식에 맞춤)와 조절(도식을 바꿈)을 통해 평형을 이루면서 4단계를 차례로 거친다고 보았다.","p":"단계별 키워드: 감각운동기(대상영속성), 전조작기(자기중심성·물활론·중심화), 구체적 조작기(보존·가역성·서열화·유목화), 형식적 조작기(추상적·가설연역적 사고)."},{"k":["에릭슨"],"s":["에릭슨","Erikson"],"t":"에릭슨 (E. Erikson, 1902–1994)","d":"심리사회적 발달이론을 제시했다. 프로이트와 달리 자아와 사회·문화의 영향을 강조했고, 발달이 전 생애에 걸쳐 8단계로 이어진다고 보았다. 각 단계에는 해결해야 할 심리사회적 위기가 있다.","p":"단계-시기 짝짓기(특히 청소년기 정체감 대 역할혼미, 학령기 근면성 대 열등감). 마샤의 정체감 지위(성취·유예·유실·혼미)와 함께 나온다."},{"k":["콜버그"],"s":["콜버그","Kohlberg","도덕성 발달","도덕발달"],"t":"콜버그 (L. Kohlberg, 1927–1987)","d":"피아제의 이론을 확장해 도덕성 발달을 3수준 6단계로 나누었다. 하인츠 딜레마 같은 도덕적 갈등 상황에서 “무엇을 선택했는가”가 아니라 “왜 그렇게 판단했는가”를 기준으로 단계를 나눈다.","p":"전인습(벌과 복종 → 욕구충족), 인습(착한 아이 → 법과 질서), 후인습(사회계약 → 보편적 윤리). 길리건의 비판(배려의 도덕성)도 기억."},{"k":["매슬로"],"s":["매슬로","Maslow","욕구위계","욕구 위계"],"t":"매슬로 (A. Maslow, 1908–1970)","d":"인본주의 심리학의 대표자. 인간의 욕구가 위계를 이루며, 아래 단계 욕구가 어느 정도 채워져야 위 단계 욕구가 나타난다고 보았다. 건강하고 자아를 실현한 사람을 연구 대상으로 삼았다.","p":"순서: 생리 → 안전 → 소속·애정 → 존중 → 자아실현. 아래 4개는 결핍욕구, 자아실현은 성장욕구."},{"k":["비네"],"s":["비네","Binet"],"t":"비네 (A. Binet, 1857–1911)","d":"프랑스 정부의 의뢰로 1905년 시몽과 함께 최초의 실용적 지능검사(비네-시몽 검사)를 만들었다. 정규 교육을 따라가기 어려운 아동을 가려내는 것이 목적이었고, 정신연령 개념을 사용했다.","p":"터먼이 1916년 스탠포드-비네 검사에서 비율 IQ(정신연령 ÷ 생활연령 × 100)를 사용했고, 웩슬러가 편차 IQ를 도입했다."},{"k":["위트머"],"s":["위트머","Witmer"],"t":"위트머 (L. Witmer, 1867–1956)","d":"1896년 펜실베이니아 대학에 세계 최초의 심리클리닉을 세우고 “임상심리학”이라는 용어를 처음 사용했다. 학습 문제가 있는 아동을 평가하고 돕는 일을 했다.","p":"임상심리학의 시작 = 1896년 위트머. 분트(1879, 최초의 심리학 실험실)와 헷갈리지 말 것."},{"k":["셀리에","일반적응증후군"],"s":["셀리에","Selye","일반적응증후군","일반적응 증후군"],"t":"셀리에와 일반적응증후군 (H. Selye, 1907–1982)","d":"어떤 스트레스든 몸은 비슷한 방식으로 반응한다는 일반적응증후군(GAS)을 제시했다. 경고 단계(교감신경 활성화) → 저항 단계(저항력이 가장 높음) → 소진 단계(자원이 고갈되어 질병 발생) 순으로 진행한다.","p":"3단계 순서와 각 단계 특징. 좋은 스트레스(유스트레스)와 나쁜 스트레스(디스트레스) 구분도 셀리에의 개념."},{"k":["홀랜드"],"s":["홀랜드","Holland"],"t":"홀랜드 (J. Holland, 1919–2008)","d":"직업 선택을 성격의 표현으로 보고, 사람과 직업 환경을 각각 6가지 유형(현실형·탐구형·예술형·사회형·진취형·관습형)으로 나누었다. 성격 유형과 환경 유형이 맞을수록 만족과 성취가 높다고 본다.","p":"육각형 모형의 5개념: 일관성(이웃한 유형일수록 비슷), 변별성, 정체성, 일치성, 계측성. 서로 마주 보는 유형(현실형↔사회형 등)이 가장 다르다."},{"k":["수퍼"],"s":["수퍼","Super"],"t":"수퍼 (D. Super, 1910–1994)","d":"진로발달을 전 생애에 걸친 과정으로 보았고, 진로 선택은 자아개념을 실현하는 과정이라고 했다. 성장기–탐색기–확립기–유지기–쇠퇴기의 5단계를 제시했다.","p":"단계 순서와 탐색기의 하위 단계(잠정기·전환기·시행기). 생애무지개(생애 역할)와 진로성숙 개념도 수퍼의 것."},{"k":["머레이","TAT"],"s":["주제통각","TAT","머레이","Murray"],"t":"머레이와 TAT (H. Murray, 1893–1988)","d":"머레이는 모건과 함께 1935년 주제통각검사(TAT)를 만들었다. 모호한 그림을 보고 이야기를 꾸미게 하여, 주인공의 욕구(need)와 환경의 압력(press)을 분석한다. 31장의 카드 중 수검자에 맞게 20장을 골라 실시한다.","p":"로샤가 성격의 구조를 본다면 TAT는 성격의 내용과 대인관계 역동을 본다. 아동용은 CAT(동물 그림)."},{"k":["스피어만"],"s":["스피어만","Spearman","일반요인"],"t":"스피어만 (C. Spearman, 1863–1945)","d":"요인분석을 이용해 지능의 2요인설을 제시했다. 모든 지적 과제에 공통으로 작용하는 일반요인(g)과 특정 과제에만 작용하는 특수요인(s)으로 지능이 이루어진다고 보았다.","p":"서스톤(7개 기본정신능력), 길포드(내용·조작·산출의 3차원), 카텔(유동성·결정성), 가드너(다중지능), 스턴버그(삼원지능)와 짝짓기 문제로 나온다."},{"k":["셀리그만","학습된 무기력"],"s":["학습된 무기력","셀리그만","Seligman"],"t":"셀리그만과 학습된 무기력 (M. Seligman, 1942– )","d":"피할 수 없는 전기충격을 받은 개가 나중에 피할 수 있는 상황에서도 시도조차 하지 않는 것을 관찰하고 학습된 무기력이라 불렀다. 통제할 수 없다는 경험이 우울을 만든다는 이론이다.","p":"개정 이론(에이브럼슨 등)에서는 실패를 내부적·안정적·전반적으로 귀인할 때 우울해진다고 설명한다."},{"k":["신뢰도"],"s":["신뢰도"],"t":"신뢰도","d":"검사가 측정하려는 것을 얼마나 일관되게 재는지를 말한다. 같은 사람을 여러 번 재도 비슷한 점수가 나오면 신뢰도가 높다. 신뢰도는 타당도의 필요조건이지만 충분조건은 아니다(신뢰도가 높다고 타당도가 높은 것은 아니다).","p":"종류: 검사-재검사(안정성), 동형검사(동등성), 반분, 문항내적합치도(크론바흐 α), 채점자 간 신뢰도. 문항 수가 많고 문항이 동질적일수록 신뢰도가 높아진다."},{"k":["타당도"],"s":["타당도"],"t":"타당도","d":"검사가 재려는 것을 실제로 얼마나 정확히 재는지를 말한다. 내용타당도는 전문가가 문항의 대표성을 판단하고, 준거타당도는 외부 기준과의 상관으로 확인하며, 구성(구인)타당도는 이론적 개념을 제대로 재는지를 본다.","p":"준거타당도 = 공인(같은 시점) + 예언(미래). 구성타당도 확인 방법 = 수렴타당도·변별타당도·요인분석. 안면타당도는 수검자 눈에 그럴듯해 보이는 정도."},{"k":["정신상태검사","MSE"],"s":["정신상태검사","정신상태 검사","지남력"],"t":"정신상태검사 (MSE)","d":"면담 중 관찰과 질문으로 환자의 현재 정신 기능을 체계적으로 평가하는 방법이다. 외모·행동, 말, 기분과 정동, 사고 과정과 내용, 지각, 인지(지남력·기억·주의집중), 판단력, 병식을 살핀다.","p":"지남력은 시간·장소·사람 순으로 확인한다. 기분은 환자가 말하는 주관적 정서, 정동은 관찰되는 객관적 정서."},{"k":["병전"],"s":["병전"],"t":"병전 지능 추정","d":"뇌손상이나 정신장애가 생기기 전의 지능 수준을 추정하는 것으로, 현재 지능과 비교해 기능 저하 정도를 알기 위해 한다. 손상에도 비교적 안정적으로 유지되는 소검사(어휘·상식·토막짜기) 점수와 학력·직업·학교 성적 같은 인구학적 자료를 함께 쓴다.","p":"“어상토”. 현재 지능이 병전 지능보다 15점 이상 낮으면 유의미한 저하로 본다고 설명하는 교재가 많다."},{"k":["유동성","결정성"],"s":["유동성 지능","결정성 지능","유동적 지능","결정적 지능","유동지능","결정지능"],"t":"유동성 지능과 결정성 지능","d":"카텔과 혼이 구분했다. 유동성 지능은 타고난 신경생리적 능력으로 새로운 문제를 추론하고 해결하는 힘이며, 청년기에 정점에 이른 뒤 줄어든다. 결정성 지능은 교육과 경험으로 쌓인 지식으로, 나이가 들어도 유지되거나 늘어난다.","p":"웩슬러 소검사로는 유동성 = 토막짜기·행렬추론·숫자·공통성 쪽, 결정성 = 어휘·상식·이해 쪽."},{"k":["MMPI","임상척도","타당도 척도"],"s":["MMPI","다면적 인성검사"],"t":"MMPI-2 (다면적 인성검사)","d":"해서웨이와 맥킨리가 1943년에 만든 자기보고형 성격·정신병리 검사로, 가장 널리 쓰인다. 정상 집단과 환자 집단을 실제로 구분해 주는 문항을 골라 만드는 경험적 준거 방식으로 제작했다. MMPI-2는 567문항이며 T점수(평균 50, 표준편차 10)로 해석한다.","p":"타당도 척도 3묶음(성실성·비전형성·방어성), 임상척도 10개의 번호와 이름, K 교정 척도(1·4·7·8·9), 대표 코드타입(1-3, 2-7, 4-9, 6-8)을 순서대로 외운다."},{"k":["전환 V","1-3"],"s":["전환 V","전환V","1-3"],"t":"1-3 / 3-1 코드와 전환 V","d":"척도 1(건강염려증)과 3(히스테리)이 높고 그 사이 척도 2(우울증)가 낮아 V자 모양이 되는 형태다. 심리적 고통을 신체 증상으로 바꾸어 표현하며, 부인과 억압을 주로 쓰고 자신의 문제에 대한 통찰이 부족하다.","p":"신체증상 관련 장애(전환장애 등)와 연결. 증상으로 책임을 피하는 이차적 이득이 있을 수 있다."},{"k":["2-7"],"s":["2-7"],"t":"2-7 / 7-2 코드","d":"척도 2(우울증)와 7(강박증)이 함께 높다. 불안하고 우울하며 걱정이 많고, 완벽주의적이고 자기 비판적이다. 주관적 고통이 커서 도움을 구하려는 동기가 높고 심리치료의 예후가 비교적 좋다.","p":"우울장애, 불안장애, 강박장애에서 흔한 형태."},{"k":["4-9"],"s":["4-9"],"t":"4-9 / 9-4 코드","d":"척도 4(반사회성)와 9(경조증)가 함께 높다. 충동적이고 자극을 추구하며 규범과 권위를 무시하고, 행동화 경향이 강하다. 겉으로는 사교적이지만 관계가 피상적이고 죄책감이 적다.","p":"반사회성 성격장애와 관련. 치료 동기가 낮아 예후가 좋지 않은 편."},{"k":["6-8","정신증 V"],"s":["6-8","정신증 V"],"t":"6-8 / 8-6 코드와 정신증 V","d":"척도 6(편집증)과 8(조현병)이 함께 높다. 의심, 피해망상, 환각, 사고장애 등 심각한 정신병리를 시사하며 편집형 조현병을 의심한다. 척도 7이 6과 8보다 10점 이상 낮으면 “정신증 V(편집증 계곡)”라고 한다.","p":"F 척도도 함께 높은 경우가 많다."},{"k":["반응영역","위치(반응영역)"],"s":["반응영역","반응 영역"],"t":"로샤 반응영역","d":"수검자가 반점의 어느 부분을 사용해 반응했는지를 채점한다. W는 반점 전체, D는 흔히 사용되는 부분, Dd는 드물게 사용되는 부분, S는 흰 공백을 사용한 반응이다.","p":"W가 많으면 통합하려는 경향, Dd가 많으면 세부에 집착하는 경향, S가 많으면 반항성·부정적 태도로 해석한다."},{"k":["결정인"],"s":["결정인"],"t":"로샤 결정인","d":"반응을 만들어 내는 데 반점의 어떤 특성이 영향을 주었는지를 채점한다. 형태(F), 운동(M 인간·FM 동물·m 무생물), 유채색(C), 무채색(C′), 음영-재질(T), 음영-차원(V), 음영-확산(Y), 형태차원(FD), 쌍반응(2)과 반사반응(r)이 있다.","p":"M은 사고·공상, C는 정서 반응성, T는 애정·접촉 욕구, Y는 무력감·불안과 연결해 해석한다."},{"k":["BGT","벤더"],"s":["BGT","벤더","Bender"],"t":"BGT (벤더-게슈탈트 검사)","d":"벤더가 1938년에 만든 검사로, 9개의 기하학적 도형을 보고 종이에 따라 그리게 한다. 형태심리학 이론에 기초하며 시각-운동 협응 능력과 지각 능력을 평가한다. 언어 표현이 어려운 사람, 문맹자, 아동에게 쓰기 좋고 뇌의 기질적 손상을 가려내는 데 활용된다.","p":"허트의 평가항목(조직화, 크기의 일탈, 형태의 일탈, 형태의 왜곡, 그려 나가는 방식)과 실시 방법(모사·회상·변용묘사·순간노출)이 나온다."},{"k":["HTP","집 House","나무 Tree","사람 Person"],"s":["HTP","집-나무-사람","집·나무·사람"],"t":"HTP (집-나무-사람 검사)","d":"벅이 개발한 그림 투사검사다. 집·나무·사람을 차례로 그리게 하고 그림의 크기, 위치, 필압, 생략·강조된 부분 등을 해석한다. 집은 가정생활과 가족관계, 나무는 무의식적 자기상, 사람은 의식적 자기상과 대인관계를 반영한다고 본다.","p":"실시가 쉽고 언어 능력이 부족해도 가능하지만, 해석의 신뢰도와 타당도가 낮다는 한계가 있다."},{"k":["SCT","문장완성"],"s":["문장완성","SCT"],"t":"SCT (문장완성검사)","d":"“나의 아버지는 ___”처럼 미완성 문장을 완성하게 하는 반투사적 검사다. 삭스의 SSCT는 가족·성·대인관계·자기개념 4영역을 본다. 집단 실시가 가능하고 시간이 적게 든다.","p":"로샤나 TAT보다 의식 수준에 가까운 내용이 드러난다. 수검자가 의도적으로 답을 꾸밀 수 있다는 한계."},{"k":["실행기능"],"s":["실행기능","집행기능","위스콘신","전두엽"],"t":"실행기능과 전두엽 검사","d":"실행기능은 목표를 세우고, 계획하고, 상황에 맞게 전략을 바꾸고, 부적절한 반응을 억제하는 고차 인지 기능으로 전두엽이 담당한다. 위스콘신 카드분류검사(WCST), 스트룹 검사, 선로잇기 검사(TMT)가 대표적이다.","p":"WCST에서 규칙이 바뀌었는데도 이전 규칙을 계속 고집하는 보속 오류는 전두엽 손상의 지표."},{"k":["전이"],"s":["전이"],"t":"전이와 역전이","d":"전이는 내담자가 과거의 중요한 인물(주로 부모)에게 느꼈던 감정과 기대를 상담자에게 옮겨 느끼는 것이다. 정신분석에서는 전이를 분석하고 해석하는 것이 치료의 핵심이다. 역전이는 반대로 상담자가 자신의 미해결 문제 때문에 내담자에게 느끼는 감정이다.","p":"역전이는 교육분석과 수퍼비전으로 다룬다. “전이를 해결하지 않고 피한다”는 틀린 선택지."},{"c":"정신분석","k":["저항 분석","=저항"],"s":["저항"],"t":"저항","d":"치료의 진전을 방해하는 내담자의 모든 의식적·무의식적 행동을 말한다. 지각, 침묵, 화제 돌리기, 약속 잊기 등으로 나타난다. 무의식의 내용이 드러날 때 생기는 불안을 피하려는 것이므로, 정신분석에서는 저항을 분석하고 해석한다.","p":"동기강화상담에서는 저항에 맞서지 않고 “저항과 함께 구르기”를 한다."},{"k":["훈습"],"s":["훈습"],"t":"훈습","d":"통찰한 내용을 한 번 깨닫는 데 그치지 않고, 반복해서 다루며 실제 생활에 적용해 가는 과정이다. 전이와 저항에 대한 해석을 되풀이하면서 통찰이 깊어지고 행동 변화로 이어진다.","p":"정신분석 과정의 순서: 초기 → 전이 → 통찰 → 훈습."},{"k":["반동형성"],"s":["반동형성"],"t":"반동형성","d":"받아들이기 힘든 충동이나 감정을 정반대의 행동으로 표현하는 방어기제다. 미워하는 사람에게 지나치게 친절하게 대하는 것이 예다.","p":"투사(내 감정을 남의 것으로), 전치(대상을 바꿈), 합리화(그럴듯한 이유), 승화(바람직한 방향)와 예시로 구분하는 문제가 나온다."},{"k":["생활양식"],"s":["생활양식"],"t":"생활양식 (아들러)","d":"개인이 삶의 목표를 추구하는 독특한 방식으로, 4~5세 무렵 가족 안에서의 경험을 바탕으로 만들어진다. 사회적 관심과 활동 수준에 따라 지배형, 기생형(획득형), 회피형, 사회적 유용형으로 나눈다.","p":"사회적 유용형만 사회적 관심과 활동 수준이 모두 높다. 생활양식은 가족구도, 초기기억, 꿈을 통해 탐색한다."},{"k":["일치성","진실성"],"s":["일치성","진실성","진솔성"],"t":"일치성 (진실성)","d":"상담자가 상담 관계에서 느끼는 것과 표현하는 것이 일치하는 솔직한 태도다. 전문가의 가면을 쓰지 않고 한 사람으로서 내담자를 만난다. 로저스는 세 가지 태도 중 일치성을 가장 기본이 되는 것으로 보았다.","p":"교재에 따라 진실성, 진솔성, 솔직성으로 번역한다."},{"k":["무조건적 긍정적 존중"],"s":["무조건적 긍정적","무조건적 존중","무조건적 수용"],"t":"무조건적 긍정적 존중","d":"내담자의 감정, 생각, 행동을 평가하거나 조건을 달지 않고 있는 그대로 받아들이는 태도다. 내담자의 행동에 모두 동의한다는 뜻이 아니라, 한 사람으로서의 가치를 존중한다는 뜻이다.","p":"부모의 조건적 존중(가치의 조건화)이 자기와 경험의 불일치를 만든다는 설명과 연결된다."},{"k":["공감적 이해"],"s":["공감적 이해","공감"],"t":"공감적 이해","d":"상담자가 내담자의 내면세계를 마치 자신의 것처럼 느끼고 이해하되, “마치 ~처럼”이라는 태도를 잃지 않는 것이다. 이해한 것을 내담자에게 전달하는 것까지 포함한다.","p":"동정(상담자 자신의 감정에 빠짐)과 구분한다."},{"k":["당위적 사고"],"s":["당위"],"t":"당위적 사고","d":"“반드시 ~해야 한다”는 절대적이고 경직된 요구로, 엘리스는 이를 비합리적 신념의 핵심으로 보았다. 자신에 대한 당위(나는 반드시 잘해야 한다), 타인에 대한 당위(사람들은 나를 공정하게 대해야 한다), 세상에 대한 당위(세상은 내 뜻대로 되어야 한다)로 나뉜다.","p":"당위에서 파국화, 낮은 인내성, 인간 비하가 파생된다."},{"c":"인지","k":["인지삼제","=자기","=세상(경험)","=미래"],"s":["인지삼제","인지 삼제","인지적 삼제"],"t":"인지삼제","d":"벡이 우울한 사람에게서 발견한 세 가지 부정적 사고 주제다. 자기 자신(“나는 무가치하다”), 세상 또는 경험(“세상은 가혹하다”), 미래(“앞으로도 희망이 없다”)에 대한 부정적 생각을 말한다.","p":"“과거에 대한 부정적 생각”은 인지삼제가 아니다."},{"k":["과잉일반화"],"s":["과잉일반화","과잉 일반화"],"t":"과잉일반화","d":"한두 번의 사건을 근거로 일반적인 결론을 내리고, 관계없는 상황에까지 넓게 적용하는 인지적 오류다. 한 번 거절당하고 “나는 평생 연애를 못 한다”고 믿는 것이 예다.","p":"선택적 추상화(일부만 봄), 임의적 추론(근거 없이 결론), 개인화(내 탓), 흑백논리(둘 중 하나)와 예시로 구분한다."},{"k":["토큰경제"],"s":["토큰"],"t":"토큰경제","d":"바람직한 행동을 할 때마다 토큰(스티커, 점수 등)을 주고, 모인 토큰을 나중에 원하는 물건이나 활동과 바꾸게 하는 기법이다. 조작적 조건형성의 원리를 이용하며, 토큰은 이차 강화물이다.","p":"정신과 병동, 학교, 시설에서 많이 쓴다. 강화가 즉시 주어지고 포화가 잘 일어나지 않는 것이 장점."},{"c":"게슈탈트","k":["접촉경계","=내사","=투사","=융합","=반전","=자의식","=편향"],"s":["접촉경계","접촉-경계","내사","반전","융합"],"t":"접촉경계 혼란 (게슈탈트)","d":"개인과 환경 사이의 경계가 제대로 기능하지 못해 건강한 접촉이 막힌 상태다. 내사(남의 가치를 그대로 삼킴), 투사(내 것을 남의 탓으로 돌림), 융합(너와 나의 경계가 없음), 반전(남에게 할 것을 자기에게 함), 자의식(자신을 지나치게 관찰함), 편향(감각을 둔하게 해 접촉을 피함)이 있다.","p":"예시 문장을 주고 어떤 혼란인지 고르게 한다. 자책은 반전, “우리는 하나”는 융합, 딴소리·웃음으로 넘기기는 편향."},{"k":["WDEP"],"s":["WDEP"],"t":"WDEP (현실치료 절차)","d":"우볼딩이 정리한 현실치료의 상담 절차다. W(Want)는 바람과 욕구를 탐색하고, D(Doing)는 지금 하고 있는 행동을 살피고, E(Evaluation)는 그 행동이 바람을 이루는 데 도움이 되는지 내담자 스스로 평가하게 하고, P(Plan)는 실천 계획을 세운다.","p":"좋은 계획의 조건(SAMIC3): 단순하고, 달성 가능하고, 측정 가능하고, 즉각적이고, 내담자가 통제할 수 있고, 일관되고, 실천하겠다고 약속한 것."},{"k":["생활자세"],"s":["생활자세","인생태도","생활태도"],"t":"생활자세 (교류분석)","d":"어린 시절 스트로크 경험을 바탕으로 자신과 타인에 대해 갖게 된 기본 태도다. 자기긍정-타인긍정(건강한 자세), 자기긍정-타인부정(남 탓, 투사), 자기부정-타인긍정(열등감, 우울), 자기부정-타인부정(절망, 포기)의 네 가지가 있다.","p":"“I’m OK – You’re OK”가 상담의 목표가 되는 자세."},{"c":"상담","k":["=구조화"],"s":["구조화"],"t":"상담의 구조화","d":"상담이 어떻게 진행되는지 내담자에게 알려 주어 상담의 틀을 잡는 일이다. 상담 시간·횟수·장소·비용, 상담자와 내담자의 역할, 비밀보장과 그 한계, 연락 방법 등을 안내한다. 주로 초기에 하지만 필요하면 상담 중에도 다시 한다.","p":"구조화는 내담자의 불안을 줄이고 상담에 대한 현실적 기대를 갖게 한다."},{"k":["직면"],"s":["직면"],"t":"직면","d":"내담자의 말과 행동, 말과 말, 생각과 감정 사이의 불일치나 모순을 상담자가 짚어 주어 스스로 알아차리게 하는 기법이다. 내담자가 위협을 느낄 수 있으므로 신뢰 관계가 만들어진 뒤에, 비난이 아닌 관심의 태도로 한다.","p":"“말씀은 괜찮다고 하시는데 표정은 어두워 보이네요”가 전형적 예시."},{"k":["반영"],"s":["반영"],"t":"반영","d":"내담자의 말과 행동에 담긴 감정을 상담자가 읽어 다른 말로 되돌려 주는 기법이다. 내담자는 이해받는다고 느끼고 자기 감정을 더 분명히 알게 된다.","p":"재진술은 “내용”을, 반영은 “감정”을 되돌려 준다."},{"k":["자해·자살","타인을 해칠","비밀보장"],"s":["비밀보장","비밀 보장"],"t":"비밀보장과 그 예외","d":"상담자는 상담에서 알게 된 내담자의 정보를 동의 없이 공개하지 않는다. 그러나 내담자 자신이나 타인의 생명·안전이 위험할 때, 아동학대 등 법으로 신고가 정해진 경우, 법원의 명령이 있을 때, 치명적인 감염병이 있을 때는 예외가 된다. 이런 한계는 상담을 시작할 때 미리 알려야 한다.","p":"타라소프 판결: 내담자가 특정인을 해치려 할 때 상담자는 그 사람에게 경고하고 보호할 의무가 있다."},{"k":["보편성"],"s":["보편성"],"t":"보편성 (집단 치료요인)","d":"다른 집단원들도 자신과 비슷한 문제와 감정을 가지고 있음을 알게 되어 “나만 이런 게 아니구나” 하고 느끼는 것이다. 고립감과 수치심이 줄어든다.","p":"희망의 고취(나아질 수 있다는 기대), 이타심(남을 도우며 느끼는 가치감), 정화(감정 표출)와 구분."},{"k":["마음챙김"],"s":["마음챙김","마음 챙김"],"t":"마음챙김","d":"지금 이 순간의 경험에 의도적으로, 판단하지 않고 주의를 기울이는 것이다. DBT, ACT, MBSR(마음챙김 스트레스 감소), MBCT(마음챙김 인지치료) 등 “제3동향” 치료의 공통 요소다.","p":"MBCT는 우울증의 재발 방지를 위해 개발되었다."},{"c":"ACT","k":["=수용","탈융합","전념","맥락으로서의 자기","=가치","현재에 머무르기"],"s":["수용전념","수용-전념","ACT"],"t":"ACT (수용전념치료)","d":"헤이즈가 만든 치료로, 불편한 생각과 감정을 없애려 하지 않고 있는 그대로 받아들이면서 자신이 가치 있게 여기는 방향으로 행동하도록 돕는다. 고통을 피하려는 경험 회피와, 생각을 사실로 믿는 인지적 융합이 문제를 키운다고 본다.","p":"6가지 핵심 과정: 수용, 인지적 탈융합, 현재에 머무르기, 맥락으로서의 자기, 가치, 전념 행동. 목표는 심리적 유연성."},{"k":["공감 표현","불일치감","저항과 함께","자기효능감 지지","동기강화"],"s":["동기강화","동기 강화","동기면담"],"t":"동기강화상담 (MI)","d":"밀러와 롤닉이 만든 상담 방법으로, 변화에 대한 양가감정을 탐색하고 해결하여 내담자 스스로 변화 동기를 끌어내도록 돕는다. 중독 상담에서 시작해 널리 쓰인다. 상담자가 설득하거나 직면시키지 않고 협력한다.","p":"4원리(공감 표현하기, 불일치감 만들기, 저항과 함께 구르기, 자기효능감 지지하기)와 기술 OARS(열린 질문, 인정하기, 반영하기, 요약하기)."},{"k":["전숙고","숙고","변화단계"],"s":["전숙고","숙고","변화단계","변화 단계"],"t":"변화단계 모델","d":"프로차스카와 디클레멘테의 초이론적 모델. 사람은 행동을 바꿀 때 전숙고(문제를 인식하지 못함) → 숙고(인식했지만 양가감정) → 준비(곧 실행할 계획) → 실행(실제로 바꾸는 중) → 유지(6개월 이상 지속) 단계를 거친다.","p":"단계마다 개입이 다르다. 전숙고에는 정보 제공과 인식 높이기, 숙고에는 양가감정 다루기가 맞다. 재발도 과정의 일부로 본다."},{"k":["자아분화","삼각관계","가계도"],"s":["자아분화","자기분화","삼각관계","가계도"],"t":"자아분화와 삼각관계 (보웬)","d":"자아분화는 사고와 감정을 구분하는 능력(정신내적 측면)과 자신과 타인을 구분하는 능력(대인관계 측면)을 말한다. 분화가 낮은 사람은 감정에 휩쓸리고 가족과 융합된다. 두 사람 사이의 긴장이 높아지면 제3자를 끌어들여 불안을 낮추는데, 이를 삼각관계라고 한다.","p":"치료 목표는 탈삼각화와 자아분화 수준 높이기. 가계도로 3세대 이상의 패턴을 살핀다."},{"k":["경계선","합류","실연","구조적"],"s":["경계선","합류","실연"],"t":"경계선·합류·실연 (구조적 가족치료)","d":"경계선은 가족 구성원이나 하위체계 사이를 구분하는 보이지 않는 선이다. 명확한 경계선이 건강하고, 경직된 경계선은 유리(분리)된 가족, 혼돈된 경계선은 밀착된 가족을 만든다. 합류는 치료자가 가족에 받아들여지도록 가족의 방식에 맞추는 것이고, 실연은 가족의 실제 상호작용을 상담실에서 재연하게 하는 것이다.","p":"성격장애의 “경계성”과는 다른 개념."},{"k":["사회기술훈련","SST"],"s":["사회기술","사회 기술"],"t":"사회기술훈련","d":"대인관계에 필요한 기술을 구체적 행동 단위로 나누어 가르치는 훈련이다. 조현병 등 만성 정신장애인의 재활에서 핵심 프로그램으로 쓰인다. 사회학습이론에 기초한다.","p":"절차: 지시(교육) → 모델링(시범) → 역할연습(행동시연) → 피드백과 강화 → 과제(일반화)."},{"k":["기적 질문","예외 질문","척도 질문","대처 질문","해결중심"],"s":["해결중심","기적질문","기적 질문","예외질문","척도질문"],"t":"해결중심 단기치료","d":"드세이저와 김인수가 만든 단기 상담 모델이다. 문제의 원인을 캐기보다 내담자가 이미 가진 강점과 자원, 문제가 없었던 예외 상황에 초점을 맞춘다. 작은 변화가 큰 변화를 이끈다고 본다.","p":"질문 기법: 기적 질문, 예외 질문, 척도 질문, 대처 질문, 관계성 질문, 상담 전 변화 질문. 내담자 유형: 고객형, 불평형, 방문형."},{"k":["망상","환각","조현병"],"s":["조현병","정신분열"],"t":"조현병","d":"망상, 환각, 와해된 언어, 와해된 또는 긴장성 행동, 음성증상 중 2개 이상이 1개월 넘게 있고(망상·환각·와해된 언어 중 하나는 반드시 포함), 장애의 징후가 6개월 이상 이어질 때 진단한다. 양성증상은 도파민 과잉과 관련되어 약물에 잘 반응하고, 음성증상은 약물 반응과 예후가 나쁘다.","p":"기간으로 구분: 단기 정신병적 장애(1개월 미만), 조현양상장애(1~6개월), 조현병(6개월 이상). 좋은 예후 요인은 늦은 발병, 급성 발병, 뚜렷한 유발 요인, 양성증상 위주, 좋은 병전 기능."},{"k":["음성증상","양성"],"s":["음성증상","음성 증상","양성증상","양성 증상"],"t":"양성증상과 음성증상","d":"양성증상은 정상인에게 없는 것이 나타나는 증상으로 망상, 환각, 와해된 언어와 행동이 있다. 음성증상은 정상인에게 있는 기능이 줄거나 없어지는 것으로 정서 둔마, 무언어증, 무의욕증, 무쾌감증, 비사회성이 있다.","p":"양성 = 도파민 과잉, 약물 반응 좋음, 예후 좋음. 음성 = 뇌 구조 이상, 약물 반응 나쁨, 예후 나쁨."},{"k":["주요우울","필수 2"],"s":["주요우울","주요 우울"],"t":"주요우울장애","d":"9가지 증상 중 5가지 이상이 2주 동안 거의 매일 나타나고, 그중 우울한 기분 또는 흥미·즐거움의 상실 중 하나는 반드시 포함되어야 한다. 나머지는 체중·식욕 변화, 수면 문제, 정신운동 초조나 지체, 피로, 무가치감·죄책감, 집중력 저하, 죽음에 대한 반복적 생각이다.","p":"원인 이론: 인지삼제(벡), 학습된 무기력(셀리그만), 귀인이론(내부·안정·전반), 세로토닌·노르에피네프린 부족, 강화의 상실(레빈손)."},{"c":"PTSD","k":["=침투","=회피","PTSD","인지·기분의 부정적 변화","각성·반응성 변화"],"s":["외상후","외상 후","PTSD"],"t":"외상후 스트레스장애 (PTSD)","d":"죽음, 심각한 부상, 성폭력 같은 외상 사건을 겪거나 목격한 뒤 나타난다. 침투 증상(악몽, 플래시백), 관련 자극의 회피, 인지와 기분의 부정적 변화, 각성과 반응성의 변화가 1개월 이상 이어진다.","p":"증상이 3일~1개월이면 급성 스트레스장애. 치료는 지속노출치료, 인지처리치료, EMDR."},{"k":["강박장애"],"s":["강박장애","강박사고","강박행동"],"t":"강박장애","d":"원하지 않는데 반복해서 떠오르는 생각·충동·심상(강박사고)과, 그로 인한 불안을 줄이려고 반복하는 행동이나 정신적 행위(강박행동)가 특징이다. DSM-5에서는 불안장애에서 분리되어 “강박 및 관련 장애”로 독립했다.","p":"가장 효과적인 치료는 노출 및 반응방지법(ERP). 인지적 특징은 사고-행위 융합, 과도한 책임감, 사고억제의 역설적 효과."},{"k":["전환장애"],"s":["전환장애"],"t":"전환장애","d":"신경학적 질환으로 설명되지 않는 운동 기능 또는 감각 기능의 이상(마비, 실명, 발작, 감각 상실 등)이 나타난다. DSM-5의 정식 명칭은 기능성 신경학적 증상장애다. 증상을 일부러 만들어 내는 것이 아니다.","p":"인위성 장애(환자 역할을 하려고 증상을 꾸밈)와 꾀병(외적 이득을 위해 꾸밈)과 구분. 증상에 무관심한 태도(la belle indifférence)가 나타나기도 한다."},{"k":["경계성","B군"],"s":["경계성 성격","경계선 성격"],"t":"경계성 성격장애","d":"대인관계, 자아상, 정서가 모두 불안정하고 충동성이 심하다. 버림받는 것을 극도로 두려워하고, 상대를 이상화했다가 평가절하하는 일이 반복되며, 만성적 공허감과 반복적인 자해·자살 행동을 보인다.","p":"주된 방어기제는 분리(splitting). 대표 치료는 변증법적 행동치료(DBT)."},{"k":["ADHD"],"s":["ADHD","주의력결핍","주의력 결핍"],"t":"ADHD (주의력결핍 과잉행동장애)","d":"부주의 증상과 과잉행동-충동성 증상이 6개월 이상 이어지고, 12세 이전에 나타나며, 학교와 가정 등 2개 이상의 장면에서 관찰될 때 진단한다. 아동은 6개 이상, 17세 이상은 5개 이상의 증상이 필요하다.","p":"DSM-5에서 발병 기준이 7세에서 12세 이전으로 바뀌었다. 치료는 중추신경자극제(메틸페니데이트)와 부모훈련, 행동치료."},{"k":["자폐"],"s":["자폐"],"t":"자폐 스펙트럼 장애","d":"사회적 의사소통과 상호작용의 지속적인 결함, 그리고 제한적이고 반복적인 행동·관심·활동이라는 두 가지 핵심 증상이 발달 초기부터 나타난다. DSM-5에서 자폐장애, 아스퍼거장애 등을 하나의 스펙트럼으로 통합했다.","p":"마음이론(타인의 마음을 추론하는 능력)의 결함으로 설명하기도 한다."},{"k":["스트레스-취약성"],"s":["취약성-스트레스","스트레스-취약성","소인-스트레스","취약성 스트레스"],"t":"스트레스-취약성 모델","d":"정신장애는 타고난 생물학적·심리적 취약성(소인)과 환경에서 오는 스트레스가 함께 작용해 생긴다는 모델이다. 취약성이 큰 사람은 적은 스트레스에도 발병하고, 취약성이 작으면 큰 스트레스에도 버틸 수 있다.","p":"재활 관점에서는 약물 복용, 대처 기술, 사회적 지지가 보호 요인이 된다."},{"k":["부적 강화","강화"],"s":["부적 강화","부적강화","정적 강화","정적강화"],"t":"강화와 처벌","d":"강화는 행동을 늘리고 처벌은 행동을 줄인다. “정적”은 자극을 주는 것, “부적”은 자극을 없애는 것이다. 정적 강화(칭찬을 줌), 부적 강화(싫은 것을 없애 줌), 정적 처벌(벌을 줌), 부적 처벌(좋은 것을 빼앗음)의 네 가지가 있다.","p":"부적 강화는 행동을 “늘린다”. 두통약을 먹으면 두통이 사라져 약 먹는 행동이 느는 것이 예. 타임아웃과 반응대가는 부적 처벌."},{"k":["강화계획","변동비율"],"s":["강화계획","강화 계획","변동비율","고정비율","고정간격","변동간격"],"t":"강화계획","d":"강화를 언제, 얼마나 자주 줄지 정하는 규칙이다. 고정비율(정해진 횟수마다: 성과급), 변동비율(평균 횟수마다: 도박), 고정간격(정해진 시간마다: 월급), 변동간격(평균 시간마다: 낚시)이 있다.","p":"반응률은 변동비율 > 고정비율 > 변동간격 > 고정간격. 변동비율이 소거에 가장 강하다. 고정간격은 강화 직후 반응이 줄었다가 다시 늘어나는 모양을 보인다."},{"k":["대상영속성"],"s":["대상영속성","대상 영속성"],"t":"대상영속성","d":"대상이 눈앞에서 사라져도 계속 존재한다는 것을 아는 능력이다. 피아제는 감각운동기(0~2세)에 발달한다고 보았다. 장난감을 천으로 덮었을 때 천을 들추어 찾으면 대상영속성이 생긴 것이다.","p":"보존개념은 구체적 조작기에 획득된다."},{"k":["애착","=안정","불안정-회피","불안정-저항","=혼란"],"s":["애착"],"t":"애착","d":"영아와 주 양육자 사이에 만들어지는 강한 정서적 유대다. 보울비가 애착이론을 세웠고, 에인스워스가 낯선 상황 실험으로 안정 애착, 불안정-회피 애착, 불안정-저항(양가) 애착을 구분했다. 이후 혼란 애착이 추가되었다.","p":"할로우의 원숭이 실험은 애착이 먹이보다 접촉 위안에서 생긴다는 것을 보여 주었다. 로렌츠의 각인도 함께 나온다."},{"k":["기본적 귀인오류","귀인"],"s":["귀인"],"t":"귀인과 귀인 오류","d":"귀인은 행동의 원인을 추론하는 것이다. 기본적 귀인오류는 다른 사람의 행동을 설명할 때 상황의 영향은 낮게, 성격의 영향은 높게 보는 경향이다. 행위자-관찰자 편향은 내 행동은 상황 탓, 남의 행동은 성격 탓으로 보는 것이고, 자기고양 편향은 성공은 내 덕, 실패는 상황 탓으로 돌리는 것이다.","p":"켈리의 공변모형: 일관성이 높고, 특이성과 합의성이 낮으면 내부 귀인을 한다. 와이너는 귀인을 소재·안정성·통제가능성 차원으로 나누었다."},{"k":["인지부조화"],"s":["인지부조화","인지 부조화"],"t":"인지부조화","d":"페스팅거의 이론. 자신의 태도와 행동이 서로 맞지 않으면 심리적 불편함이 생기고, 이를 줄이려고 주로 태도를 행동에 맞게 바꾼다. 지루한 과제를 하고 1달러만 받은 사람이 20달러를 받은 사람보다 그 과제를 더 재미있었다고 평가한 실험이 유명하다.","p":"보상이 작을수록(행동을 정당화할 외적 이유가 부족할수록) 태도 변화가 크다."},{"c":"척도","k":["=명명","=서열","=등간","=비율"],"s":["명명척도","서열척도","등간척도","비율척도","명목척도"],"t":"측정 척도의 4수준","d":"명명척도는 대상을 구분만 하고(성별, 등번호), 서열척도는 순위를 매기며(등수), 등간척도는 간격이 같지만 절대영점이 없고(온도, 지능지수), 비율척도는 절대영점이 있어 몇 배인지 말할 수 있다(키, 무게).","p":"심리검사 점수는 대부분 등간척도로 취급한다. 평균은 등간척도 이상에서, 중앙값은 서열척도 이상에서 쓸 수 있다."},{"k":["도파민"],"s":["도파민"],"t":"도파민","d":"운동 조절, 보상과 동기, 주의에 관여하는 신경전달물질이다. 지나치게 활동하면 조현병의 양성증상과 관련되고, 부족하면 파킨슨병이 나타난다.","p":"세로토닌(우울·강박), 노르에피네프린(각성·우울), GABA(불안 억제), 아세틸콜린(기억, 알츠하이머)과 짝짓기."},{"k":["과학자-실무자","볼더"],"s":["과학자-실무자","과학자-전문가","볼더","Boulder"],"t":"과학자-실무자 모델","d":"1949년 미국 콜로라도주 볼더 회의에서 채택된 임상심리학자 수련 모델이다. 임상심리학자는 연구를 수행하는 과학자이면서 동시에 임상 실무를 하는 전문가여야 한다고 보며, 박사 학위(Ph.D.)와 1년의 인턴 과정을 요구한다.","p":"1973년 베일 회의에서는 실무 능력을 강조하는 실무자-학자 모델(Psy.D.)이 인정되었다."},{"k":["자문"],"s":["자문"],"t":"자문","d":"전문가(자문가)가 다른 전문가나 기관(피자문자)이 맡고 있는 문제를 더 잘 해결하도록 돕는 활동이다. 자문가와 피자문자는 대등한 관계이며, 최종 결정과 책임은 피자문자에게 있다. 내담자를 직접 돕는 것이 아니라 간접적으로 돕는다.","p":"카플란의 4유형(내담자 중심 사례, 피자문자 중심 사례, 프로그램 중심 행정, 피자문자 중심 행정)과 단계(질문의 이해 → 평가 → 중재 → 종결 → 추적)."},{"k":["1차 예방","2차 예방","3차 예방","예방"],"s":["1차 예방","2차 예방","3차 예방","일차 예방","이차 예방","삼차 예방"],"t":"예방의 3수준","d":"카플란의 구분이다. 1차 예방은 문제가 생기지 않도록 미리 막는 것(교육, 홍보, 환경 개선), 2차 예방은 문제를 일찍 발견해 빨리 치료하는 것(선별검사, 위기개입), 3차 예방은 이미 생긴 장애의 후유증을 줄이고 재발을 막아 사회에 복귀하게 하는 것(재활)이다.","p":"예시를 주고 몇 차 예방인지 고르게 한다. 재활과 사회복귀는 3차."},{"k":["손상","기능결함","역할장애","불이익"],"s":["정신재활","정신사회재활","손상","불이익"],"t":"정신재활 모형 (앤서니)","d":"만성 정신장애가 미치는 영향을 4단계로 나눈다. 손상은 증상 자체, 기능결함은 증상 때문에 일상 기술을 수행하지 못하는 것, 역할장애는 직업인·학생 같은 사회적 역할을 하지 못하는 것, 불이익은 차별과 편견으로 기회를 잃는 것이다.","p":"단계별 개입: 손상 = 치료(약물), 기능결함과 역할장애 = 재활(기술훈련, 직업재활, 환경 지원), 불이익 = 사회 제도와 인식 개선."},{"k":["직업재활"],"s":["직업재활","보호작업","지원고용"],"t":"직업재활","d":"정신장애인이 일을 통해 사회에 통합되도록 돕는 과정이다. 보호작업장(보호된 환경에서 단순 작업) → 임시취업(과도기적 취업, 일정 기간 실제 직장 경험) → 지원고용(직무지도원의 지원을 받으며 일반 직장 근무) → 독립취업 순으로 지원 수준이 줄어든다.","p":"지원고용은 “먼저 배치하고 나서 훈련한다”는 원칙."},{"k":["표출정서","EE"],"s":["표출정서","표현된 정서","정서표현"],"t":"가족의 표출정서 (EE)","d":"가족이 환자에게 보이는 비난(비판), 적대감, 과도한 정서적 관여를 말한다. 표출정서가 높은 가족과 함께 사는 조현병 환자는 재발률이 높다.","p":"가족 심리교육으로 표출정서를 낮추는 것이 재발 방지에 중요하다."},{"k":["A유형"],"s":["A유형","A형 성격","Type A"],"t":"A유형 성격","d":"프리드먼과 로젠만이 관상동맥성 심장질환 환자에게서 발견한 행동 유형이다. 경쟁적이고, 늘 시간에 쫓기며, 조급하고, 적개심과 공격성이 강하다.","p":"여러 요소 중 “적개심”이 심장질환과 가장 관련이 깊다. 반대는 느긋한 B유형."},{"k":["SORC"],"s":["SORC"],"t":"SORC 모델","d":"행동평가에서 문제 행동을 기능적으로 분석하는 틀이다. S(자극)는 행동에 앞선 상황, O(유기체)는 개인의 생리적·인지적 특성, R(반응)은 문제 행동, C(결과)는 행동 뒤에 따라오는 것이다.","p":"행동평가는 “무엇을 가지고 있는가(특질)”가 아니라 “무엇을 하는가(행동)”를 본다."}];

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function startExam(m) {
  const g = ui.src === 'g' && G, pool = g ? G.q : D.q, inR = g ? pool.filter(q => q.r === ui.round) : pool;
  const tag = g ? '기출 ' : '예상 ', rl = g ? rLabel(ui.round).replace(' 시행', '') + ' ' : '';
  let qs, label;
  if (m === 'wrong') { qs = wrongIds().map(id => QN[id]); label = '오답 다시 풀기'; }
  else if (m === 'full') { qs = inR; label = g ? '기출 ' + rl + '전체' : '예상문제 전체 100문항'; }
  else if (m === 'rand') { qs = shuffle(pool).slice(0, 20); label = tag + '랜덤 20문항'; }
  else if (m[0] === 'r') { qs = shuffle(pool.filter(q => q.s === +m[1])).slice(0, 20); label = '기출 ' + D.subj[+m[1]] + ' 랜덤 20'; }
  else { qs = inR.filter(q => q.s === +m[1]); label = tag + rl + D.subj[+m[1]]; }
  if (!qs.length) return;
  if (m !== 'full' && m !== 'wrong' && m[0] !== 's') qs.sort((a, b) => a.s - b.s);
  const study = ui.study || m === 'wrong';
  st.cur = { mode: m, label, ids: qs.map(q => q.id), ans: {}, flag: {}, i: 0, start: Date.now(), dur: study ? 0 : qs.length * 90, study };
  ui.askSubmit = false; save(); render(); scrollTo(0, 0);
}

function submitExam() {
  const c = st.cur; if (!c) return;
  const per = [0, 0, 0, 0, 0], tot = [0, 0, 0, 0, 0]; let ok = 0;
  for (const id of c.ids) { const q = QN[id]; tot[q.s]++; if (c.ans[id] === q.a) { ok++; per[q.s]++; delete st.wrong[id]; } else st.wrong[id] = (st.wrong[id] || 0) + 1; }
  let pass = null;
  if (c.mode === 'full') pass = ok / c.ids.length >= 0.6 && per.every((x, i) => !tot[i] || x / tot[i] >= 0.4);
  else if (c.mode !== 'wrong') pass = ok / c.ids.length >= 0.6;
  const r = { t: Date.now(), mode: c.mode, label: c.label, ids: c.ids, ans: c.ans, n: c.ids.length, c: ok, per, tot, pass, used: Math.floor((Date.now() - c.start) / 1000) };
  st.last = r; st.hist.unshift({ t: r.t, mode: r.mode, label: r.label, n: r.n, c: r.c, pass }); st.hist = st.hist.slice(0, 20);
  st.cur = null; ui.askSubmit = false; ui.result = true; ui.onlyWrong = ok < c.ids.length; save(); render(); scrollTo(0, 0);
}

  const secs = SEC[ui.tab], s = secs[ui.si[ui.tab]];
  return `
  <div><h1 class="h2">암기노트</h1><p class="muted" style="margin:4px 0 0">빨간 글자가 두문자, 노란 상자가 연상 문장입니다. 단어·학자·제목을 누르면 자세한 설명과 관련 문제가 나옵니다.</p></div>
  <div class="row"><div class="seg"><button aria-pressed="${ui.tab === 'w'}" data-act="tab" data-v="w">필기 (6장)</button><button aria-pressed="${ui.tab === 'p'}" data-act="tab" data-v="p">실기 (11장)</button></div>
    <button class="btn sm" data-act="hide" aria-pressed="${!!st.hide}">${st.hide ? '설명 모두 보기' : '설명 가리고 떠올리기'}</button>
    ${st.hide ? '<span class="small muted">흐린 부분을 누르면 보입니다.</span>' : ''}</div>
  <div class="secs">${secs.map((x, i) => `<button class="${x.cls}" aria-pressed="${i === ui.si[ui.tab]}" data-act="sec" data-i="${i}">${x.no}. ${x.short}</button>`).join('')}</div>
  <div class="sechead ${s.cls}"><h2 class="h3">${s.title}</h2><p>${s.sub}</p></div>
  <div class="cards ${st.hide ? 'hiding' : ''}">${s.cards.map(c => noteCard(c)).join('')}</div>
  <div class="row" style="justify-content:space-between"><button class="btn" data-act="sec" data-i="${ui.si[ui.tab] - 1}" ${ui.si[ui.tab] ? '' : 'disabled'}>이전 장</button><button class="btn" data-act="sec" data-i="${ui.si[ui.tab] + 1}" ${ui.si[ui.tab] < secs.length - 1 ? '' : 'disabled'}>다음 장</button></div>`;
}

/* ---------- 두문자 카드 ---------- */
function buildDeck() { ui.deck = shuffle(MN.filter(c => (ui.fcKind === 'all' || c.kind === ui.fcKind) && (!ui.fcTodo || !st.known[c.id])).map(c => c.id)); ui.fi = 0; ui.fshow = false; }
function cards() {
  if (!ui.deck) buildDeck();
  const pool = MN.filter(c => ui.fcKind === 'all' || c.kind === ui.fcKind), kn = pool.filter(c => st.known[c.id]).length;
  const id = ui.deck[ui.fi], c = ALL.find(x => x.id === id);
  return `<div class="fc">
  <div><h1 class="h2">두문자 카드</h1><p class="muted" style="margin:4px 0 0">두문자를 보고 내용을 떠올린 뒤 카드를 뒤집어 확인하세요.</p></div>
  <div class="row"><div class="seg"><button aria-pressed="${ui.fcKind === 'all'}" data-act="fck" data-v="all">전체</button><button aria-pressed="${ui.fcKind === 'w'}" data-act="fck" data-v="w">필기</button><button aria-pressed="${ui.fcKind === 'p'}" data-act="fck" data-v="p">실기</button></div>
    <label class="kn" style="margin:0"><input type="checkbox" id="fc-todo" data-act-change="fctodo" ${ui.fcTodo ? 'checked' : ''}> 못 외운 것만</label></div>
  <div><div class="prog"><i style="width:${pool.length ? kn / pool.length * 100 : 0}%"></i></div><div class="small muted" style="margin-top:4px">${kn} / ${pool.length}개 외움${c ? ` · 이번 묶음 ${ui.fi + 1} / ${ui.deck.length}` : ''}</div></div>
  ${c ? `<div class="fcard ${c.sec.cls}">
      ${ui.fshow ? noteCard(c, false) : `<span class="chip" style="align-self:center">${c.kind === 'w' ? '필기' : '실기'} ${c.sec.no}장 · ${c.sec.short}</span><div class="k">${c.m}</div><div class="h3">${c.t}</div>`}
    </div>
    ${ui.fshow ? `<div class="row" style="justify-content:center"><button class="btn" data-act="fc-no">아직 헷갈려요</button><button class="btn pri" data-act="fc-yes">외웠어요</button></div>`
      : `<div class="row" style="justify-content:center"><button class="btn pri" data-act="fc-flip">뒤집어서 확인</button><button class="btn" data-act="fc-skip">건너뛰기</button></div>`}`
    : `<div class="panel empty">${ui.deck.length ? '이번 묶음을 끝까지 봤습니다.' : '이 조건에 해당하는 카드가 없습니다. 모두 외웠습니다.'}<div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-act="fc-again">다시 섞어서 보기</button></div></div>`}
  </div>`;
}

/* ---------- 오답노트 ---------- */
function wrong() {
  const ids = wrongIds();
  const by = [0, 1, 2, 3, 4].map(s => ids.filter(id => QN[id].s === s).length);
  return `
  <div class="row" style="justify-content:space-between"><div><h1 class="h2">오답노트</h1><p class="muted" style="margin:4px 0 0">틀리거나 못 푼 문제가 쌓입니다. 다시 풀어 맞히면 빠집니다.</p></div>
    ${ids.length ? `<button class="btn pri" data-act="start" data-m="wrong">오답 ${ids.length}문항 다시 풀기</button>` : ''}</div>
  ${ids.length ? `<div class="row">${by.map((n, i) => n ? `<span class="chip c${i + 1}">${D.subj[i]} ${n}</span>` : '').join('')}</div>
  <div class="rev">${ids.map(id => reviewItem(QN[id], undefined, `<span class="small muted">${st.wrong[id]}번 틀림</span><button class="btn sm" data-act="unwrong" data-id="${id}" style="margin-left:auto">목록에서 빼기</button>`)).join('')}</div>`
    : `<div class="panel empty">아직 오답이 없습니다. 모의시험을 풀면 틀린 문제가 여기에 모입니다.<div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#exam">모의시험 보러 가기</a></div></div>`}`;
}

/* ---------- 단어·학자 상세 ---------- */
const STOP = new Set(['만든 사람', '알 수 있는 것', '추가 근거', '재활 개입', '발달단계', '치료요인', '외우기', '핵심']);
function findGloss(k, ctx) {
  let best = null, bl = 0;
  for (const g of GL) { if (g.c && !ctx.includes(g.c)) continue;
    for (const key of g.k) { const ex = key[0] === '=', kk = ex ? key.slice(1) : key; if ((ex ? k === kk : k.includes(kk)) && kk.length > bl) { best = g; bl = kk.length; } } }
  return best;
}
function related(terms) {
  if (!terms.length) return [];
  const out = [];
  for (const q of (G ? G.q : []).concat(D.q)) {
    const inQ = terms.some(t => q.q.includes(t) || q.o[q.a].includes(t)), inO = !inQ && terms.some(t => q.o.some(o => o.includes(t)));
    if (inQ || inO) out.push([inQ ? 2 : 1, q]);
  }
  return out.sort((a, b) => b[0] - a[0] || (b[1].r || '').localeCompare(a[1].r || '')).map(x => x[1]);
}
function openDetail(el) {
  const k = el.dataset.k, card = el.closest('.ncard'), h3 = card && card.querySelector('h3'), mk = card && card.querySelector('.mn .k');
  const ctx = [h3 && h3.textContent, mk && mk.textContent].filter(Boolean).join(' · ');
  let desc = '';
  if (el.tagName === 'LI') desc = el.querySelector('span').innerHTML;
  else if (el.tagName === 'TR') { const th = [...el.closest('table').rows[0].cells].map(c => c.textContent.trim()); desc = [...el.cells].slice(1).map((c, i) => (th[i + 1] ? `<b>${esc(th[i + 1])}</b> ` : '') + c.innerHTML).join('<br>'); }
  else if (el.classList.contains('who')) { const sp = el.querySelector('span'); desc = sp ? sp.innerHTML : ''; }
  const g = findGloss(k, ctx);
  const terms = g ? (g.s || g.k.map(x => x.replace(/^=/, ''))) : k.split(/[·\/,→]| vs | \+ /).map(x => x.replace(/\(.*?\)/g, '').trim()).filter(x => x.length >= 3 && !STOP.has(x));
  ui.sheet = { k, ctx: el.tagName === 'H3' ? '' : ctx, desc, g, rel: related(terms), more: 4 };
  renderSheet();
}
function renderSheet() {
  const box = $('#sheet'), x = ui.sheet;
  if (!x) { box.hidden = true; box.innerHTML = ''; document.body.style.overflow = ''; return; }
  box.hidden = false; document.body.style.overflow = 'hidden';
  box.innerHTML = `<div class="sheetbg" data-close><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(x.k)} 자세히">
    <div class="row" style="justify-content:space-between"><span class="small muted">${esc(x.ctx)}</span><button class="btn sm" data-close id="sheet-close">닫기</button></div>
    <h2>${x.g ? esc(x.g.t) : esc(x.k)}</h2>
    ${x.desc ? `<p class="lead">${x.desc}</p>` : ''}
    ${x.g ? `<div class="gl"><p>${esc(x.g.d)}</p>${x.g.p ? `<p class="pt"><b>시험 포인트</b> ${esc(x.g.p)}</p>` : ''}</div>` : ''}
    <h3 class="h3">${x.rel.length ? `이 내용이 나온 문제 ${x.rel.length}개` : G === null ? '관련 기출을 불러오는 중입니다' : '관련 문제를 찾지 못했습니다'}</h3>
    ${x.rel.slice(0, x.more).map(q => reviewItem(q, undefined, ' ')).join('')}
    ${x.rel.length > x.more ? `<button class="btn" data-more>문제 더 보기 (${x.rel.length - x.more}개 남음)</button>` : ''}
    ${!x.g && !x.rel.length && !x.desc ? '<p class="muted">이 항목은 노트의 설명이 전부입니다.</p>' : ''}
  </aside></div>`;
  $('#sheet-close').focus();
}
$('#sheet').addEventListener('click', e => {
  if (e.target.closest('[data-more]')) { ui.sheet.more += 6; const sc = $('.sheet').scrollTop; renderSheet(); $('.sheet').scrollTop = sc; return; }
  if (e.target.closest('#sheet-close') || e.target.classList.contains('sheetbg')) { ui.sheet = null; renderSheet(); }
});

/* ---------- 렌더 & 이벤트 ---------- */
function render() {
  const v = view();
  document.querySelectorAll('#nav a').forEach(a => a.dataset.v === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  clearInterval(tick);
  let h;
  if (st.cur && st.cur.ids.some(id => !QN[id])) { if (G === null && v === 'exam') { app.innerHTML = '<div class="panel empty">문제를 불러오는 중입니다.</div>'; return; } if (G !== null) { st.cur = null; save(); } }
  if (v === 'exam' && st.cur && st.cur.ids.some(id => !QN[id])) return;
  if (v === 'exam') h = st.cur ? examRun() : (ui.result && st.last ? examResult() : examSetup());
  else h = { home, study, cards, wrong }[v]();
  app.innerHTML = h;
  if (v === 'exam' && st.cur && st.cur.dur) tick = setInterval(() => { const r = remain(), el = $('#timer'); if (r <= 0) return submitExam(); if (el) el.textContent = fmt(r); }, 1000);
}
function move(d) { const c = st.cur; const n = c.i + d; if (n >= 0 && n < c.ids.length) { c.i = n; save(); render(); } }
function answer(i) { const c = st.cur, n = c.ids[c.i]; if (c.study && c.ans[n] != null) return; c.ans[n] = (!c.study && c.ans[n] === i) ? undefined : i; if (c.ans[n] === undefined) delete c.ans[n]; save(); render(); }
app.addEventListener('click', e => {
  const rv = e.target.closest('.hiding [data-rv]'); if (rv) rv.classList.add('rv');
  const kEl = e.target.closest('.ncard [data-k]'); if (kEl && !e.target.closest('label,input,button,a') && !(rv && kEl.closest('.hiding'))) return openDetail(kEl);
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, c = st.cur;
  if (a === 'mode') ui.study = b.dataset.v === '1';
  else if (a === 'src') ui.src = b.dataset.v;
  else if (a === 'round') ui.round = b.dataset.v;
  else if (a === 'start') { if (view() !== 'exam') { location.hash = 'exam'; } ui.result = false; return startExam(b.dataset.m); }
  else if (a === 'show-last') ui.result = true;
  else if (a === 'back-setup') ui.result = false;
  else if (a === 'ans') return answer(+b.dataset.i);
  else if (a === 'prev') return move(-1);
  else if (a === 'next') return move(1);
  else if (a === 'jump') { c.i = +b.dataset.i; save(); }
  else if (a === 'flag') { const n = c.ids[c.i]; c.flag[n] ? delete c.flag[n] : c.flag[n] = 1; save(); }
  else if (a === 'submit-ask') ui.askSubmit = 'submit';
  else if (a === 'quit-ask') ui.askSubmit = 'quit';
  else if (a === 'cancel') ui.askSubmit = false;
  else if (a === 'submit') return submitExam();
  else if (a === 'quit') { st.cur = null; ui.askSubmit = false; ui.result = false; save(); }
  else if (a === 'ow') ui.onlyWrong = b.dataset.v === '1';
  else if (a === 'tab') ui.tab = b.dataset.v;
  else if (a === 'sec') { ui.si[ui.tab] = +b.dataset.i; render(); return scrollTo(0, 0); }
  else if (a === 'hide') { st.hide = !st.hide; save(); }
  else if (a === 'fck') { ui.fcKind = b.dataset.v; buildDeck(); }
  else if (a === 'fc-flip') ui.fshow = true;
  else if (a === 'fc-skip') { ui.fi++; ui.fshow = false; }
  else if (a === 'fc-yes' || a === 'fc-no') { const id = ui.deck[ui.fi]; a === 'fc-yes' ? st.known[id] = 1 : delete st.known[id]; ui.fi++; ui.fshow = false; save(); }
  else if (a === 'fc-again') buildDeck();
  else if (a === 'unwrong') { delete st.wrong[b.dataset.id]; save(); }
  else if (a === 'reset-ask') ui.askReset = true;
  else if (a === 'reset-no') ui.askReset = false;
  else if (a === 'reset-yes') { st = { known: {}, wrong: {}, hist: [], cur: null, last: null, hide: false }; ui.askReset = false; ui.deck = null; save(); }
  else return;
  render();
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.known) { t.checked ? st.known[t.dataset.known] = 1 : delete st.known[t.dataset.known]; save(); }
  else if (t.dataset.actChange === 'fctodo') { ui.fcTodo = t.checked; buildDeck(); render(); }
});
addEventListener('keydown', e => {
  if (ui.sheet) { if (e.key === 'Escape') { ui.sheet = null; renderSheet(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.ncard [data-k]')) { e.preventDefault(); return openDetail(e.target); }
  if (view() !== 'exam' || !st.cur || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '4') answer(+e.key - 1);
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
});
addEventListener('hashchange', () => { ui.sheet = null; renderSheet(); ui.askSubmit = false; ui.askReset = false; render(); scrollTo(0, 0); });
render();
(window.__GICHUL ? Promise.resolve(window.__GICHUL) : fetch('gichul.json').then(r => { if (!r.ok) throw 0; return r.json(); }))
  .then(g => { g.q.forEach(q => { q.g = 1; QN[q.id] = q; }); G = g; })
  .catch(() => { G = false; if (ui.src === 'g') ui.src = 'e'; })
  .then(() => { if (!ui.sheet) render(); });
</script>

</body></html>
