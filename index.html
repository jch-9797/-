<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>임상심리사 2급 합격노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: OMR 답안지에서 가져온 구조 — 좁은 본문 칼럼, 번호 버블 격자, 과목별 색 띠 */
:root{
  --bg:#f2f4f8;--surface:#ffffff;--sunk:#e9edf4;--ink:#1b2540;--muted:#5a6583;--line:#d3d9e6;
  --omr:#c42f4d;--on-omr:#ffffff;--omr-soft:#fbe5ea;
  --ok:#1b7f45;--ok-soft:#dcf2e4;--bad:#c42f4d;--bad-soft:#fbe5ea;
  --mn-bg:#fff5d2;--mn-line:#d99c00;--mn-ink:#6a4a00;--hl:#c42f4d;--hl-bg:#fde2e7;
  --s1:#1c6fc4;--s2:#23874a;--s3:#c2520c;--s4:#6542d6;--s5:#c22a63;
  --display:'Jua','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141d;--surface:#19212f;--sunk:#222c3d;--ink:#e7ebf5;--muted:#9aa6c0;--line:#313c53;
  --omr:#ff8098;--on-omr:#2b0a13;--omr-soft:#3b1b25;
  --ok:#62d391;--ok-soft:#15301f;--bad:#ff8098;--bad-soft:#3b1b25;
  --mn-bg:#32290b;--mn-line:#b8870a;--mn-ink:#f2d98c;--hl:#ff93a7;--hl-bg:#47202b;
  --s1:#74b4f6;--s2:#6fd192;--s3:#ffa268;--s4:#ac9aff;--s5:#ff88b4;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141d;--surface:#19212f;--sunk:#222c3d;--ink:#e7ebf5;--muted:#9aa6c0;--line:#313c53;
  --omr:#ff8098;--on-omr:#2b0a13;--omr-soft:#3b1b25;
  --ok:#62d391;--ok-soft:#15301f;--bad:#ff8098;--bad-soft:#3b1b25;
  --mn-bg:#32290b;--mn-line:#b8870a;--mn-ink:#f2d98c;--hl:#ff93a7;--hl-bg:#47202b;
  --s1:#74b4f6;--s2:#6fd192;--s3:#ffa268;--s4:#ac9aff;--s5:#ff88b4;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.c1{--c:var(--s1)}.c2{--c:var(--s2)}.c3{--c:var(--s3)}.c4{--c:var(--s4)}.c5{--c:var(--s5)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:19px;padding-block:10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--omr);font-weight:400}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
nav a{padding:12px 11px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav a[aria-current]{color:var(--ink);border-color:var(--omr);font-weight:700}
main{max-width:1040px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 15px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--omr);color:var(--on-omr);border-color:var(--omr)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.h2{font-family:var(--display);font-size:22px;font-weight:400}
.h3{font-size:16px;font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--c,var(--muted));border:1px solid currentColor;border-radius:99px;padding:1px 9px;white-space:nowrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 13px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 홈 */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:stretch}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,38px)}
.hero h1 span{color:var(--omr)}
.hero p{margin:8px 0 16px;color:var(--muted);max-width:34em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.way{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;border-top:4px solid var(--c)}
.way:hover{border-color:var(--c)}
.way b{font-family:var(--display);font-weight:400;font-size:18px}
.way span{font-size:13px;color:var(--muted)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.info dt{color:var(--muted)}.info dd{margin:0;font-weight:500}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist th,.hist td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* 시험 선택 */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--omr));border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.pick:hover{border-color:var(--c,var(--omr))}
.pick b{font-size:16px}.pick span{font-size:13px;color:var(--muted)}

/* 시험 진행 */
.runbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.runbar .t{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--omr);min-width:76px}
.runbar .sp{flex:1}
.run{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;border-top:5px solid var(--c);min-width:0}
.qcard .qt{font-size:17px;font-weight:700;margin:10px 0 14px;display:flex;gap:8px}
.qcard .qt i{font-family:var(--display);font-style:normal;color:var(--c);font-size:20px;line-height:1.35;flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.opt .b{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1}
.opt:hover:not([disabled]){border-color:var(--omr)}
.opt.sel{border-color:var(--omr);background:var(--omr-soft)}
.opt.sel .b{background:var(--omr);color:var(--on-omr)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default;color:inherit}
.exp{margin-top:14px;background:var(--sunk);border-radius:10px;padding:11px 14px;font-size:14px}
.exp b.v{font-weight:900}.exp .okc{color:var(--ok)}.exp .badc{color:var(--bad)}
.qnav{margin-top:16px;justify-content:space-between}
.omr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 130px);overflow:auto}
.omr h3{font-size:13px;color:var(--muted);font-weight:500;margin:10px 0 6px}.omr h3:first-child{margin-top:0}
.bub{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:5px}
.bub button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;padding:0;color:var(--muted)}
.bub button.a{background:var(--omr);border-color:var(--omr);color:var(--on-omr);font-weight:700}
.bub button.f{border-color:var(--mn-line);box-shadow:0 0 0 2px var(--mn-bg)}
.bub button.cur{outline:2px solid var(--ink);outline-offset:1px}
.bub button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bub button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--mn-bg);border:1px dashed var(--mn-line);color:var(--mn-ink);border-radius:10px;padding:12px 14px}

/* 결과 */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score .big{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--muted)}
.stamp{display:inline-block;font-family:var(--display);font-size:22px;border:3px solid currentColor;border-radius:8px;padding:2px 14px;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok)}.stamp.bad{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:86px 1fr 74px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:6px}
.bar .tr::after{content:"";position:absolute;left:40%;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.45}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rev{display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:13px 15px}
.ritem.x{border-left-color:var(--bad)}
.ritem .q{font-weight:700;margin-bottom:6px}
.ritem ol{margin:0 0 8px;padding:0;list-style:none;font-size:14px}
.ritem li.ans{color:var(--ok);font-weight:700}.ritem li.mine{color:var(--bad);text-decoration:line-through}
.ritem .e{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 11px}

/* 암기노트 */
.secs{display:flex;gap:6px;flex-wrap:wrap}
.secs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.secs button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface);font-weight:700}
.sechead{border-left:6px solid var(--c);padding-left:12px}
.sechead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cards{columns:2;column-gap:14px}
.ncard{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:11px;padding:13px 14px;margin:0 0 14px}
.ncard h3{font-family:var(--display);font-weight:400;font-size:17px;margin-bottom:6px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who .face{width:48px;height:53px;flex:none}
.who b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--c);display:block;line-height:1.2}
.who span{font-size:13px;color:var(--muted)}
.mn{background:var(--mn-bg);border:1.5px dashed var(--mn-line);border-radius:9px;padding:7px 11px;margin:4px 0 8px;display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap}
.mn .k{font-family:var(--display);font-size:21px;color:var(--hl);line-height:1.25}
.mn .s{font-size:13px;color:var(--mn-ink);min-width:0}.mn .s b{color:var(--hl);font-weight:900}
.ncard ul{list-style:none;margin:0;padding:0;font-size:14px}
.ncard li{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
.ncard li:last-child{border:0}
.ncard li>b{font-weight:700}
.ncard em{font-style:normal;color:var(--hl);font-weight:900;background:var(--hl-bg);border-radius:3px;padding:0 2px}
.ncard u{text-decoration:underline;text-decoration-color:var(--s1);text-underline-offset:3px}
.ncard table{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
.ncard th,.ncard td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
.ncard th{background:var(--sunk);font-weight:700}
.ncard td small{color:var(--muted)}
.quote{border-left:3px solid var(--c);background:var(--sunk);padding:6px 10px;margin:4px 0 8px;font-size:14px}
.tip{margin-top:8px;background:var(--sunk);border-radius:7px;padding:5px 9px;font-size:13px}
.tip::before{content:"함께 외우기 ";font-weight:700;color:var(--c)}
.kn{margin-top:9px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.kn input{width:16px;height:16px;accent-color:var(--ok)}
.hiding .ncard li>span,.hiding .ncard td,.hiding .mn .s{filter:blur(6px);cursor:pointer;user-select:none}
.hiding .ncard .rv li>span,.hiding .ncard .rv td,.hiding .mn.rv .s,.hiding .ncard li.rv>span{filter:none}

/* 플래시카드 */
.fc{max-width:620px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.fcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:26px 22px;text-align:center;min-height:230px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.fcard .k{font-family:var(--display);font-size:clamp(28px,7vw,42px);color:var(--hl);line-height:1.25}
.fcard .ncard{border:0;padding:0;margin:0;text-align:left;background:none}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}

.empty{text-align:center;color:var(--muted);padding:34px 10px}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){
  .hero,.info{grid-template-columns:1fr}.ways{grid-template-columns:1fr 1fr}.picks{grid-template-columns:1fr 1fr}
  .run{grid-template-columns:1fr}.omr{position:static;max-height:none}.cards{columns:1}
  .runbar{top:calc(env(safe-area-inset-top,0px) + 88px)}
  nav{flex-basis:100%;margin-top:-6px}.brand{padding-bottom:0}nav a{padding:9px 10px}
}
@media (max-width:460px){.picks{grid-template-columns:1fr}.score{grid-template-columns:1fr}.bar{grid-template-columns:70px 1fr 64px}.ncard li{grid-template-columns:1fr;gap:0}.ncard li>span{color:var(--muted)}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.way,.pick{transition:border-color .12s,background .12s}}
</style>

<header class="top"><div class="in">
  <a class="brand" href="#home">임상심리사 2급 <b>합격노트</b></a>
  <nav id="nav">
    <a href="#home" data-v="home">홈</a><a href="#exam" data-v="exam">모의시험</a><a href="#study" data-v="study">암기노트</a><a href="#cards" data-v="cards">두문자 카드</a><a href="#wrong" data-v="wrong">오답노트</a>
  </nav>
</div></header>

<script>
const D = {"subj":["심리학개론","이상심리학","심리검사","임상심리학","심리상담"],"q":[{"n":1,"s":0,"q":"피아제의 인지발달 단계에서 “대상영속성”을 획득하는 시기는?","o":["전조작기","감각운동기","구체적 조작기","형식적 조작기"],"a":1,"e":"눈앞에서 사라져도 대상이 계속 존재함을 아는 능력 → 감각운동기(0~2세). 단계 순서 “감전구형”."},{"n":2,"s":0,"q":"피아제 이론에서 보존개념, 가역성, 서열화가 가능해지는 단계는?","o":["감각운동기","전조작기","형식적 조작기","구체적 조작기"],"a":3,"e":"구체적 조작기(7~11세): 보존·가역성·서열화·유목화. 전조작기는 자기중심성·물활론."},{"n":3,"s":0,"q":"에릭슨의 심리사회적 발달단계 중 청소년기의 발달 과업(위기)은?","o":["근면성 대 열등감","친밀감 대 고립감","주도성 대 죄책감","정체감 대 역할혼미"],"a":3,"e":"“신자주근 정친생통” 중 다섯 번째 = 정체감(청소년기)."},{"n":4,"s":0,"q":"낯선 상황 실험에서 어머니와 분리되어도 거의 울지 않고, 다시 만나도 어머니를 피하거나 무시하는 애착 유형은?","o":["안정 애착","불안정-회피 애착","불안정-저항(양가) 애착","혼란 애착"],"a":1,"e":"회피형: 분리에도 무덤덤, 재회 시 회피. 저항(양가)형: 심하게 울고 재회 시 매달리면서도 밀어냄."},{"n":5,"s":0,"q":"파블로프의 실험에서 조건형성이 이루어진 후, 침 분비를 일으키는 “종소리”는 무엇에 해당하는가?","o":["무조건자극(UCS)","조건자극(CS)","무조건반응(UCR)","중성반응"],"a":1,"e":"먹이=무조건자극, 종소리=(학습 후) 조건자극, 종소리에 대한 침=조건반응."},{"n":6,"s":0,"q":"다음 중 “부적 강화”의 예로 가장 적절한 것은?","o":["숙제를 해 온 학생에게 칭찬 스티커를 주었다","안전벨트를 매면 시끄러운 경고음이 꺼져서, 벨트를 매는 행동이 늘었다","떠든 학생에게 벌점을 주었다","약속을 어긴 자녀의 게임 시간을 없앴다"],"a":1,"e":"부적 강화 = 싫은 자극을 “제거”하여 행동 “증가”. 스티커=정적 강화, 벌점=정적 처벌, 게임 금지=부적 처벌."},{"n":7,"s":0,"q":"슬롯머신 도박처럼 몇 번째 반응에서 보상이 나올지 예측할 수 없는 강화계획으로, 반응률이 가장 높고 소거가 잘 되지 않는 것은?","o":["고정비율 계획","변동간격 계획","고정간격 계획","변동비율 계획"],"a":3,"e":"반응률: 변동비율 > 고정비율 > 변동간격 > 고정간격. “변비가 제일 세다”."},{"n":8,"s":0,"q":"밀러(Miller)가 제시한 단기기억의 용량은?","o":["7±2 항목","3±1 항목","12±2 항목","용량의 제한이 없다"],"a":0,"e":"단기기억: 용량 7±2(매직넘버 7), 지속시간 약 20~30초. 청킹으로 늘릴 수 있음."},{"n":9,"s":0,"q":"이전에 학습한 내용이 새로 학습한 내용의 기억을 방해하는 현상은?","o":["역행간섭","인출 실패","부호화 특수성","순행간섭"],"a":3,"e":"순행 = 옛것 → 새것 방해. 역행 = 새것 → 옛것 방해."},{"n":10,"s":0,"q":"마음속으로는 미워하는 사람에게 오히려 지나치게 친절하게 대하는 방어기제는?","o":["투사","합리화","반동형성","전치"],"a":2,"e":"반동형성 = 속마음과 반대로 행동. “미운 놈 떡 하나 더 준다”."},{"n":11,"s":0,"q":"성격의 5요인 모형(Big Five)에 포함되지 \u003cu>않는\u003c/u> 것은?","o":["개방성","지배성","성실성","신경증"],"a":1,"e":"5요인 “개성외우신”: 개방성·성실성·외향성·우호성·신경증."},{"n":12,"s":0,"q":"매슬로의 욕구위계에서 가장 상위에 있는 욕구는?","o":["존중의 욕구","소속과 애정의 욕구","자아실현의 욕구","안전의 욕구"],"a":2,"e":"생리 → 안전 → 소속·애정 → 존중 → 자아실현. “생안소존자”."},{"n":13,"s":0,"q":"타인의 행동 원인을 추론할 때 상황 요인은 과소평가하고 성격 등 성향 요인을 과대평가하는 경향은?","o":["자기고양 편향","허위 합의 효과","기본적 귀인오류","후광 효과"],"a":2,"e":"기본적 귀인오류 = “남의 행동은 성격 탓”. 자기고양 편향 = 성공은 내 덕, 실패는 상황 탓."},{"n":14,"s":0,"q":"태도와 행동이 일치하지 않을 때 생기는 불편감을 줄이기 위해 태도를 바꾼다고 설명하는 이론과 학자는?","o":["인지부조화 이론 – 페스팅거","사회비교 이론 – 애쉬","균형 이론 – 밀그램","귀인 이론 – 반두라"],"a":0,"e":"페스팅거의 인지부조화. 애쉬=동조(선분 실험), 밀그램=복종(전기충격 실험)."},{"n":15,"s":0,"q":"권위자의 명령에 따라 타인에게 전기충격을 가하는 실험으로 “복종”을 연구한 학자는?","o":["애쉬","짐바르도","셰리프","밀그램"],"a":3,"e":"밀그램=복종, 애쉬=동조, 짐바르도=교도소 실험(역할), 셰리프=자동운동·규범 형성."},{"n":16,"s":0,"q":"정규분포에서 평균을 중심으로 ±1 표준편차 안에 포함되는 사례의 비율은 약 얼마인가?","o":["약 68%","약 50%","약 95%","약 99%"],"a":0,"e":"±1SD 68% / ±2SD 95% / ±3SD 99.7%."},{"n":17,"s":0,"q":"절대영점이 있어서 “2배, 3배”와 같은 비율 계산이 가능한 측정 척도는?","o":["비율척도","명명척도","서열척도","등간척도"],"a":0,"e":"“명서등비”: 명명(구분) → 서열(순위) → 등간(같은 간격, 온도·IQ) → 비율(절대영점, 키·몸무게)."},{"n":18,"s":0,"q":"실험연구에서 연구자가 의도적으로 조작하는 변인은?","o":["종속변인","가외변인","독립변인","매개변인"],"a":2,"e":"독립변인(원인, 조작) → 종속변인(결과, 측정). 가외변인은 통제 대상."},{"n":19,"s":0,"q":"파킨슨병은 주로 어떤 신경전달물질의 부족과 관련되는가?","o":["세로토닌","아세틸콜린","도파민","GABA"],"a":2,"e":"도파민: 부족 → 파킨슨, 과잉 → 조현병. 아세틸콜린 부족 → 알츠하이머."},{"n":20,"s":0,"q":"콜버그의 도덕성 발달이론에서 “법과 질서를 지켜야 한다”는 판단이 속하는 수준은?","o":["인습 수준","전인습 수준","후인습 수준","무도덕 수준"],"a":0,"e":"전인습(1벌·복종, 2욕구충족) – 인습(3착한 아이, 4법과 질서) – 후인습(5사회계약, 6보편윤리)."},{"n":21,"s":1,"q":"DSM-5에서 조현병과 증상은 같지만 지속 기간이 “1개월 이상 6개월 미만”인 장애는?","o":["조현양상장애","단기 정신병적 장애","조현정동장애","망상장애"],"a":0,"e":"단기 정신병적 장애(1일~1개월) → 조현양상장애(1~6개월) → 조현병(6개월 이상)."},{"n":22,"s":1,"q":"조현병의 음성증상에 해당하지 \u003cu>않는\u003c/u> 것은?","o":["정서적 둔마","무의욕증","환각","무언어증"],"a":2,"e":"환각·망상·와해된 언어/행동은 양성증상(없던 것이 생김)."},{"n":23,"s":1,"q":"주요우울장애 진단을 위해 증상이 지속되어야 하는 최소 기간은?","o":["1주","1개월","2주","6개월"],"a":2,"e":"9개 증상 중 5개 이상이 2주. 우울한 기분 또는 흥미 상실 중 하나는 필수."},{"n":24,"s":1,"q":"제II형 양극성장애의 진단에 필요한 삽화의 조합은?","o":["조증 삽화 + 경조증 삽화","조증 삽화만 1회 이상","경조증 삽화 + 주요우울 삽화","경조증 삽화만 1회 이상"],"a":2,"e":"제I형 = 조증 삽화(1주 이상) 1회 이상. 제II형 = 경조증(4일 이상) + 주요우울."},{"n":25,"s":1,"q":"범불안장애에서 과도한 불안과 걱정이 지속되어야 하는 최소 기간은?","o":["2주","6개월","1개월","2년"],"a":1,"e":"범불안장애 6개월. “걱정을 통제하기 어렵다”가 핵심."},{"n":26,"s":1,"q":"공황장애를 “신체감각에 대한 파국적 오해석”으로 설명한 학자는?","o":["셀리그만(Seligman)","울프(Wolpe)","클락(Clark)","보울비(Bowlby)"],"a":2,"e":"클락의 인지모델: 심장 두근거림 → “심장마비다!”로 오해석 → 불안 증폭."},{"n":27,"s":1,"q":"DSM-5의 “강박 및 관련 장애” 범주에 속하지 \u003cu>않는\u003c/u> 것은?","o":["신체이형장애","수집광","발모광","질병불안장애"],"a":3,"e":"강박 관련 “강신수발피”: 강박·신체이형·수집광·발모광·피부뜯기. 질병불안장애는 신체증상 관련 장애."},{"n":28,"s":1,"q":"외상 사건 후 PTSD와 유사한 증상이 “3일 이상 1개월 이내”로 나타날 때의 진단은?","o":["적응장애","외상후 스트레스장애","급성 스트레스장애","지속성 복합 애도장애"],"a":2,"e":"급성 스트레스장애 3일~1개월, 1개월 넘게 지속되면 PTSD."},{"n":29,"s":1,"q":"한 사람 안에 둘 이상의 서로 다른 성격 상태가 존재하며 번갈아 행동을 지배하는 장애는?","o":["해리성 정체감 장애","해리성 기억상실","이인증/비현실감 장애","조현병"],"a":0,"e":"과거의 “다중인격장애”. 조현병(정신분열)과 혼동하지 말 것."},{"n":30,"s":1,"q":"신경학적 원인 없이 마비·실명 등 운동이나 감각 기능의 이상이 나타나는 장애는?","o":["전환장애","질병불안장애","인위성 장애","신체이형장애"],"a":0,"e":"전환장애 = 기능성 신경학적 증상장애. 인위성 장애는 환자 역할을 위해 증상을 “꾸며냄”."},{"n":31,"s":1,"q":"신경성 폭식증의 특징으로 옳지 \u003cu>않은\u003c/u> 것은?","o":["통제력을 잃고 폭식하는 삽화가 반복된다","정상 체중에 현저히 못 미치는 저체중을 보인다","구토·하제 사용 등 부적절한 보상행동을 한다","체형과 체중이 자기평가에 과도한 영향을 미친다"],"a":1,"e":"폭식증은 대개 정상 체중 범위. 현저한 저체중은 신경성 식욕부진증의 특징."},{"n":32,"s":1,"q":"B군 성격장애에 속하지 \u003cu>않는\u003c/u> 것은?","o":["회피성 성격장애","경계성 성격장애","연극성 성격장애","자기애성 성격장애"],"a":0,"e":"B군 “반경연자”: 반사회성·경계성·연극성·자기애성. 회피성은 C군(회의강)."},{"n":33,"s":1,"q":"불안정한 대인관계, 정체감 혼란, 충동성, 버림받는 것에 대한 극심한 두려움, 반복적 자해가 특징인 성격장애는?","o":["연극성 성격장애","경계성 성격장애","의존성 성격장애","조현형 성격장애"],"a":1,"e":"경계성: 이상화↔평가절하를 오가는 관계, 만성적 공허감. DBT가 대표적 치료."},{"n":34,"s":1,"q":"관계사고, 마술적 사고, 기이한 믿음과 행동을 보이지만 조현병 수준에는 이르지 않는 성격장애는?","o":["조현성 성격장애","편집성 성격장애","회피성 성격장애","조현형 성격장애"],"a":3,"e":"조현“형” = 기이함. 조현“성” = 관계에 무관심·고립. 편집성 = 의심·불신."},{"n":35,"s":1,"q":"반사회성 성격장애의 진단 기준으로 옳은 것은?","o":["15세 이상이면 진단할 수 있다","18세 이상이며, 15세 이전에 품행장애의 증거가 있어야 한다","12세 이전에 ADHD 진단이 있어야 한다","아동기부터 진단할 수 있다"],"a":1,"e":"아동·청소년기에는 품행장애, 18세 이상부터 반사회성 성격장애."},{"n":36,"s":1,"q":"DSM-5에서 ADHD 진단을 위해 증상이 나타나야 하는 연령 기준은?","o":["12세 이전","7세 이전","15세 이전","18세 이전"],"a":0,"e":"DSM-5에서 7세 → 12세 이전으로 변경. 2개 이상 장면, 6개월 이상."},{"n":37,"s":1,"q":"자폐 스펙트럼 장애의 두 가지 핵심 증상은?","o":["부주의 / 과잉행동-충동성","운동 틱 / 음성 틱","지적 기능 결함 / 적응 기능 결함","사회적 의사소통의 결함 / 제한적이고 반복적인 행동·관심"],"a":3,"e":"부주의/과잉행동=ADHD, 운동·음성 틱=투렛장애, 지적·적응 기능 결함=지적장애."},{"n":38,"s":1,"q":"만성 알코올 중독에서 티아민(비타민 B1) 결핍으로 생기며 심한 기억장애와 작화증을 보이는 것은?","o":["진전섬망","코르사코프 증후군","알코올성 환각증","금단 발작"],"a":1,"e":"베르니케-코르사코프 증후군. 진전섬망은 금단 시의 떨림·환시·의식 혼탁."},{"n":39,"s":1,"q":"알츠하이머병으로 인한 신경인지장애의 초기에 가장 두드러지는 증상은?","o":["오래된 과거 기억의 완전한 상실","갑작스러운 의식 소실","환청과 피해망상","최근 일에 대한 기억력 저하"],"a":3,"e":"최근 기억(새로운 학습)부터 서서히 저하. 아세틸콜린 감소와 관련."},{"n":40,"s":1,"q":"우울증의 귀인이론에 따르면, 우울한 사람은 실패 경험을 어떻게 귀인하는 경향이 있는가?","o":["외부적 · 안정적 · 특수적 귀인","내부적 · 불안정적 · 특수적 귀인","외부적 · 불안정적 · 전반적 귀인","내부적 · 안정적 · 전반적 귀인"],"a":3,"e":"“내 탓(내부), 늘 그럴 것(안정), 뭘 해도(전반)” → “내안전”. 에이브럼슨 등의 개정된 학습된 무기력 이론."},{"n":41,"s":2,"q":"문항 내적 합치도(내적 일관성) 신뢰도를 나타내는 지수는?","o":["크론바흐 알파 계수","검사-재검사 상관계수","카파 계수","난이도 지수"],"a":0,"e":"신뢰도 “재동반내”. 내적 합치도 = 크론바흐 α, KR-20."},{"n":42,"s":2,"q":"새로 만든 우울검사의 점수와 이미 타당성이 입증된 기존 우울검사 점수의 상관을 같은 시점에 구했다. 이는 어떤 타당도인가?","o":["예언타당도","공인타당도","내용타당도","안면타당도"],"a":1,"e":"준거타당도 = 공인(현재 시점) + 예언(미래 예측)."},{"n":43,"s":2,"q":"Z점수가 +1.0인 사람의 T점수는?","o":["55","65","115","60"],"a":3,"e":"T = 50 + 10Z = 60. (IQ로는 100 + 15×1 = 115)"},{"n":44,"s":2,"q":"웩슬러 지능검사에서 사용하는 편차지능지수의 평균과 표준편차는?","o":["평균 100, 표준편차 15","평균 100, 표준편차 10","평균 50, 표준편차 10","평균 10, 표준편차 3"],"a":0,"e":"IQ 100/15, T점수 50/10, 소검사 환산점수 10/3."},{"n":45,"s":2,"q":"K-WAIS-IV에서 “작업기억 지표”의 핵심 소검사로 묶인 것은?","o":["공통성, 어휘","토막짜기, 퍼즐","동형찾기, 기호쓰기","숫자, 산수"],"a":3,"e":"언어이해(공통성·어휘·상식) / 지각추론(토막·행렬·퍼즐) / 작업기억(숫자·산수) / 처리속도(동형·기호)."},{"n":46,"s":2,"q":"지능이 일반요인(g)과 특수요인(s)으로 구성된다는 2요인설을 주장한 학자는?","o":["서스톤","스피어만","길포드","가드너"],"a":1,"e":"스피어만 g·s / 서스톤 7개 기본정신능력 / 길포드 지능구조 3차원 / 가드너 다중지능."},{"n":47,"s":2,"q":"뇌손상 환자의 병전 지능을 추정할 때 주로 활용하는 웩슬러 소검사는?","o     <a class="way c3" href="#cards"><b>두문자 카드</b><span>${MN.length}개 암기법을 한 장씩. 못 외운 것만 골라 반복합니다.</span></a>
    <a class="way c5" href="#wrong"><b>오답노트</b><span>틀린 문제가 자동으로 모입니다. 다시 맞히면 목록에서 빠집니다.</span></a>

  <footer>문제는 실제 기출이 아니라 출제 범위의 핵심 개념으로 만든 예상문제입니다. 시험 일정과 세부 기준은 Q-Net 공고를 확인하세요.
    <div class="row" style="margin-top:8px">${ui.askReset ? `<span>진도·오답·기록을 모두 지울까요?</span><button class="btn sm" data-act="reset-yes">모두 지우기</button><button class="btn sm" data-act="reset-no">취소</button>` : `<button class="btn sm" data-act="reset-ask">학습 기록 초기화</button>`}</div>
  </footer>`;
}

/* ---------- 모의시험 ---------- */
function examSetup() {
  const nw = Object.keys(st.wrong).length;
  return `
  <div><h1 class="h2">모의시험</h1><p class="muted" style="margin:4px 0 0">실제 필기시험과 같은 과목·문항 수로 구성했습니다.</p></div>
  <div class="row"><div class="seg" role="group" aria-label="풀이 방식">
    <button aria-pressed="${!ui.study}" data-act="mode" data-v="0">시험 모드</button><button aria-pressed="${ui.study}" data-act="mode" data-v="1">학습 모드</button></div>
    <span class="small muted">${ui.study ? '답을 고르면 바로 정답과 해설이 나옵니다. 시간 제한이 없습니다.' : '시간을 재고, 제출한 뒤에 채점합니다.'}</span></div>
  <div class="picks">
    <button class="pick" data-act="start" data-m="full"><b>전체 모의시험</b><span>100문항 · ${ui.study ? '시간 제한 없음' : '150분'}</span></button>
    ${D.subj.map((s, i) => `<button class="pick c${i + 1}" data-act="start" data-m="s${i}"><b>${i + 1}과목 ${s}</b><span>20문항 · ${ui.study ? '시간 제한 없음' : '30분'}</span></button>`).join('')}
    <button class="pick" data-act="start" data-m="wrong" ${nw ? '' : 'disabled'}><b>오답만 다시 풀기</b><span>${nw ? nw + '문항 · 시간 제한 없음' : '아직 오답이 없습니다'}</span></button>
    <button class="pick" data-act="start" data-m="rand"><b>랜덤 20문항</b><span>전 과목에서 무작위 · ${ui.study ? '시간 제한 없음' : '30분'}</span></button>
  </div>
  ${st.last ? `<div class="row"><button class="btn" data-act="show-last">지난 결과 다시 보기</button></div>` : ''}`;
}
function startExam(m) {
  let ids, label, dur;
  if (m === 'full') { ids = D.q.map(q => q.n); label = '전체 100문항'; dur = 9000; }
  else if (m === 'wrong') { ids = Object.keys(st.wrong).map(Number).sort((a, b) => a - b); label = '오답 다시 풀기'; dur = 0; }
  else if (m === 'rand') { ids = shuffle(D.q.map(q => q.n)).slice(0, 20).sort((a, b) => a - b); label = '랜덤 20문항'; dur = 1800; }
  else { const s = +m[1]; ids = D.q.filter(q => q.s === s).map(q => q.n); label = (s + 1) + '과목 ' + D.subj[s]; dur = 1800; }
  if (!ids.length) return;
  const study = ui.study || m === 'wrong';
  st.cur = { mode: m, label, ids, ans: {}, flag: {}, i: 0, start: Date.now(), dur: study ? 0 : dur, study };
  ui.askSubmit = false; save(); render(); scrollTo(0, 0);
}
function remain() { const c = st.cur; return c.dur ? c.dur - Math.floor((Date.now() - c.start) / 1000) : null; }
function examRun() {
  const c = st.cur, n = c.ids[c.i], q = QN[n], a = c.ans[n], done = Object.keys(c.ans).length;
  const locked = c.study && a != null;
  const groups = [...new Set(c.ids.map(id => QN[id].s))];
  return `
  <div class="runbar"><b>${c.label}</b>${c.study ? '<span class="chip">학습 모드</span>' : `<span class="t" id="timer">${fmt(remain())}</span>`}
    <span class="small muted">${done} / ${c.ids.length} 답함</span><span class="sp"></span>
    <button class="btn sm" data-act="quit-ask">그만두기</button><button class="btn pri sm" data-act="submit-ask">${c.study ? '마치기' : '제출'}</button></div>
  ${ui.askSubmit === 'submit' ? `<div class="confirm row"><span>${c.ids.length - done ? `아직 안 푼 문제가 ${c.ids.length - done}개 있습니다. ` : ''}${c.study ? '여기서 마치고 결과를 볼까요?' : '제출하고 채점할까요?'}</span><button class="btn pri sm" data-act="submit">${c.study ? '마치기' : '제출하기'}</button><button class="btn sm" data-act="cancel">계속 풀기</button></div>` : ''}
  ${ui.askSubmit === 'quit' ? `<div class="confirm row"><span>지금 그만두면 이번 풀이는 기록되지 않습니다.</span><button class="btn sm" data-act="quit">그만두기</button><button class="btn sm" data-act="cancel">계속 풀기</button></div>` : ''}
  <div class="run">
    <article class="qcard c${q.s + 1}">
      <div class="row"><span class="chip">${D.subj[q.s]}</span><span class="small muted">${c.i + 1} / ${c.ids.length}</span></div>
      <div class="qt"><i>${n}.</i><span>${q.q}</span></div>
      <div class="opts">${q.o.map((t, i) => `<button class="opt ${locked ? (i === q.a ? 'right' : i === a ? 'wrong' : '') : (i === a ? 'sel' : '')}" data-act="ans" data-i="${i}" ${locked ? 'disabled' : ''}><span class="b">${i + 1}</span><span>${t}</span></button>`).join('')}</div>
      ${locked ? `<div class="exp"><b class="v ${a === q.a ? 'okc' : 'badc'}">${a === q.a ? '정답입니다.' : '오답입니다. 정답은 ' + C[q.a] + '번.'}</b> ${q.e}</div>` : ''}
      <div class="row qnav"><button class="btn" data-act="prev" ${c.i ? '' : 'disabled'}>이전</button>
        <button class="btn sm" data-act="flag">${c.flag[n] ? '표시 해제' : '나중에 다시 보기'}</button>
        <button class="btn ${a != null ? 'pri' : ''}" data-act="next" ${c.i < c.ids.length - 1 ? '' : 'disabled'}>다음</button></div>
    </article>
    <aside class="omr" aria-label="답안지">${groups.map(s => `<h3>${D.subj[s]}</h3><div class="bub">${c.ids.map((id, idx) => QN[id].s !== s ? '' : `<button class="${c.study && c.ans[id] != null ? (c.ans[id] === QN[id].a ? 'r' : 'w') : c.ans[id] != null ? 'a' : ''} ${c.flag[id] ? 'f' : ''} ${idx === c.i ? 'cur' : ''}" data-act="jump" data-i="${idx}" aria-label="${id}번">${id}</button>`).join('')}</div>`).join('')}
      <p class="small muted" style="margin:10px 0 0">숫자 키 1~4로 답을 고르고 ←→로 이동할 수 있습니다.</p></aside>
  </div>`;
}
function submitExam() {
  const c = st.cur; if (!c) return;
  const per = [0, 0, 0, 0, 0], tot = [0, 0, 0, 0, 0]; let ok = 0;
  for (const id of c.ids) { const q = QN[id]; tot[q.s]++; if (c.ans[id] === q.a) { ok++; per[q.s]++; delete st.wrong[id]; } else st.wrong[id] = (st.wrong[id] || 0) + 1; }
  let pass = null;
  if (c.mode === 'full') pass = ok >= 60 && per.every(x => x >= 8);
  else if (c.mode[0] === 's' || c.mode === 'rand') pass = ok / c.ids.length >= 0.6;
  const r = { t: Date.now(), mode: c.mode, label: c.label, ids: c.ids, ans: c.ans, n: c.ids.length, c: ok, per, tot, pass, used: Math.floor((Date.now() - c.start) / 1000) };
  st.last = r; st.hist.unshift({ t: r.t, mode: r.mode, label: r.label, n: r.n, c: r.c, pass }); st.hist = st.hist.slice(0, 20);
  st.cur = null; ui.askSubmit = false; ui.result = true; ui.onlyWrong = ok < c.ids.length; save(); render(); scrollTo(0, 0);
}
function examResult() {
  const r = st.last, pct = Math.round(r.c / r.n * 100), full = r.mode === 'full';
  const fail = full ? r.per.map((x, i) => x < 8 ? D.subj[i] : null).filter(Boolean) : [];
  const list = r.ids.filter(id => !ui.onlyWrong || r.ans[id] !== QN[id].a);
  return `
  <div class="row" style="justify-content:space-between"><h1 class="h2">${r.label} 결과</h1><button class="btn" data-act="back-setup">다른 시험 보기</button></div>
  <section class="panel score">
    <div><div class="big">${full ? r.c : pct}<small>점</small></div><div class="muted small">${r.c} / ${r.n} 문항 · ${fmt(r.used)} 소요</div></div>
    <div>${r.pass == null ? '' : `<span class="stamp ${r.pass ? 'ok' : 'bad'}">${r.pass ? '합격선 통과' : '합격선 미달'}</span>`}
      <p style="margin:10px 0 0">${full ? (r.pass ? '평균 60점 이상이고 과락 과목이 없습니다.' : fail.length ? `과락(40점 미만) 과목: <b>${fail.join(', ')}</b>. 이 과목 암기노트부터 다시 보세요.` : '과락은 없지만 평균 60점에 못 미칩니다.') : r.pass == null ? '틀린 문제는 오답노트에 남아 있습니다.' : r.pass ? '이 범위는 60점 기준을 넘었습니다.' : '60점 기준에 못 미칩니다. 해설을 읽고 다시 풀어 보세요.'}</p></div>
  </section>
  ${r.tot.filter(Boolean).length > 1 ? `<section class="panel"><h2 class="h3" style="margin-bottom:10px">과목별 점수 <span class="small muted" style="font-weight:400">점선은 과락 기준 40점</span></h2><div class="bars">
    ${r.tot.map((t, i) => t ? `<div class="bar c${i + 1}"><span>${D.subj[i]}</span><div class="tr"><i style="width:${r.per[i] / t * 100}%"></i></div><span class="v">${r.per[i]} / ${t}</span></div>` : '').join('')}</div></section>` : ''}
  <div class="row" style="justify-content:space-between"><h2 class="h3">문항별 해설</h2><div class="seg"><button aria-pressed="${ui.onlyWrong}" data-act="ow" data-v="1">틀린 문제만</button><button aria-pressed="${!ui.onlyWrong}" data-act="ow" data-v="0">전체</button></div></div>
  <div class="rev">${list.length ? list.map(id => reviewItem(QN[id], r.ans[id])).join('') : '<div class="empty panel">틀린 문제가 없습니다.</div>'}</div>`;
}
function reviewItem(q, a, extra = '') {
  const ok = a === q.a;
  return `<div class="ritem ${ok || a === undefined && extra ? '' : 'x'}"><div class="row" style="margin-bottom:4px"><span class="chip c${q.s + 1}">${D.subj[q.s]}</span>${extra}</div>
    <div class="q">${q.n}. ${q.q}</div>
    <ol>${q.o.map((t, i) => `<li class="${i === q.a ? 'ans' : i === a ? 'mine' : ''}">${C[i]} ${t}${i === q.a ? ' (정답)' : i === a ? ' (내 답)' : ''}</li>`).join('')}</ol>
    ${a == null && !extra ? '<div class="small muted" style="margin-bottom:6px">답을 고르지 않았습니다.</div>' : ''}<div class="e">${q.e}</div></div>`;
}

/* ---------- 암기노트 ---------- */
const hl = s => s.replace(/\[(.+?)\]/g, '<em>$1</em>');
function noteCard(c, withCheck = true) {
  let h = `<article class="ncard ${c.sec.cls}">`;
  if (c.face) h += `<div class="who">${c.face}<div><b>${c.who}</b>${c.img ? `<span>${c.img}</span>` : ''}</div></div>`;
  h += `<h3>${c.t}</h3>`;
  if (c.quote) h += `<div class="quote">${c.quote}</div>`;
  if (c.m) h += `<div class="mn" data-rv><span class="k">${c.m}</span><span class="s">${c.s}</span></div>`;
  if (c.i) h += `<ul>${c.i.map(([a, b]) => `<li data-rv><b>${hl(a)}</b><span>${hl(b)}</span></li>`).join('')}</ul>`;
  if (c.table) h += `<div class="tw" data-rv><table>${c.table.map((r, i) => `<tr>${r.map(x => i ? `<td>${x}</td>` : `<th>${x}</th>`).join('')}</tr>`).join('')}</table></div>`;
  if (c.tip) h += `<div class="tip">${c.tip}</div>`;
  if (c.m && withCheck) h += `<label class="kn"><input type="checkbox" id="kn-${c.id}" data-known="${c.id}" ${st.known[c.id] ? 'checked' : ''}> 외웠어요</label>`;
  return h + `</article>`;
}
function study() {
  const secs = SEC[ui.tab], s = secs[ui.si[ui.tab]];
  return `
  <div><h1 class="h2">암기노트</h1><p class="muted" style="margin:4px 0 0">빨간 글자가 두문자, 노란 상자가 연상 문장입니다.</p></div>
  <div class="row"><div class="seg"><button aria-pressed="${ui.tab === 'w'}" data-act="tab" data-v="w">필기 (6장)</button><button aria-pressed="${ui.tab === 'p'}" data-act="tab" data-v="p">실기 (11장)</button></div>
    <button class="btn sm" data-act="hide" aria-pressed="${!!st.hide}">${st.hide ? '설명 모두 보기' : '설명 가리고 떠올리기'}</button>
    ${st.hide ? '<span class="small muted">흐린 부분을 누르면 보입니다.</span>' : ''}</div>
  <div class="secs">${secs.map((x, i) => `<button class="${x.cls}" aria-pressed="${i === ui.si[ui.tab]}" data-act="sec" data-i="${i}">${x.no}. ${x.short}</button>`).join('')}</div>
  <div class="sechead ${s.cls}"><h2 class="h3">${s.title}</h2><p>${s.sub}</p></div>
  <div class="cards ${st.hide ? 'hiding' : ''}">${s.cards.map(c => noteCard(c)).join('')}</div>
  <div class="row" style="justify-content:space-between"><button class="btn" data-act="sec" data-i="${ui.si[ui.tab] - 1}" ${ui.si[ui.tab] ? '' : 'disabled'}>이전 장</button><button class="btn" data-act="sec" data-i="${ui.si[ui.tab] + 1}" ${ui.si[ui.tab] < secs.length - 1 ? '' : 'disabled'}>다음 장</button></div>`;
}

/* ---------- 두문자 카드 ---------- */
function buildDeck() { ui.deck = shuffle(MN.filter(c => (ui.fcKind === 'all' || c.kind === ui.fcKind) && (!ui.fcTodo || !st.known[c.id])).map(c => c.id)); ui.fi = 0; ui.fshow = false; }
function cards() {
  if (!ui.deck) buildDeck();
  const pool = MN.filter(c => ui.fcKind === 'all' || c.kind === ui.fcKind), kn = pool.filter(c => st.known[c.id]).length;
  const id = ui.deck[ui.fi], c = ALL.find(x => x.id === id);
  return `<div class="fc">
  <div><h1 class="h2">두문자 카드</h1><p class="muted" style="margin:4px 0 0">두문자를 보고 내용을 떠올린 뒤 카드를 뒤집어 확인하세요.</p></div>
  <div class="row"><div class="seg"><button aria-pressed="${ui.fcKind === 'all'}" data-act="fck" data-v="all">전체</button><button aria-pressed="${ui.fcKind === 'w'}" data-act="fck" data-v="w">필기</button><button aria-pressed="${ui.fcKind === 'p'}" data-act="fck" data-v="p">실기</button></div>
    <label class="kn" style="margin:0"><input type="checkbox" id="fc-todo" data-act-change="fctodo" ${ui.fcTodo ? 'checked' : ''}> 못 외운 것만</label></div>
  <div><div class="prog"><i style="width:${pool.length ? kn / pool.length * 100 : 0}%"></i></div><div class="small muted" style="margin-top:4px">${kn} / ${pool.length}개 외움${c ? ` · 이번 묶음 ${ui.fi + 1} / ${ui.deck.length}` : ''}</div></div>
  ${c ? `<div class="fcard ${c.sec.cls}">
      ${ui.fshow ? noteCard(c, false) : `<span class="chip" style="align-self:center">${c.kind === 'w' ? '필기' : '실기'} ${c.sec.no}장 · ${c.sec.short}</span><div class="k">${c.m}</div><div class="h3">${c.t}</div>`}
    </div>
    ${ui.fshow ? `<div class="row" style="justify-content:center"><button class="btn" data-act="fc-no">아직 헷갈려요</button><button class="btn pri" data-act="fc-yes">외웠어요</button></div>`
      : `<div class="row" style="justify-content:center"><button class="btn pri" data-act="fc-flip">뒤집어서 확인</button><button class="btn" data-act="fc-skip">건너뛰기</button></div>`}`
    : `<div class="panel empty">${ui.deck.length ? '이번 묶음을 끝까지 봤습니다.' : '이 조건에 해당하는 카드가 없습니다. 모두 외웠습니다.'}<div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-act="fc-again">다시 섞어서 보기</button></div></div>`}
  </div>`;
}

/* ---------- 오답노트 ---------- */
function wrong() {
  const ids = Object.keys(st.wrong).map(Number).sort((a, b) => a - b);
  const by = [0, 1, 2, 3, 4].map(s => ids.filter(id => QN[id].s === s).length);
  return `
  <div class="row" style="justify-content:space-between"><div><h1 class="h2">오답노트</h1><p class="muted" style="margin:4px 0 0">틀리거나 못 푼 문제가 쌓입니다. 다시 풀어 맞히면 빠집니다.</p></div>
    ${ids.length ? `<button class="btn pri" data-act="start" data-m="wrong">오답 ${ids.length}문항 다시 풀기</button>` : ''}</div>
  ${ids.length ? `<div class="row">${by.map((n, i) => n ? `<span class="chip c${i + 1}">${D.subj[i]} ${n}</span>` : '').join('')}</div>
  <div class="rev">${ids.map(id => reviewItem(QN[id], undefined, `<span class="small muted">${st.wrong[id]}번 틀림</span><button class="btn sm" data-act="unwrong" data-id="${id}" style="margin-left:auto">목록에서 빼기</button>`)).join('')}</div>`
    : `<div class="panel empty">아직 오답이 없습니다. 모의시험을 풀면 틀린 문제가 여기에 모입니다.<div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#exam">모의시험 보러 가기</a></div></div>`}`;
}

/* ---------- 렌더 & 이벤트 ---------- */
function render() {
  const v = view();
  document.querySelectorAll('#nav a').forEach(a => a.dataset.v === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  clearInterval(tick);
  let h;
  if (v === 'exam') h = st.cur ? examRun() : (ui.result && st.last ? examResult() : examSetup());
  else h = { home, study, cards, wrong }[v]();
  app.innerHTML = h;
  if (v === 'exam' && st.cur && st.cur.dur) tick = setInterval(() => { const r = remain(), el = $('#timer'); if (r <= 0) return submitExam(); if (el) el.textContent = fmt(r); }, 1000);
}
function move(d) { const c = st.cur; const n = c.i + d; if (n >= 0 && n < c.ids.length) { c.i = n; save(); render(); } }
function answer(i) { const c = st.cur, n = c.ids[c.i]; if (c.study && c.ans[n] != null) return; c.ans[n] = (!c.study && c.ans[n] === i) ? undefined : i; if (c.ans[n] === undefined) delete c.ans[n]; save(); render(); }
app.addEventListener('click', e => {
  const rv = e.target.closest('.hiding [data-rv]'); if (rv) rv.classList.add('rv');
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, c = st.cur;
  if (a === 'mode') ui.study = b.dataset.v === '1';
  else if (a === 'start') { if (view() !== 'exam') { location.hash = 'exam'; } ui.result = false; return startExam(b.dataset.m); }
  else if (a === 'show-last') ui.result = true;
  else if (a === 'back-setup') ui.result = false;
  else if (a === 'ans') return answer(+b.dataset.i);
  else if (a === 'prev') return move(-1);
  else if (a === 'next') return move(1);
  else if (a === 'jump') { c.i = +b.dataset.i; save(); }
  else if (a === 'flag') { const n = c.ids[c.i]; c.flag[n] ? delete c.flag[n] : c.flag[n] = 1; save(); }
  else if (a === 'submit-ask') ui.askSubmit = 'submit';
  else if (a === 'quit-ask') ui.askSubmit = 'quit';
  else if (a === 'cancel') ui.askSubmit = false;
  else if (a === 'submit') return submitExam();
  else if (a === 'quit') { st.cur = null; ui.askSubmit = false; ui.result = false; save(); }
  else if (a === 'ow') ui.onlyWrong = b.dataset.v === '1';
  else if (a === 'tab') ui.tab = b.dataset.v;
  else if (a === 'sec') { ui.si[ui.tab] = +b.dataset.i; render(); return scrollTo(0, 0); }
  else if (a === 'hide') { st.hide = !st.hide; save(); }
  else if (a === 'fck') { ui.fcKind = b.dataset.v; buildDeck(); }
  else if (a === 'fc-flip') ui.fshow = true;
  else if (a === 'fc-skip') { ui.fi++; ui.fshow = false; }
  else if (a === 'fc-yes' || a === 'fc-no') { const id = ui.deck[ui.fi]; a === 'fc-yes' ? st.known[id] = 1 : delete st.known[id]; ui.fi++; ui.fshow = false; save(); }
  else if (a === 'fc-again') buildDeck();
  else if (a === 'unwrong') { delete st.wrong[b.dataset.id]; save(); }
  else if (a === 'reset-ask') ui.askReset = true;
  else if (a === 'reset-no') ui.askReset = false;
  else if (a === 'reset-yes') { st = { known: {}, wrong: {}, hist: [], cur: null, last: null, hide: false }; ui.askReset = false; ui.deck = null; save(); }
  else return;
  render();
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.known) { t.checked ? st.known[t.dataset.known] = 1 : delete st.known[t.dataset.known]; save(); }
  else if (t.dataset.actChange === 'fctodo') { ui.fcTodo = t.checked; buildDeck(); render(); }
});
addEventListener('keydown', e => {
  if (view() !== 'exam' || !st.cur || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '4') answer(+e.key - 1);
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
});
addEventListener('hashchange', () => { ui.askSubmit = false; ui.askReset = false; render(); scrollTo(0, 0); });
render();
</script>

</body></html>
